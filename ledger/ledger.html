address and sends no reminder.\n\nClaude Code 2.1.258 was not affected, because that reminder also carried `# claudeMd` and `# currentDate`. In 2.1.283 the address is all it holds. Sandbox fixed the same defect in its own replay tier as SBX-086.","notes":[{"date":"2026-09-26","text":"The fix moved to cs-vcr. Its ruleset v15 removes the account reminder whole when cutting the address leaves it empty, on both sides (VCR-042). Campaign takes it by moving its cs-vcr pin, and its fabricated credential tree stays as it was."}],"links":[]},{"id":"SAC-081","title":"Three Claude scenarios miss on replay when Claude Code reports that the machine behaved differently","type":"defect","severity":"high","status":"closed","foundBy":"session agent, replaying the cassettes re-recorded for the move to sandbox d9279e7 and Claude Code 2.1.283","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["c8fd7b4","cac0cb2"],"integrated":[],"verified":"`make ci` passed on cac0cb2. The claude-api-key, claude-subscription and claude-fault-capacity replays passed with 0 misses, out of 43, 47 and 52 requests. None of the three reported a command that failed on replay."},"resolution":"The cs-vcr ruleset v15 cuts the two reminders Claude Code writes only when something happened on the machine, the environment update and the background-task notification (VCR-043 in cs-vcr). Campaign took it with its cs-vcr pin in c8fd7b4. The commands that failed on replay are gone as well, because the fixed commit dates of SAC-084 give a replay the hashes its recording had.","details":"Recorded on Claude Code 2.1.283, claude-api-key, claude-subscription and claude-fault-capacity miss in `make test-smoke` at the same step on every run: 16, 19 and 29.\n\nAt the first two, the recording has an `# Environment update` reminder saying the orchestrator's shell moved, and the replay does not. The orchestrator ran `cd ~/subject && git status && git diff \u003cbase commit> campaign/dev/subject --stat`, naming the base commit by its hash. That hash exists only in the recording's subject repository, whose commits are made fresh on each run. The command failed in the replay, so the shell stayed where it was. At step 29 the recording has a background-task notification for a command that outlived its timeout, and the replay's command finished in time.\n\nClaude Code writes both reminders only when something happened on the machine, which a replay does not reproduce by design. The cs-vcr record VCR-043 holds the rule that cuts them.","notes":[],"links":["SAC-080"]},{"id":"SAC-082","title":"A Claude orchestrator's wait is moved to the background halfway through its chunk","type":"defect","severity":"high","status":"closed","foundBy":"session agent, replaying the claude-subscription cassette recorded on Claude Code 2.1.283","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["cac0cb2"],"integrated":[],"verified":"`go test ./internal/cli/ -run TestAClaudeOrchestratorsWaitFitsItsBashTimeout -count=1` passes on cac0cb2 and fails on c8fd7b4, which lacks the fix. No cassette re-recorded in cac0cb2 holds a command moved to the background. `make ci` passed with all 9 scenarios replayed."},"resolution":"A Claude orchestrator is created with `BASH_DEFAULT_TIMEOUT_MS` set to one wait chunk plus a minute, 300 seconds, so its wait stays in the foreground. A profile's own value still wins. PROTOCOL.md §8 now says the chunk has to fit inside the adapter's bound, and the comment on `DefaultWaitSeconds` no longer claims it does for every adapter.","details":"The orchestrator's `wait` blocks for up to one chunk, 240 seconds by default. Claude Code bounds a single Bash call at 120 seconds by default. Past that bound it does not fail the command: it moves it to the background and returns at once, saying `Command did not complete within its 120s timeout and was moved to the background`.\n\nA Claude orchestrator whose wait sees nothing to act on for two minutes therefore stops blocking. It carries on working, or it ends its turn and is woken when the task finishes, in a turn the host did not start. PROTOCOL.md §8 rules that out, because a provider error in such a turn is recorded nowhere. The comment on `DefaultWaitSeconds` says that 240 seconds sits well inside every adapter's cap, and for Claude Code it does not.\n\nMeasured in Claude Code 2.1.258 and 2.1.283 alike, on a 150-second command in an interactive session: both moved it to the background at 120 seconds. With `BASH_DEFAULT_TIMEOUT_MS=300000` in the environment, 2.1.283 ran it in the foreground to completion. The recorded claude-subscription orchestrator hit this at its 21st request, and its replay then stopped a background task by an ID that exists only in the recording.","notes":[],"links":["SAC-081"]},{"id":"SAC-083","title":"An orchestrator can run the campaign before its mission opens, working from mission.md","type":"defect","severity":"high","status":"closed","foundBy":"session agent, tracing why two recorded orchestrators kept going after their readback","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["cac0cb2"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run 'TestGate|TestTheCampaignVerbsWaitForTheMission' -count=1` passes on cac0cb2, and the second test fails on c8fd7b4, which lacks the guard. In the re-recording, the opencode-fireworks orchestrator kept going after its readback, met the refusal and ended its turn, and m1 opened after it. `make ci` passed with all 9 scenarios replayed."},"resolution":"The verbs that act on the campaign, which are send, accept, restart, wait and push, refuse unless the orchestrator's mission dispatch is open. An early turn is told to end, so the mission opens behind it within seconds. A mission closed by its reply refuses them too. Looking stays open: list, observe, read, fetch and note.","details":"The readback dispatch tells the orchestrator not to do any of the work yet, and the reply that closes it says it may finish its turn. Nothing enforces either. An orchestrator that keeps going can dispatch, wait on and judge its team with no open dispatch of its own, working from the mission.md in its standing inputs. The host counts it as free meanwhile, outside its deadline and recovery accounting.\n\nThe quiet wait added in a9d30a0 was meant to stop this. It withholds the mission until the readback turn ends, reasoning that an empty inbox leaves the turn nothing to carry on with. The file mission.md is already among the inputs, so the turn carries on anyway. Past two minutes the mission is opened behind the running turn, at a point set by the clock, which a replay cannot reproduce.\n\nTwo of four Claude orchestrators recorded on 2.1.283 did this, and both replays then failed their final reply. Simulated from scratch, about one readback in six keeps going, under 2.1.258 and 2.1.283 alike.","notes":[],"links":["SAC-081","SAC-082"]},{"id":"SAC-084","title":"Recorded commands name commits that do not exist on replay, so they fail there","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading the failed commands in the claude-api-key replay","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["cac0cb2"],"integrated":[],"verified":"`go test -tags smoke ./internal/cli/ -run TestTheSubjectRepoHasTheSameBaseEveryRun -count=1` passes on cac0cb2 and fails on c8fd7b4, where two seeds a second apart had different bases. No cassette re-recorded in cac0cb2 holds `bad object`. `make ci` passed, and no Claude scenario reported a command that failed on replay, where each reported 9 to 28 before."},"resolution":"The live tiers seed the subject repository and run every member with a fixed author, committer and date, so a commit's hash is the same on every run. A replay's commands name commits that exist.","details":"The live tiers seed the subject repository fresh on every run, and git stamps each commit with the time it was made. The base commit therefore has a new hash on every run, and so has every commit a member makes. The file member.json hands the orchestrator the base hash, and a recorded orchestrator uses it in commands such as `git diff \u003cbase> campaign/dev/subject --stat`.\n\nA replay serves those commands verbatim. The commit each one names exists only in the recording's repository, so the command fails with `fatal: bad object` where it succeeded when recorded. The replay counts them as commands that failed here, 9 to 28 per Claude scenario. On 2.1.283 a failed command also changes the request itself, which VCR-043 now tolerates. A failed commit or merge would change what the campaign produced.\n\nA hash is fixed by its content, its parents, its author and committer, and their dates. Fixing the identity and the dates, for the seed and for the members, gives a replay the hashes its recording had.","notes":[],"links":["SAC-081"]},{"id":"SAC-085","title":"A replayed codex member was once handed its readback prompt a second time after it had replied","type":"defect","severity":"low","status":"open","foundBy":"session agent, reading the one replay miss in the codex-fault-unauthorized scenario during `make ci` on cac0cb2","opened":"2026-09-26","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"In one `make ci` replay the codex-fault-unauthorized dev made a 15th request after its 14 recorded steps were served, so cs-vcr reported 1 miss. The scenario still passed with its expected verdict, campaign-blocked. The same cassettes replayed with 0 misses in the `make test-smoke` run just before.\n\nThe unpaired request shows why. The dev's first readback was malformed, as it was when recorded, so create asked again as dispatch d002. Its answer to d002 was accepted. Two seconds later its session received the d002 trigger a second time, word for word: `Read ~/.local/share/cs-campaign/input/d002.001.md and follow it. Dispatch ID: d002.`\n\nCampaign's host sends that trigger once per dispatch, and the text is the trigger rather than a continue or a resume. The second copy therefore came from below the host, in `cs-codex-remote` or its turn driver, or from the codex TUI itself. The members were destroyed after the run, so their session transcripts are gone. Under the fault the extra turn was refused anyway. Without one, a doubled trigger would cost a member an unrequested turn on a closed dispatch.","notes":[],"links":[]},{"id":"SAC-086","title":"An OpenCode orchestrator's wait is killed at 120 seconds, halfway through its chunk","type":"defect","severity":"med","status":"closed","foundBy":"session agent, measuring how each agent CLI treats a 150-second command while tracing SAC-082","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["d1d3369"],"integrated":[],"verified":"`go test ./internal/cli/ -run TestAnOrchestratorsWaitFitsItsShellTimeout -count=1` passes on d1d3369, and fails with the OpenCode entry taken out. The variable itself was measured on the host, as the note records. `make ci` passed on fdef140. No smoke scenario runs an OpenCode orchestrator, so the replay tier does not reach this. The opencode-fireworks scenario was re-recorded after the change and replays with 0 misses."},"resolution":"An OpenCode orchestrator is created with `OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS` at one wait chunk plus a minute, as a Claude orchestrator is with `BASH_DEFAULT_TIMEOUT_MS`. One table names the variable each adapter's shell bound is set by, and a profile's own value still wins. PROTOCOL.md §8 now says OpenCode kills a call past its bound.","details":"The orchestrator's `wait` blocks for up to one chunk, 240 seconds by default. OpenCode 1.18.32 bounds a shell call at 120 seconds unless the model passes a larger timeout. Past the bound it kills the command and says `shell tool terminated command after exceeding timeout 120000 ms`.\n\nThis was measured on the host with a 150-second command. When the model passed no timeout, the command was killed at 120 seconds. When it passed one, the command ran to completion. An OpenCode orchestrator that calls `wait` plainly therefore fails every chunk that runs past two minutes. It most likely calls `wait` again, so the campaign still moves, but each such chunk costs a failed call and a turn step.\n\nThe Claude half of this was fixed in SAC-082 by raising the bound when the orchestrator is created. OpenCode's binary names `OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS`, which may be the same lever. Codex was measured with no such bound. No smoke scenario runs an OpenCode orchestrator, so the replay tier cannot see this.","notes":[{"date":"2026-09-26","text":"The variable works. On the host, OpenCode 1.18.32 ran a 150-second command twice, and both calls passed no timeout. Unset, the command was killed at 120 seconds. With `OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS=300000` it ran to completion. The fix can take the shape of SAC-082's, set when an OpenCode orchestrator is created."}],"links":["SAC-082"]},{"id":"SAC-087","title":"A Claude orchestrator is offered a tool to schedule its own wakeup, which would start a turn no driver records","type":"defect","severity":"low","status":"open","foundBy":"session agent, reading the claude-fault-lost-wake recording","opened":"2026-09-26","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Recording the claude-fault-lost-wake scenario on Claude Code 2.1.283, the orchestrator's wait was moved to the background. The model then called `ScheduleWakeup` with a delay of 240 seconds, to check on the wait later. The call failed only because it named no prompt: `prompt` is required when `stop` is not true. The model ended its turn instead.\n\nThe tool exists for Claude Code's `/loop` mode. Whether a well-formed call outside that mode starts a turn has not been measured. If it does, the orchestrator wakes itself in a turn no driver records, the class the idle-orchestrator rule of SPEC.md R64 was written for. A delay past one wait chunk plus the settling window would also read `node-stuck` while the wakeup is still pending.\n\nThe next step is to measure a well-formed call in a member, and if it wakes, to disable the tool for campaign members.","notes":[],"links":["SAC-069"]},{"id":"SAC-088","title":"A recording can end while the orchestrator's last message is still streaming, and commit a truncated response","type":"defect","severity":"low","status":"open","foundBy":"session agent, reading the one replay miss in claude-inherit after the SAC-069 re-recording","opened":"2026-09-26","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The claude-inherit cassette recorded on 2026-09-26 ended on a truncated response. Its last orchestrator step holds `message_start` and 14 deltas, and no `message_stop`. That step is the orchestrator's closing message, after its reply to the mission. On replay Claude Code sent that request three times, which reads as a retry of a stream that broke off. The third found no step, and cs-vcr reported 1 miss. The verdict had already been read, so the scenario passed.\n\nThe recording driver stops watching once the mission reply exists and every worker is quiet. It leaves the orchestrator out of that check, on the reasoning that it has already replied. A reply is not the end of its turn, though, and the closing message can still be streaming when the run archives and destroys the fleet. That is the most likely way the stream was cut. The timing was not captured, so it is not proven.\n\nA re-recording made the cassette whole again. Waiting for the orchestrator's own turn to end would make it whole every time.","notes":[],"links":[]},{"id":"SAC-089","title":"Every `make build` of cs-campaign reports +dirty, even from a clean commit","type":"defect","severity":"low","status":"closed","foundBy":"user report (host): \"Why does cs-campaign version show -dirty as it's from a clean commit?\"","opened":"2026-09-26","resolved":"2026-09-26","stint":"clean-version-stamp","evidence":{"commits":["339b992"],"integrated":[],"verified":"`make build install` on 339b992 installed binaries that report `v0.0.0-20260927052229-339b992fdbe4` with `vcs.modified=false`, and `git status` stayed empty. The same build of e4629b9 reported `+dirty`. The installed cs-campaign contains the 3,408,032 bytes of `bin/guest/cs-campaign-member-amd64`, and so does a `make build-go-embedded` build. `make snapshot` without `--parallelism 1` built all four targets: each embeds its own arch's guest and not the other, and none is dirty. `make ci` passed on the tree committed as 339b992, with 10 of 10 smoke scenarios run."},"resolution":"`make guestbin` writes the guest and an overlay file under `bin/guest/`, one pair per arch. `make build`, `build-go-embedded` and goreleaser pass `go build -overlay`, which has the compiler read the guest in place of the placeholder. The placeholder is never written, so Go stamps a clean version. Each arch reads its own guest, so release targets no longer need `--parallelism 1`.","details":"`cs-campaign version` printed `v0.0.0-20260927022458-e4629b91e506+dirty` for a binary `make install` built from e4629b9 on a clean tree. `go version -m` on it shows `vcs.modified=true`, and `cs-dispatch-viewer` from the same build carries the same stamp.\n\nThe build writes the real guest binary over the committed placeholder `internal/cli/assets/cs-campaign-member.bin`, compiles, and then restores the placeholder with `git checkout`. Go stamps the version while that tracked file is modified, so the stamp says `+dirty` whatever the commit. The tree is clean again afterwards, which is why `git status` shows nothing.\n\nThe binary is the one the build means to make, but its version no longer names a commit. A release built by goreleaser gets the same stamp, since its pre hook overwrites the same file. An interrupted build also leaves the 3.4 MB guest binary in a tracked file.","notes":[],"links":[]},{"id":"SAC-090","title":"The readback fails any member whose model names a context variant","type":"defect","severity":"high","status":"closed","foundBy":"repository owner, on a campaign that would not dispatch: \"About claude-opus-5-5[1m], isn't that a valid model name for Claude code to use?\"","opened":"2026-09-27","resolved":"2026-09-27","stint":"2026-09-27 the readback and context variants","evidence":{"commits":["cd04829"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'ContextVariant|AssertDeclaredTurnConfig|DeclaredSuffix' -count=1` passes. With the change reverted, the case `a variant is satisfied by its base id` fails with the line the campaign printed: `declared model claude-opus-5-5[1m] but the turn answered on claude-opus-5-5`. The full gate passes on this commit, with the smoke tier included."},"resolution":"`matches` now takes both what the operator wrote and what a transcript can carry. The two differ only where a declaration names a context window: `contextVariant` splits the bracketed suffix off, and the plain id satisfies the comparison. A failure still quotes the declaration as the operator wrote it. `declaredSuffix` names what the turn could not show, so a passing line no longer claims to cover the suffix. The manual's readback section says the same.","details":"In one campaign the orchestrator's declared model was `claude-opus-5-5[1m]`. `validate` accepted it, `create` provisioned six microVMs, and the readback failed the campaign:\n\n```\nBAD readback orchestrator (claude): declared model claude-opus-5-5[1m]\n  but the turn answered on claude-opus-5-5 — the declaration did not take\ncs-campaign: readback FAILED — 1 member(s) could not confirm their briefing; do not dispatch\n```\n\nThe declaration had taken. The check cannot see it.\n\n`assertDeclaredTurnConfig` compares the declared string with the models the transcript names, through `matches`, which is a literal `slices.Contains`. The observed list comes from `turnConfigCommand`, which greps `\"model\":\"…\"` out of the CLI's JSONL. That field carries the API model id. A bracketed suffix asks Claude Code for a context window and selects the session, not the model, so it never appears there. No member declaring a context variant can pass.\n\nMeasured against a session whose model id is `claude-opus-5[1m]`, using the command the check itself runs:\n\n```console\n$ set -- \"$HOME\"/.cs-claude/projects/*/*.jsonl\n$ grep -ho '\"model\":\"[^\"]*\"' \"$@\" | sed 's/.*:\"//;s/\"$//' | sort -u\nclaude-opus-5\nclaude-opus-5-5\n\u003csynthetic>\n```\n\nNo bracket, in a session that has one.\n\nWhat it cost: the campaign could not dispatch, and there is no supported way to correct a declaration on an existing campaign. The record holds it, so editing the profile does not reach it and re-running `create` fails identically; `--set` has no `model` path. The fleet was destroyed and recreated on the plain model, which ran the whole campaign on a smaller context window than was asked for.\n\nThe validator that admits the token (SAC-064) is right, and so is the manual sentence about what the form means. Only the confirmation is wrong.","notes":[],"links":["SAC-064"]},{"id":"SAC-091","title":"make repin fails when cs-npmrevs takes more than about ten seconds to start","type":"defect","severity":"med","status":"closed","foundBy":"repository owner: \"make repin here failed\"","opened":"2026-09-29","resolved":"2026-09-29","stint":"2026-09-29 npm build store","evidence":{"commits":["92d7876"],"integrated":[],"verified":"Campaign's `make repin`, rerun with these scripts against the same unpruned store, moved the `@codesweep-ai/ui` pin and rebuilt the viewer in 31 s. Against a stand-in server that exits at once, `with-npmrevs.sh` failed in 0.35 s and printed its log. Against one that took 24 s to listen, it waited and ran the command. In dashboards, tests/test_record_build.py passes 18 of 18 against this record-build.sh, byte for byte, and its prune test fails against the previous copy. Run over a copy of the owner's store, the prune took npm/ from 179 packages (311 MB) to 47 (83 MB), keeping each project's three newest. In ui, scripts/repin-npm.test.mjs passes 18 of 18 against this repin-npm.mjs, and its test for a build whose package is gone fails against the previous copy."},"resolution":"`scripts/with-npmrevs.sh` now waits as long as the registry runs, up to a minute, and stops at once if it exits. Each recorded build removes the npm packages of older ones. A project keeps them for its three newest builds recorded within three days, and for its newest whatever its age. Entries, modules and images stay, and a store that is a repository, as a campaign's is, is left whole. `scripts/repin-npm.mjs` passes over a build whose package the store no longer holds. npmrevs also reads the packages on every core now, which reaches this repository when its npmrevs pin moves.","details":"`make repin` moved the Go pins, then stopped at `with-npmrevs.sh: the registry did not come up on http://127.0.0.1:4875`, so the `@codesweep-ai/ui` pin did not move and the viewer was not rebuilt. The registry reads every package it serves before it listens, one at a time, and it serves the owner's build store. The store held 179 npm packages (311 MB), which took about 9 seconds to read. `scripts/with-npmrevs.sh` waited about 10 seconds, so the repin failed whenever startup ran slightly slow. Nothing removed old packages from the store, so every clean `make ci` in lint, ledger, npmrevs or ui made the margin smaller.","notes":[],"links":[]},{"id":"SAC-092","title":"A push delivers the orchestrator's whole HEAD, and nothing can withhold a path from a member","type":"improvement","severity":"med","status":"closed","foundBy":"feature request from another agent, relayed by the user (host); the clone probe below is this session's","opened":"2026-10-01","resolved":"2026-10-01","stint":"campaign-push-feature-s1","evidence":{"commits":["adb32f1","401ec62","4513d85"],"integrated":[],"verified":"TestWithheldPathsAreRefusedBeforeCreate and TestValidateRefusesADeclarationThatIsNotAPath pass under `go test ./internal/cli/ -count=1`. TestPushNamesTheCommitRefusesWithheldPathsAndLogs passes under `go test ./cmd/cs-campaign-member/ -count=1`. It shows a named commit arriving without its descendant. It shows a push carrying a withheld file, deleted again later, refused with the member's ref and objects unchanged. It shows a merge of the member's own work at the withheld path passing. It finds four log entries, each with member, repository and commit. TestDeliveriesAreLogEvents passes under `go test ./dispatch-viewer/... -count=1`. The full gate, `make check`, passes. `make test-smoke` passes in 452 seconds on the committed cassettes, none of which drives a push."},"resolution":"A repository or snapshot entry takes a `withhold` list of files, directories or globs. `validate` and `create` refuse a repository whose history carries one on any ref (SPEC R120a). They also refuse a repository whose object store keeps objects no ref reaches, and a snapshot whose tree holds one. `push` takes `--commit`, and delivers that commit and nothing after it (R120b). It refuses when any object it would newly deliver sits at a withheld path, judged against the refs the member already holds (R120c). Every delivery and refusal is a `delivered` or `refused` log entry with the member, repository and commit (R120d), and the viewer draws them on the log row. Withdraw was dropped. A refusal, a named commit and a log make a wrong delivery something to record, and a prune cannot reach a member that merged or read what arrived. The sandbox clone that copies objects no ref reaches is an upstream matter, left unfiled.","details":"`cs-campaign-member push \u003cagent> [repo]` sends the orchestrator's HEAD to the member at `refs/campaign/orchestrator`. The orchestrator cannot name another commit. A push carries the commit's whole history, so every path on that line arrives in the member's clone whether or not the member merges it.\n\nA campaign can be designed so that one member must never see certain files the orchestrator holds, such as a directory of expected results. One push from the wrong checkout delivers them with the history. Nothing refuses it, nothing records it, and a corrective push to an earlier commit is refused as non-fast-forward. Such a campaign can only find a breach afterwards, by scanning clones, and the log gives it nothing to scan.\n\nThe push is not the only route. A member's repository is a full bare clone of the host repository, every branch included, and the profile's `ref` picks the checkout rather than the history. A withheld path that exists on any branch of the host repository is therefore in every member's clone at create. The clone is also made from a local path, which copies the object store as it stands. A probe on git 2.53 showed the difference: a blob dropped by `git reset --hard`, reachable only from the reflog, was present in a `git clone --bare \u003cpath>` and absent from a `git clone --bare file://\u003cpath>`. A ref walk cannot see such an object.\n\nWhat would help, in order:\n\n- A `withhold` list on a member's repository and snapshot entries. `validate` and `create` hold it against every object reachable from every ref of the host repository, and refuse a host repository that holds objects no ref reaches.\n- A push that refuses when any object it would newly deliver sits at a withheld path, judged against the refs the member already holds.\n- A log entry for every delivery and every refusal, naming the member, the repository, the commit and the outcome.\n- A `--commit` flag, so a push can name what it sends.\n\nThe fence covers the git channel only. The text of every `send` is already in the archive, and the tool cannot stop a model from pasting a file into a dispatch.","notes":[{"date":"2026-10-01","text":"The fence was proved on a live two-seat campaign, both seats on kimi-k3 over Fireworks, with Firecracker members on the slim image. `validate` refused a tainted profile naming the member, the path and the commit. The orchestrator's push of a branch carrying the hold-out was refused and logged, and its push of the clean branch with `--commit` was delivered and logged. Three facts were read from the agent's clone before destroy. The delivered commit was present, the refused commit and the hold-out blob were absent, and no history existed under the withheld path. The agent checked out the delivered ref and reported it, and the orchestrator's reply carried the outcome `campaign-met`. The viewer site built from the archive shows both delivery events. The run cost $0.59 by opencode's accounting."}],"links":["SAC-029"]},{"id":"SAC-093","title":"The no-repository refusal sends a profile's author to --repo, which no command takes beside --profile","type":"defect","severity":"low","status":"closed","foundBy":"session agent, rendering the example campaign's orientations; the user asked for the fix","opened":"2026-10-18","resolved":"2026-10-18","stint":null,"evidence":{"commits":["301d0cc"],"integrated":[],"verified":"TestAProfileWithNoRepositoryIsSentToReposAlone passes under `go test ./internal/cli/ -count=1`. It drives `validate` and `orientation` on a profile with no repository and finds `under repos:` in both refusals and `--repo` in neither. Making either call site offer `--repo` again fails the test for that command alone. TestTheExampleCampaignValidatesAsTheSpecShows now finds `validate` passing, `orientation` rendering both members and `plan` planning the absent repository as a first commit, with nothing made under HOME. Stripping the example's repositories fails it. The full gate, `make check`, passes."},"resolution":"A refusal for a profile now says to declare a repository under `repos:`, and only a fleet built from flags is offered `--repo`. The example campaign names one repository at `~/src/report-generator`, for the operator to point at their own checkout. Until that path exists, plan pins an empty first commit, so `validate`, `orientation` and `plan` all run on the example and allocate nothing. SPEC.md's console block shows the passing run. The example names an absolute path because a relative one resolves against the shell's directory, which SAC-094 records.","details":"A campaign whose members have no repository is refused with advice to \"pass --repo to give every member the same one\". That advice only works for a fleet built from flags. With a profile, `orientation` and `validate` answer `unknown flag: --repo`, and `plan` and `create` answer `--profile is mutually exclusive with fleet flags`. An author holding a profile is sent to a flag that every command refuses.\n\nThe example campaign meets the same wall. `testdata/example-campaign/profile.yaml` declares no repository on purpose, so `validate` ends in this refusal, and `orientation` and `plan` cannot render it at all. The example is meant to be the smallest complete campaign, and an author cannot use it to see what a member is told or what create would build.\n\nTo reproduce, run `cs-campaign orientation example --profile testdata/example-campaign/profile.yaml`. It prints the refusal. Add `--repo \u003cpath>` and it prints `unknown flag: --repo`.","notes":[],"links":["SAC-023","SAC-094"]},{"id":"SAC-094","title":"A relative repository path in a profile resolves against the shell's directory, not the profile's","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, while choosing a repository path for the example campaign","opened":"2026-10-18","resolved":"2026-10-18","stint":null,"evidence":{"commits":["3f7da6e"],"integrated":[],"verified":"TestARelativeTreeResolvesBesideTheProfile and TestInitWritesTheTreesItWasGivenAsAbsolutePaths pass under `go test ./internal/cli/ -count=1`. The first plans from another directory and finds `app`, `./specs` and `../shared` resolved beside the profile, with nothing written where the shell stood. Removing the resolver fails it. The second runs `init --dir sub/demo --repo ./app` and finds the path written relative to the shell. Removing the step that writes it absolute fails it. The full gate, `make check`, passes."},"resolution":"Decoding a profile now resolves each relative repository and snapshot path against the profile's directory, where its mission and briefs are found. `--repo` and `--snapshot` on the command line stay relative to the shell. `init` writes them into the profile as absolute paths, so a scaffold still names what was typed wherever `--dir` puts it. The manual's Configuration section and SPEC.md's profile table state the rule.","details":"A profile finds its mission and briefs beside itself, wherever it is read from. A repository declared as `path: ./app` resolves through `expandPath` in `internal/cli/profile.go`, which takes it relative to the current directory instead. The same profile therefore names a different repository depending on where the operator stands.\n\nThe cost lands at create. When the path does not exist, plan pins a first commit and create makes the repository. A relative path therefore makes a new repository in whatever directory the shell was in. A profile copied with its briefs into another directory keeps its briefs and loses its repository.\n\nTo reproduce, write a profile whose members declare `path: ./app`, and run `cs-campaign plan \u003cname> --profile \u003cdir>/profile.yaml --dry-run` from a different directory. Each `repos[].path` in the plan names `./app` under the shell's directory, not under `\u003cdir>`.\n\nNeither the manual nor SPEC.md says which base a relative path takes. Resolving it beside the profile, as the briefs are, would make a profile directory self-contained.","notes":[],"links":["SAC-093"]},{"id":"SAC-095","title":"Nothing assembles a campaign's profile, mission, briefs and orientations into one packet to review before create","type":"feature-idea","severity":"med","status":"closed","foundBy":"user request (host): \"a nice single html file using the design system that has a full packet of the campaign that i can review\"","opened":"2026-10-18","resolved":"2026-10-18","stint":"review-packet-2026-10-18","evidence":{"commits":["e47d184"],"integrated":[],"verified":"Six tests pass under `go test ./internal/cli/ -count=1 -run 'Packet|ABriefCannot|SinceCompares'`. TestThePacketHoldsWhatCreateWouldDeliver holds the example campaign's seeds against seedFiles and its orientations against buildOrientation. Dropping the mission from the packet's seeds fails it, and turning off HTML escaping fails TestABriefCannotEscapeThePage. `make check` and `make viewer-check` pass, and the page rebuilds byte for byte from a clean install. The page was read in a browser for the example campaign. It was also read for a synthetic one with an unwritten brief, an unset key, withheld paths and script tags in a brief. The script did not run. The page was also read in the dark theme and at 420 pixels wide."},"resolution":"`cs-campaign packet \u003ccampaign> --profile \u003cprofile>` writes one self-contained page built on `@codesweep-ai/ui`, from a second entry in the dispatch viewer's app. It draws only on what create resolves: the plan, the authored files, each member's orientation, and create's refusals and warnings in its own words (SPEC R85a). It renders a campaign whose briefs are not all written, and shows each missing one as a refusal. `--since` compares with an earlier packet of the same campaign, and `--json` prints the data instead of the page. A new `seedSet` carries the rule `seedFiles` applies, so the page and create list the same files. The design system's syntax theme gives an added diff line the keyword colour and a removed line none, so the page colours its own diff.","details":"The playbook asks for two reviews before create. The fleet pass reads the mission, every brief and each member's orientation together. The member pass reads one member's brief and orientation and nothing else. The tool supplies only part of that. `orientation` prints every member's orientation with a header per member, and `plan` prints the resolved campaign as JSON. The author gathers the mission and briefs by hand and splits them per member.\n\nSeveral things a reviewer needs are printed once and then lost. They include the warnings `validate` writes about large seed sets, invented outcome names and unset credential variables. They also include each repository's base commit and the set of files each member is handed.\n\nWhat would help is a `cs-campaign packet \u003ccampaign> --profile \u003cprofile>` command. It takes the flags `plan` takes and writes one self-contained HTML page built on `@codesweep-ai/ui`, as `cs-dispatch-viewer` does. The page has a fleet view and one view per member holding exactly the files that member is seeded with. It shows the profile, the mission, the briefs, the orientations, the resolved plan, each repository's base commit, each seeded file's digest, and the warnings.","notes":[],"links":["SAC-093"]},{"id":"SAC-096","title":"The packet page reads as if create were still ahead, which is wrong for a campaign create has made","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, while writing packets for campaigns already created, after the user asked: \"why can't we create a review packet for already completed runs and new ones?\"","opened":"2026-10-18","resolved":"2026-10-18","stint":"review-packet-2026-10-18","evidence":{"commits":["e197881"],"integrated":[],"verified":"`go test ./internal/cli/ -count=1 -run TestTheDocumentedPacketDigestsAreTheOnesCreateRecords` passes. Giving the packet a seeded file's digest that is not create's fails it on four files, and changing the profile's digest fails it too. `make check` and `make viewer-check` pass. The page was read in a browser for a campaign already created. Its overview's first card is headed \"What create finds\", and its plan view says create records the names and branches it makes. For a campaign created earlier the same day, every seeded-input digest in its record matched the packet's."},"resolution":"The page's create-time sentences now hold before and after create. The manual says a packet of a created campaign shows what its members were given when the inputs are unchanged, and that the page's digests are the ones create records. TestTheDocumentedPacketDigestsAreTheOnesCreateRecords keeps that sentence true.","details":"`cs-campaign packet` writes a page for a campaign that `create` has already made, because it reads only the profile and the files beside it. The page is worded for a campaign not yet created, though. The overview's first card is headed \"Before you create\". The Resolved plan view calls the plan's names and branches predictions, and says the deadline becomes the create time plus the profile's deadline at create. The manual does not say whether a packet of a created campaign shows what its members were given. It does when the inputs on disk are unchanged, and the campaign record holds the digests that show it.","notes":[],"links":["SAC-095"]},{"id":"SAC-097","title":"The viewer fixture CF-05 still expects the log legend from before push entries were added","type":"defect","severity":"low","status":"closed","foundBy":"session agent, running `make fixtures` with a local browser","opened":"2026-10-19","resolved":"2026-10-19","stint":"review-packet-2026-10-18","evidence":{"commits":["9cccbe9"],"integrated":[],"verified":"`make fixtures` with `DISPATCH_FIXTURES_BROWSER` set fails CF-05 at bd51838 and passes at 9cccbe9, with 21 ok, 0 fail and 9 must-change targets met. The diff changes the CF-05 row alone. Its four archives' log legend rows gain \"push delivered\" and \"push refused\", and its approval block cites this record."},"resolution":"CF-05 was re-recorded through the gated write path, and only its row was committed. A whole-suite update also rewrites rows this change does not touch, which SAC-098 records.","details":"`make fixtures` fails one check, CF-05, which records the dispatch viewer's legend rows. In all four synthetic archives the orchestrator-log row now ends with \"push delivered\" and \"push refused\". Commit 4513d85 added those entries for SAC-092, and the expectation was not re-recorded with it. Every other check passes or meets its target. The suite needs a browser and CI does not run it, so nothing reported the failure.","notes":[],"links":["SAC-092","SAC-098"]},{"id":"SAC-098","title":"A fixture re-record drops other rows' approval blocks and stamps one reason on every gated row","type":"improvement","severity":"low","status":"open","foundBy":"session agent, re-recording CF-05 for SAC-097","opened":"2026-10-19","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`make fixtures FIXTURE_ARGS=\"--update --approve \u003cid> --reason \u003csentence>\"` rewrites every row the run measures, in `dispatch-viewer/fixtures/run.mjs`. A measured row whose value is unchanged loses its `approval` or `origin` block, so re-recording one row deletes the permission slips of others. Every row whose value changed gets the one `--reason`, even when it changed for another cause. Re-recording CF-05 this way dropped five earlier blocks. It also gave the size rows CF-40 and CF-41 a reason about the legend, though they drifted because the page grew. Their checks pass on the size budget alone. A re-record that kept unchanged rows verbatim, and could name the rows it may change, would let a diff carry only the change it approves.","notes":[],"links":["SAC-097"]},{"id":"SAC-099","title":"A long campaign member compacts on its own and re-orients by guesswork","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, asking for a way to manage context in long-running campaign members","opened":"2026-10-25","resolved":"2026-10-25","stint":"context hand-off, 2026-10-17 to 2026-10-25","evidence":{"commits":["27a653c"],"integrated":[],"verified":"A copy of a real six-member campaign, run twice: once as recorded, once with lines set. With lines, the orchestrator ran 8 sessions with 7 hand-offs, 1 commit ask and 0 compactions. The modeller ran one fresh session per dispatch. The outcome was campaign-met, against campaign-converged before, and the as-recorded run compacted twice. Two small live campaigns of three OpenCode members, every one with a line, made 4 hand-offs each: orchestrator 1, agents 3. Every handoff was kept under output/handoffs and swapped for a fresh session with no rung spent, and both campaigns met their mission. `cs-campaign orientation`, `create --dry-run` and `plan` for a profile with no line are byte-identical to main's. `TestTenRapidHandoffsInARowTripTheBound` and `TestALongMissionsHandoffsNeverTripTheBound` fail without the rapid window. `TestHostHandoffKeepsTheHandoffBeforeTheKill` fails without the commit check. `TestAwaitReplyStartsAHandedOffMemberFresh` and `TestResumeStartsAHandedOffOrchestratorFresh` fail without the fresh start. `make check` passed on the feature commit, with every package `ok`."},"resolution":"A seat's policy may carry `handoffTokens`, a context line the sandbox asks the member to hand off at. The member writes its handoff with its own tools and ends its turn. The campaign checks the work is committed and named in the handoff, and asks the member to commit if not. Then it ends the session and starts it fresh on the handoff, spending no rung. Every handoff is kept. The `handoffs` bound counts only rapid hand-offs in a row, within `rapidHandoffSeconds` of a fresh start. An agent may carry `freshPerDispatch`, which starts each dispatch in a fresh session. A seat with neither runs as before, its orientation and member document byte for byte.","details":"An orchestrator on a long mission, or an agent that reads a large corpus, fills its context. Its CLI then compacts the conversation by itself, one to three times in a long campaign, and the member carries on from a summary it did not write. Nothing in the dispatch protocol sees it coming or helps the member recover. An agent that keeps one session across many dispatches carries every earlier dispatch's context into the next.\n\nWanted, off unless a profile asks for it. A per-seat context line, past which the member writes its own handoff and is started in a fresh session on it, spending no rung. A bound on how many times that may happen, and a record of every one. A check that the member's work is committed and named before its session is replaced. A per-agent switch that starts each dispatch in a fresh session. A seat without either must run exactly as it does now, its orientation and member document included.","notes":[],"links":[]},{"id":"SAC-100","title":"The hand-off check pads its count on macOS, so a dirty repository reads as \"       2 paths\"","type":"defect","severity":"low","status":"closed","foundBy":"campaign CI on f1eb71f: build-test failed on macos-15-intel and macos-arm64, and passed on Linux and WSL2","opened":"2026-10-25","resolved":"2026-10-25","stint":"context hand-off, 2026-10-17 to 2026-10-25","evidence":{"commits":["13e9a53"],"integrated":[],"verified":"`TestTheHandoffCheckReadsGitAndTheHandoff` now runs every case a third time behind a `wc` that pads its output as BSD's does. With the script's fix removed, the three cases that print a count fail that run, as they failed on both macOS runners; with it, all 24 runs pass. `TestTheHandoffCheckIsReadALineAtATime` reads a padded count as `1 path`. `go test ./internal/protocol/ -count=1` ok, and `make check` passed every gate on the fix."},"resolution":"`HandoffCheckScript` strips the spaces from the count with `tr -d ' '`, so it prints a bare number on BSD and GNU `wc` alike. `ParseHandoffCheck` trims every field it reads.","details":"`HandoffCheckScript` counts a repository's uncommitted paths with `wc -l`. BSD `wc`, which macOS ships, pads the count with spaces, so the check printed `DIRTY\\tapp\\t       2\\ta.txt` and the member read `~/app has work not committed (       2 paths, the first a.txt)`. GNU `wc` prints a bare number, so Linux, where every member runs, was right. `TestTheHandoffCheckReadsGitAndTheHandoff` failed on both macOS runners, in six of its sixteen cases: every one that prints a count.\n\nThe member reads the sentence and the campaign decides on the count, so a padded count is a wrong sentence and nothing worse. The script should print a bare number on either `wc`, and the reader should trim what it is given.","notes":[],"links":["SAC-099"]},{"id":"SAC-101","title":"An OpenCode seat waits five minutes on every stalled provider call","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, from a task-tracker campaign whose modeller lost most of a lap to provider stalls","opened":"2026-11-02","resolved":"2026-11-02","stint":"provider header timeout, 2026-11-02","evidence":{"commits":["925f277"],"integrated":[],"verified":"The campaign's own guest command, run for a seat with model fireworks-ai/accounts/fireworks/models/glm-5p3, effort high and providerHeaderTimeoutSeconds 60, wrote provider.fireworks-ai.options.headerTimeout = 60000 beside the model's reasoningEffort. OpenCode 1.19.5, the version the pinned sandbox image ships, downloaded and checked against the image's digest, loaded that config with cs-opencode's variables: `opencode debug config` exited 0 and printed headerTimeout 60000. The same config with headerTimeout 0 was refused: \"Expected a value greater than 0\". A third run set the wait to 3000 ms and pointed the provider at a local server that accepts and never answers. `opencode run` failed each of its 7 attempts after 3000 ms and exited in 82 seconds. For a profile with no timeout, `validate`, `plan`, `plan --json`, `create --dry-run` and `orientation` print the same 571 lines as main, and the OpenCode guest command is byte-identical to main's. `validate` refuses the field on a codex seat by name. `TestApplyModelConfigOpenCodeSetsHeaderTimeoutOnItsProvider` fails when the key is written as `timeout`. `make check` passed on 925f277, with every package `ok`."},"resolution":"A seat may carry providerHeaderTimeoutSeconds, the seconds to wait for the provider's response to start. The campaign writes it into an OpenCode seat's opencode.json as provider.\u003cid>.options.headerTimeout, in milliseconds, for the provider its model names. `validate` refuses it on any other CLI, and on an OpenCode seat whose model is not named as provider/model. A seat without it is configured exactly as before.","details":"OpenCode waits 300 seconds for a provider's response headers before it gives up on a call. It then retries the call silently, up to six attempts with backoff, so one stuck call costs about 31 minutes before the turn ends and the campaign resumes the seat. In a task-tracker campaign, a modeller on glm-5p3 at Fireworks lost about 85 of 92 minutes this way, to 24 header timeouts. Other seats on the same machine were healthy. The seat read plain `busy` throughout. The modeller's slowest genuine call over three stores took 34.6 seconds to start answering, and the median was 1.0 to 1.4 seconds.\n\nOpenCode reads the wait from `provider.\u003cid>.options.headerTimeout`, in milliseconds. A profile has no way to set it. Wanted: a per-seat number, in seconds, that the campaign writes there for an OpenCode seat. A seat without it must run exactly as it does now. A seat on another CLI must be refused rather than have the number ignored.","notes":[],"links":[]},{"id":"SAC-102","title":"An orchestrator told its log's path overwrote the log, and the host's backup followed","type":"defect","severity":"high","status":"closed","foundBy":"session agent, from a live dispatch viewer run against the task-tracker campaign tt-v18-run19","opened":"2026-11-03","resolved":"2026-11-03","stint":"orchestrator log, 2026-11-03","evidence":{"commits":["4b32e80"],"integrated":[],"verified":"`cs-campaign orientation` was rendered for every seat of a three-seat profile, with and without a hand-off line, on main and on 4b32e80. The only text that differs is the orchestrator's with a line, which now names `cs-campaign-member log` and never the log's path, and the other five texts are byte-identical to main. `TestTheLogMirrorKeepsWhatTheLogLost` and `TestTheLogMirrorWaitsForALineToFinish` fail when the mirror is written as before. `TestTheLogMirrorTakesConcurrentObservesOnce` passes with eight merges at once. `TestAResumedCreateKeepsReadbacksAndMovesTheDeadline` shows a new create clearing an earlier campaign's copy, and a resumed create keeping its own. `TestNoteRefusesTheLogAsItsBody` refuses the log by path and through a symlink. `TestLogPrintsTheEntriesAndCountsWhatTheToolDidNotWrite` prints run19's kind of hand-written line as a count, not an entry. `make test-smoke` replayed 41, 50, 38 and 50 requests with 0 misses, the same counts as main at ee0e3ce, so no recording needs to be made again. `make check` passed on 4b32e80, with every package `ok`."},"resolution":"`cs-campaign-member log` prints the orchestrator's log. The orientation and the message a fresh session reads after a hand-off name that verb, and never the log's path. `note` refuses the log as its input. The host's copy keeps every line it has copied, and a new campaign of the same name starts it empty.","details":"In tt-v18-run19 the orchestrator wrote its own log with `cat > ~/.local/share/cs-campaign/output/log.jsonl`, which replaces the file. It wrote four lines in a format of its own, with invented minute-precision times. Then it ran `cs-campaign-member note assessment --file` on the log file itself. Its reasoning quotes the orientation: \"Your log, ~/.local/share/cs-campaign/output/log.jsonl, holds your notes and acceptances\", and decides \"Let me keep a light log.\"\n\nThe log is the only record of acceptance, so the overwrite lost five acceptances. Three surveyors went back to `node-replied`, so the orchestrator had to accept them again. The modeller's d001 and d002 acceptances are gone from the record for good. `observe` copies the log to `\u003cname>.log-mirror.jsonl` on the host, so the claim survives a lost machine, but it replaces the copy on every look. The backup is missing the same lines.\n\nThe orientation and the restart message name the file because a fresh session must read its log, and no tool reads it. Wanted: a member verb that prints the log, and texts that name that tool rather than the path. Also wanted: a `note` that refuses the log as its input, and a host copy that keeps every line it has seen.","notes":[{"date":"2026-11-03","text":"A live hello campaign on 4b32e80 gave the orchestrator a hand-off line of 40,000 tokens. It handed off once, at 40,584, and met its mission in about 15 minutes for $1.81. Its fresh session ran `cs-campaign-member log` and read every entry back. No tool call in either session wrote or named the log file. The log held 6 lines, all written by the tool, and the host's copy matched it line for line."}],"links":[]},{"id":"SAC-103","title":"An agent's readback reads as a reply the orchestrator still owes a judgment","type":"defect","severity":"med","status":"closed","foundBy":"session agent, from a live dispatch viewer run against the task-tracker challenge campaign tt-live2b-challenge-2, and the ALERT loop-speed's watch wrote into its record","opened":"2026-11-03","resolved":"2026-11-03","stint":"readback reading, 2026-11-03","evidence":{"commits":["cba4d79"],"integrated":[],"verified":"`go test -count=1 ./...` passes with ten new tests, and two existing tests gain checks. Making `JudgedFor` ignore the readback fails `TestWaitReadsAJudgedReadbackAsFree` and `TestObserveReadsAPassedReadbackAsAccepted`. A log seed that always truncates fails `TestTheSeedMakesAnEmptyLogAndKeepsAnExistingOne` and `TestAResumedCreateKeepsReadbacksAndMovesTheDeadline`, which drives a real create and then a resumed one. Dropping create's second manifest write fails that create test too. In `make test-smoke` on real machines, every replayed `dev` reads `node-free d001 d001 accepted` after create. A second full run replayed 50, 50, 38 and 41 requests with 0 misses, the same counts as main at b9e55b0. The first full run missed one request when opencode's `dev` turn exited early and `wait` continued it. Five solo runs of that case replayed with 0 misses, and nothing in the change runs on an agent's machine. `make check` passed on cba4d79."},"resolution":"Create writes each agent's passed readback into the orchestrator's manifest, and `observe` and the orchestrator's tools read that dispatch as accepted. `accept` on a readback records nothing and says create judged it. Create makes the orchestrator's log, empty, and a resumed create keeps it. SPEC R150 and R149 state both.","details":"The readback is the dispatch create sends every member, usually `d001`, and create judges each answer itself. After create, `observe` still reads an agent whose newest dispatch is its readback as `node-replied`, \"reply present, not accepted\". The orchestrator's `wait` reads it the same way and says \"idle replied to d001: read it, then `accept idle`\". The dispatch viewer says the opposite: it notes an acceptance of a readback as `accept-of-readback`, because the orchestrator owes it no acceptance.\n\nIn most campaigns the orchestrator's first real dispatch replaces the reading within minutes. Orchestrators that run `wait` first are told to accept readbacks, and they do. SAC-102's record quotes a modeller's lost `d001` acceptance. The task-tracker challenge campaigns pair the orchestrator with an `idle` seat that is never sent a job, so the reading never clears. The watch that loop-speed runs alerted on it after 10 minutes in both such campaigns, tt-live2b-challenge-1 and -2.\n\nThe same campaign shape shows a second false alarm. That orchestrator worked alone and never wrote a log entry, so `output/log.jsonl` was never created, and the dispatch viewer reports `log-missing` as severe for its archive. The viewer cannot tell a log nobody wrote from one that was lost.\n\nWanted: once every readback has passed, an agent's readback reads as accepted, on the host and in the orchestrator's own tools. Also wanted: create makes an empty log, so an absent log means a lost one.","notes":[],"links":["SAC-102"]},{"id":"SAC-104","title":"The recording script asks an image it never built for agent versions, so a fresh host skips the cleanup and exits 125","type":"defect","severity":"low","status":"open","foundBy":"session agent, re-recording opencode-fireworks with `./scripts/record-fixtures.sh opencode-fireworks` on a host that held no image for the new sandbox pin","opened":"2026-11-02","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`scripts/record-fixtures.sh` resolves `$image` before `make` runs, from `cs-sandbox version --images`, as the published `ghcr.io/codesweep-ai/sandbox-slim:\u003cversion>`. On a host that holds no image for that version and no registry has one, `setup-smoke` builds it under the local name `localhost/codesweep-ai/sandbox-slim:\u003cversion>`. After the recording, the script runs `podman run --pull=never` on the published name to read the agent versions, and podman answers `image not known`.\n\nThe recording itself is kept, because the test has already passed and written the cassette. The script exits 125, though, and its cleanup never runs. That cleanup drops a cassette whose agent version the image no longer carries, so a stale cassette stays in the tree.\n\nThe script should ask for the image after `make`, the way `scripts/sandbox-image.sh` resolves it, which prefers the local name when only that one exists.","notes":[],"links":[]},{"id":"SAC-105","title":"Three things campaign does for an OpenCode member stop working on OpenCode 2","type":"improvement","severity":"high","status":"closed","foundBy":"session agent, porting campaign to OpenCode 2.2.5 at the user's request, by running OpenCode 2.2.5 against a stub provider","opened":"2026-11-01","resolved":"2026-11-02","stint":"opencode-v2.x","evidence":{"commits":["f44bd90","cd343ff","eded081","4285952"],"integrated":[],"verified":"`make test-integration` on the pin: TestLiveMatrix/opencode-fireworks PASS in 226 seconds, and TestLiveHeterogeneousFleet PASS in 238 seconds. Each created its OpenCode member, so the declared model was confirmed from the session store. Each archived it with no INCOMPLETE marker and passed the audit. `make test-smoke SMOKE_TESTS=TestSmokeReplay/opencode-fireworks` PASS in 50 seconds, with the new check that the member's archived evidence holds a `.cs-opencode/export/ses_*.json`. `make check` passes. No scenario runs an OpenCode orchestrator, so the shell bound rests on the direct runs on 2.2.5 in the first note."},"resolution":"campaign reads the model and the list of sessions from OpenCode 2's database, and exports each one with `cs-opencode session export`. An OpenCode orchestrator gets `cs-shell-bound.ts`, a plugin that sets the bound on any shell call that names none. A live run now fails when an OpenCode member archives no session export, which is how the dead export loop would have shown.","details":"cs-sandbox's opencode-v2.x branch ships OpenCode 2.2.5. Measured on 2.2.5 under a profile laid out as `cs-opencode` lays it out, three things campaign relies on are gone.\n\n- **The orchestrator's wait is killed again.** `createArgs` raises an orchestrator's bound on one shell call with `OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS`. OpenCode 2 reads no such variable. A shell call asking for `sleep 10` with it set to 3000 ran the full ten seconds. The bound is 120 seconds again, and the wait chunk is 240, so an OpenCode orchestrator's wait fails halfway, as PROTOCOL.md §8 describes. The shell tool now takes a `timeout` on each call, and nothing in the configuration sets its default.\n- **A declared model is never confirmed.** `turnConfigCommand` reads `providerID=` and `modelID=` from `~/.local/share/opencode/log/*.log`. OpenCode 2's log names neither, so `create` finds no model and fails every OpenCode member that declares one.\n- **The archive holds no readable transcript.** The archive lists sessions with `cs-opencode db` and exports each with `cs-opencode export`. OpenCode 2 has neither command. The export loop exports nothing, and only the raw database reaches the archive.\n\nThe rest still holds on 2.2.5. The key file `~/.cs-opencode/env` is read, the database is `~/.cs-opencode/opencode.db`, and `provider.\u003cp>.models.\u003cm>.options.reasoningEffort` reaches the request as `reasoning_effort`.","notes":[{"date":"2026-11-02","text":"Commit f44bd90 pins cs-sandbox at fdcdd0e, the build that ships OpenCode 2.2.5. Commit cd343ff reads the model and the session list from the session store. It also adds `cs-shell-bound.ts`, which configureOrchestrator installs in an OpenCode orchestrator. Commit eded081 re-records opencode-fireworks, and `make test-smoke` replays all four cassettes with no miss. No scenario runs an OpenCode orchestrator. The plugin's evidence is direct runs on 2.2.5. A shell call with no timeout was killed at the bound, and one naming its own timeout kept it."},{"date":"2026-11-02","text":"In about 20 probe runs with a plugin in the profile, OpenCode's server twice stalled at start and never booted. In about 10 runs without one it never did. That is too few to blame the plugin, and sandbox's context hook is loaded the same way."},{"date":"2026-11-02","text":"The same live run failed codex-api-key, codex-fault-throttled and codex-fault-unauthorized. Every turn on the OpenAI key was refused with `Quota exceeded. Check your plan and billing details`, so no member confirmed its briefing. codex-subscription passed on the same image."}],"links":[]},{"id":"SAC-106","title":"The opencode export test fails on macOS, which has no timeout","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading the failed ci run 41725331391 on main at 752af8c","opened":"2026-11-03","resolved":"2026-11-03","stint":null,"evidence":{"commits":["3fb83e6"],"integrated":[],"verified":"ci run 41729523750 on ad2cc27 passed every job. Both macOS legs of build-test passed, where run 41725331391 had failed `TestOpencodeExportCannotCostTheTarball` on each. Locally, with `timeout` hidden from PATH, the test is skipped, and with it present the test passes. The same test fails without the skip under that PATH, with the error ci reported."},"resolution":"The test skips itself where `timeout` is not installed, as the `setsid` tests in cmd/cs-campaign-member do. The bounded loop runs only in a Linux guest, so on macOS there is nothing for it to test. `TestReplyStampsRepoEvidence` passed in both later runs, and is left as it is.","details":"`TestOpencodeExportCannotCostTheTarball` fails on both macOS legs of ci with `the loop did not ask for the one session's export: \"\"`. Linux and WSL pass. The export loop runs under `timeout -k 5 ... || true`. macOS has no GNU `timeout`, so the loop never starts and the `|| true` hides it. The check that the stub was asked, added in cd343ff for SAC-105, is the first line that notices. Before it the test passed on macOS without testing anything. The collection itself runs in a Linux guest, which has `timeout`, so no campaign is affected. Hiding `timeout` from PATH on Linux gives the same failure.\n\nThe same run's macos-arm64 leg also failed `TestReplyStampsRepoEvidence` when the test's temporary directory was cleaned up: `unlinkat .../proj/.git/objects: directory not empty`. Every git call in the reply path waits for git to exit, and the last 15 failed ci runs show no other case of it. It is recorded here and not fixed.","notes":[],"links":["SAC-105"]},{"id":"SAC-107","title":"An OpenCode member on podman archives no session export","type":"defect","severity":"high","status":"closed","foundBy":"session agent, reading the failed smoke podman legs of ci run 41726614691 on main at 3fb83e6","opened":"2026-11-03","resolved":"2026-11-03","stint":null,"evidence":{"commits":["ad2cc27"],"integrated":[],"verified":"ci run 41729523750 on ad2cc27 passed every job, including smoke podman (opencode-fireworks) on Linux and on macos-arm64, which run 41726614691 had failed, and smoke firecracker (opencode-fireworks). Locally, `SMOKE_ENGINE=podman make test-smoke SMOKE_TESTS=TestSmokeReplay/opencode-fireworks` failed before the change and passed after it. `TestOpencodeExportCannotCostTheTarball` now keeps its stub in `~/.local/bin` rather than on PATH, and it fails against the old loop."},"resolution":"The export loop calls the wrapper as `\"$HOME/.local/bin/cs-opencode\"`, the way cs-campaign reaches its other tools in the member, so it no longer depends on the engine's PATH.","details":"`TestSmokeReplay/opencode-fireworks` fails on both podman legs, Linux and macOS, with `dev (opencode) archived no session export`. The firecracker leg passes. The replay itself is clean: 49 requests, no miss. The check that fails was added in 4285952. These legs had not run since, because the macOS unit failure in SAC-106 skipped them.\n\nThe export loop calls `cs-opencode` by name. The wrapper is at `~/.local/bin/cs-opencode`. Under firecracker the command arrives over ssh and that directory is on PATH. Under podman it is not, so every export fails with `nice: 'cs-opencode': No such file or directory`, and the `|| rm -f` hides the error. Listing the sessions works: a diagnostic run on podman listed both of the member's sessions. The loop called `cs-opencode` by name on OpenCode 1 too, so a podman member has probably never archived an export. `TestOpencodeExportCannotCostTheTarball` could not catch it, because it puts its stub on PATH.","notes":[],"links":["SAC-105","SAC-106"]},{"id":"SAC-108","title":"A node whose token budget is spent would climb the recovery ladder until its queue is blocked","type":"improvement","severity":"med","status":"closed","foundBy":"user request (host): \"Implement the note now.\", for the cs-sandbox token budget","opened":"2026-11-04","resolved":"2026-11-05","stint":"token budget session, 2026-11-04","evidence":{"commits":["5b10b1a"],"integrated":[],"verified":"`make check` passed at d09909d, unit tier and coverage included. Its tests hold each spent ending to no rung, a try as soon as the reading says the budget has room, and holds left out of the elapsed bound. The conformance scenario raises a budget after 3h15m under a one-hour bound, and the node is tried within 90 s and never stuck."},"resolution":"A spent token budget is now a hold and not a rung of the ladder. The dispatcher tries the node again once its turn driver says the budget has room, and the hold does not count toward the elapsed bound. Nodes see this once their sandbox image carries the cs-sandbox drivers that answer `--budget`.","details":"cs-sandbox is gaining a token budget per sandbox, filed as SBX-115 in the sandbox ledger. Its three turn drivers will log a new ending, class `spent`. With exit 5, the turn was refused: before it began, because the budget was past its ask line, or partway through, under a hard budget. The session is intact, and a retry costs nothing while the budget stays spent. With exit 0, the agent was asked to stop at the ask line, wrote its handoff and ended its turn, as at a context line. Only the operator can raise a budget, on the host.\n\ncs-campaign reads four endings and ladders every other one (PROTOCOL.md section 5, `Compute` in `internal/protocol/state.go`). A `spent` it does not know gets a continue, then a restart that drops the session, then `node-stuck`, which blocks the node's queue. So the two halves have to land together.\n\nWanted: `spent` read as a fifth ending that is not laddered. It spends no rung, and never counts toward the bound on rapid hand-offs. The line says the budget is spent, and names the token type when the driver's message does. The dispatcher waits a long time the operator sets, then tries again. A node that handed off takes the hand-off path on that try, and any other carries on in its session.","notes":[{"date":"2026-11-04","text":"Two changes on review, both asked for by the user. First, the turn drivers now answer `--budget` with one line: `ok`, `ask \u003ctypes>`, `none` or `off`. The probe reads it, and a node held on a spent budget whose reading is `ok` is tried on that look, not at the end of `spentRetrySeconds`. The wait stays for a driver too old to answer. Second, the elapsed bound now leaves out each hold, from a spent turn end to the try after it. The probe lists every spent end the turn log keeps, because a night's hold runs past the 16-line tail. A node whose last turn was spent and that is `node-stuck` for any reason says so on its line."},{"date":"2026-11-04","text":"The work is committed on the branch token-budget as 5b10b1a, after d64739c filed this record. It reads the turn drivers' `--budget`, which cs-sandbox's ee36177 adds on its own branch token-budget. Close this once both branches are on main."}],"links":["SAC-099"]}],"drafts":[],"queue":{"recommendedBy":"session agent","updated":"2026-09-21","items":[]},"description":"cs-campaign gives a team of AI coding agents one mission, runs each in its own Firecracker microVM, and preserves the evidence of what they did. This ledger tracks its defects, improvements and ideas.","links":[],"commitUrlTemplate":null,"rendererVersion":"0.7.5","uiVersion":"0.3.1-dev.20261029181327.893b2b0","lastActivity":"2026-11-05","de
