# The smallest complete campaign: one orchestrator and one agent, on one
# repository. `make check` validates this profile, so it is an example that
# stays true. A real campaign's own files live outside this repository
# (CONTRIBUTING.md).
#
# Point both repositories at your own checkout of the report generator the
# mission names. Until the path exists, plan pins an empty first commit and
# creates nothing, so validate, orientation and plan all run on the example
# as it stands.
apiVersion: codesweep.ai/v1alpha1
kind: CampaignProfile
defaults:
  engine: firecracker
  deadline: 90m
orchestrator:
  cli: codex
  auth:
    apiKey: [openai]
  repos:
    - path: ~/src/report-generator
agents:
  worker:
    cli: codex
    auth:
      apiKey: [openai]
    repos:
      - path: ~/src/report-generator
