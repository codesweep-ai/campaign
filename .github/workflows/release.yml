# Tagged release: static Linux binaries, checksums, a bill of materials and a
# keyless cosign signature over the checksums. Triggered by pushing a v* tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release
  id-token: write # keyless cosign signing via ambient OIDC

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v4
      - name: install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          # --parallelism 1 is load-bearing, not a throttle: .goreleaser.yaml's
          # pre hook builds the embedded guest binary for the target being
          # built, into the single path //go:embed reads. Concurrent targets
          # overwrite each other's guest and the arm64 archives ship an amd64
          # one, which fails with an exec format error at `create`.
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
