"]},{"id":"SAC-026","title":"A member whose only credential is an unset variable is provisioned with none","type":"defect","severity":"high","status":"closed","foundBy":"session agent, after four fresh-agent runs asked for a way to check credentials before spending: \"the tool does not offer a dry-run credential check\"","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["19bd643"],"integrated":[],"verified":"go test ./internal/cli/ -run TestAMemberWhoseOnlyKeyIsUnsetIsNamed -count=1: PASS. It holds four things. The member with nothing else is named, the two with another grant are not, create refuses with the remedy, and setting the variable silences both. Proved by mutation: dropping the guard that skips a member with another grant reports one that has a login, and the test fails on it. End to end, the probe profile draws two warnings, setting either variable clears them, and adding a login to one member clears that one alone. make check exit 0."},"resolution":"`create` refuses a member whose only grant is `apiKeyFromEnv` when none of the named variables is set, naming the member, the variables and the remedy. `validate` and `plan` warn instead, because they may run in a different shell from the one that exports the key.\n\nA member that also declares a key or a login is left alone. The grant ladder is first-available rather than additive, so that member has somewhere else to go, and reporting it would make the warning noise.\n\nOnly the environment half is checked. A lent login lives on the host and belongs to cs-sandbox, which offers no way to report which logins it can lend. Keeping a copy of that knowledge here would drift, and the same reasoning already sends the tool list to `cs-sandbox agent-tools`.","details":"A profile can name environment variables that hold no key, and every command accepts it. The member is created with no credential and fails at its first turn.\n\nProved by probe. A profile whose members declare `apiKeyFromEnv` naming variables that are not set validates with exit 0 and no warning.\n\nNothing catches it later either. At create, `selectedAPIKey` walks the declared variables and returns empty when none is set, and `prepareAuth` treats empty as nothing to do and returns no error. The member boots, the model call has no key, and the failure arrives as a turn that cannot run.\n\nThe cost is the whole point of checking before a spend. Machines are provisioned and billing by the time anyone learns the key was never there.\n\nFour agents in six runs asked for exactly this. They could name the grant in a profile and had no way to learn whether the host could satisfy it. One said plainly that it could not verify credential viability without running create.\n\nOnly the environment half is checkable here. A lent login lives on the host and belongs to cs-sandbox, which offers no way to report which logins it can lend, and duplicating that knowledge would drift. An environment variable is this product's own business, because it is this product that reads it.","notes":[{"date":"2026-09-09","text":"The other half is an upstream request. Asking whether this host can satisfy `agentLogin` needs a cs-sandbox verb that reports lendable logins, beside the `agent-login` verb that creates one. Until that exists, a profile naming a login is still unverifiable before the spend."}],"links":[]},{"id":"SAC-027","title":"A scaffolded brief passes the check meant to refuse an unbriefed fleet","type":"defect","severity":"high","status":"closed","foundBy":"user report (host), asking why the stubs exist at all: \"we are just adding more docs to keep in sync\"","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["c600741"],"integrated":[],"verified":"go test ./... -count=1: every package passes. TestValidateRefusesWhatInitEmitsUntilTheDocumentsAreWritten runs both halves. A freshly scaffolded campaign is refused and the refusal names all four missing files, and the same profile validates once they exist. TestInitScaffoldsOnlyTheProfile holds that no seeded document is written. End to end, init prints one wrote line and validate exits 1. The embed count fell from 9 inputs to 6. make check exit 0."},"resolution":"`init` writes the profile and names the rest. The mission and the briefs are the documents a member is seeded with, so leaving them absent is what makes the existence check mean something. An unwritten campaign is now refused by name, and the refusal says why nothing scaffolds them.\n\nThe guidance the stubs carried lives in the playbook. Its headings match the ones a brief and a mission use, so it reads as a key rather than as prose about the topic. That removes three documents that restated it and could disagree with it, which one already had. It also ends the leak, because a comment written for the operator was seeded to the member verbatim.\n\nThe profile keeps its scaffolding and its comments. It is never seeded, so nothing it carries reaches a member.","details":"`init` writes a brief for every member, and a brief nobody filled in passes validation.\n\nA campaign scaffolded and left entirely untouched validates clean. Running validate on it prints a valid profile line and a mission digest beside a count of role briefs, with every blank still blank. The check behind that line asks whether the file exists. Nothing asks whether anyone wrote it.\n\nR30 forbids a briefing of exactly this shape. A briefing that could be silently substituted for a generic one must not exist, because a member handed boilerplate restates the boilerplate faithfully and the readback cannot see through it. The scaffolding manufactures such a briefing, so `init` turns \"no brief, refused\" into \"generic brief, accepted\".\n\nThe stubs cost more than that. Each one restates guidance the playbook owns, so each is a second copy that can disagree with the first, and one already has. The mission stub named two outcome values the product does not have, which is SAC-021.\n\nA stub also carries authoring guidance into the member. A stub's comments are written for the operator and reach the member verbatim, because nothing strips them. The digest recorded for a seeded file equals the sha256 of the raw file on disk. An author who fills in the blanks and leaves the scaffolding ships authoring guidance into a member's standing context.\n\nThe line worth drawing is whether a file is delivered. `profile.yaml` is never seeded, so its scaffolding is pure value and its comments reach nobody. `mission.md` and `roles/\u003cmember>.md` are delivered, and for those an empty directory refuses the campaign while a scaffolded blank does not.","notes":[{"date":"2026-09-09","text":"One test kept the defect in place. TestValidateAcceptsWhatInitEmits held that a scaffold validates, which was the behaviour that let an unbriefed fleet through. It is inverted rather than deleted, because the convention it also pinned is real: init writes where the loader looks."},{"date":"2026-09-09","text":"This record was filed as SAC-022 on a branch and renumbered on integration. The maintainer's own SAC-022 reached the remote first, and an ID belongs to whoever integrates it. The record is otherwise unchanged, and the work it describes is unaffected."}],"links":["SAC-018","SAC-021"]},{"id":"SAC-028","title":"An opencode member's declared model was never confirmed","type":"defect","severity":"med","status":"closed","foundBy":"user report (host), reading a live readback line: \"it's odd with the no readback for opencode\"","opened":"2026-09-17","resolved":"2026-09-17","stint":"2026-09-17 opencode readback session","evidence":{"commits":["d05958e"],"integrated":[],"verified":"go test ./internal/cli/ -run 'TurnConfig|OpencodeEffort' -count=1 passes. TestTurnConfigReadsTheOpencodeLog runs the reader for real against a log copied from a live member, and finds both the build model and the smaller title model. Mutating the awk field offset by one character made it fail, so the test holds the shell rather than the wording. make check passes."},"resolution":"The reader now has an opencode branch. It reads the provider and the model out of the opencode log and composes them as provider slash model, which is the form a profile declares. Effort stays unconfirmable, so it now has a predicate of its own and an opencode member that declares one is no longer checked against nothing.","details":"A readback confirms that the model a profile declares is the model the turn answered on. For claude and codex it reads the session transcript. For opencode it did neither, and printed that the declaration could not be confirmed.\n\nThe reason recorded in the code was that opencode keeps its sessions in a SQLite store, with no transcript to read. That is true of the sessions. It is not true of the model, which the opencode log names on every stream line, beside the provider.\n\nSo every opencode member ran with an unverified model. A profile could name one model, the turn could answer on another, and nothing would say so. A fleet of opencode members had no confirmed model at all, which is the case a demo campaign hit.","notes":[{"date":"2026-09-17","text":"A first reading of this blamed the wrong file. The archive holds a session export naming the model, so the export looked like the thing to read. Checking a live member showed no export directory at all: the archive step writes it during collection, and at readback time only the SQLite store exists. The log is what is readable while a campaign runs, and a probe inside a running member is what settled it."},{"date":"2026-09-17","text":"Effort is the half that stays unconfirmed. The log carries a reasoning count rather than the effort label a profile declares. Claiming the whole declaration readable would have failed a correctly configured campaign on its effort, so the model and the effort are now asked separately."},{"date":"2026-09-17","text":"The log names a second model on the same run, because the title subagent answers on a smaller one. The existing rule already covers this: a declaration has to be present among what answered rather than alone. The test asserts both models are reported, so a future change cannot quietly narrow it to one."}],"links":[]},{"id":"SAC-029","title":"The orchestrator's orientation names fetch and never push","type":"improvement","severity":"med","status":"closed","foundBy":"session agent working in the simple-tools-demo repository, which runs a three member campaign at the pinned build of 2026-09-17, while reading why an orchestrator improvised a handoff","opened":"2026-09-19","resolved":"2026-10-01","stint":"campaign-push-feature-s1","evidence":{"commits":["c99d056"],"integrated":[],"verified":"TestTheOrientationTeachesPush passes under `go test ./internal/cli/ -count=1`, and `grep -n push internal/cli/assets/orientation.md.tmpl` now prints the two passages. The full gate, `make check`, passes."},"resolution":"The orchestrator's orientation carries a bullet beside the one that teaches `fetch`. It says to hand work to a teammate with `cs-campaign-member push \u003cmember> [repo] --commit \u003csha>`, which lands at `refs/campaign/orchestrator` in the teammate's clone, and then to say so in the dispatch. It says to name the commit, because a push carries the whole history behind it, and that a push carrying a withheld path is refused and logged (SAC-092). The agent's half says the orchestrator can push to it at that ref, and that a dispatch names it when it has. The demo campaign's role brief still carries its own copy of the instruction, which it no longer needs.","details":"`internal/cli/assets/orientation.md.tmpl` tells the orchestrator to judge a reply with `cs-campaign-member read \u003cmember>` and `cs-campaign-member fetch \u003cmember>`. It does not mention `cs-campaign-member push \u003cmember>` anywhere. `MANUAL.md` documents `push`, and it is the only supported way to put work into an agent's clone.\n\nAn orchestrator reads the orientation and not the manual. In the demo campaign it had to hand the developer's work to a qa member. In one run it improvised, and in another it dispatched a command the member could not run. The qa member then spent three dispatches hunting for a branch it could never reach.\n\nThe demo now carries the instruction in its own role brief, which is a workaround every campaign author has to rediscover. With the brief naming `push` and the ref `refs/campaign/orchestrator`, the same orchestrator pushed to each member on cue in three runs.\n\nTo reproduce, run `grep -n push internal/cli/assets/orientation.md.tmpl`, which prints nothing.","notes":[{"date":"2026-10-01","text":"Closed on the branch that adds `--commit` and the withhold fence (SAC-092), so the orientation teaches the push with the commit named, which is the form a hold-out campaign needs."}],"links":["SAC-092"]},{"id":"SAC-030","title":"An agent the kernel kills for memory still reads as node-working","type":"defect","severity":"high","status":"closed","foundBy":"session agent working in the simple-tools-demo repository, which runs a three member campaign at the pinned build of 2026-09-17, while reading a member's session after an unexplained five minute stall","opened":"2026-09-19","resolved":"2026-09-20","stint":null,"evidence":{"commits":["8772e63","886b2a6"],"integrated":[],"verified":"`TestConformanceAKilledAgentIsRecoveredAtTheNextLook` passes. Before the change it failed with `the agent died at +100s and its next turn started at +316s`. `TestTheProbeCountsTurnsAndNotStateQueries` passes against real processes, and with the old probe line it counts 2 drivers where there is 1. Live, in a two member campaign, an opencode agent's server was killed with SIGKILL while it ran a four minute command. Five seconds later `observe` read `node-stopped`, `continue next`, `last turn ended`, `exit 5` and quoted `turn failed (opencode run exit 1)`. The continue was delivered 11 seconds after the kill. The member finished its work, and the campaign ended `campaign-met` with one continue and no restart."},"resolution":null,"details":"A member whose agent process is killed keeps reporting `node-working`, and nothing says the agent is gone.\n\nThe demo gave each member 2048 MiB. The agent was killed by the guest kernel during `npm install`. `sudo dmesg` inside the member printed `Out of memory: Killed process 7898 (opencode)`. The opencode session stopped with a tool call left in status `running`, and no error was recorded anywhere.\n\n`cs-campaign observe` went on showing the member as `node-working` with `0 cont, 0 restarts`. One member showed `open 360s` while its agent had been dead for minutes. About five minutes after the kill, `wait` prodded the member with a `d002.001.md` input, and a new session redid the work. It happened to two members in one run.\n\nRecovery was sound, so the campaign still had the outcome `campaign-met`. The cost is that the operator cannot tell a dead agent from a slow model. The stall was first taken for a slow provider. It was found only by opening the member and reading its kernel log.\n\nThe probe already visits the member on every poll. It could report that no agent process is running while a dispatch is open, which is a fact about the node and needs no guess about the cause.\n\nTo reproduce, create an opencode member with `resources: {memoryMiB: 2048}` and dispatch a task that runs `npm install` for a Vite application.","notes":[{"date":"2026-09-20","text":"Part of this is done in 8772e63, and the record stays open. The probe now asks the agent's turn driver whether the agent is in a turn. A node whose driver is alive while no agent session exists reads `node-working` with the words `a driver is alive and no agent session exists`, once the settling window has passed. That is the fact this record asked for. What is not done is the move: the state stays `node-working` until the driver gives up by itself. It has not been checked against a real agent killed for memory."},{"date":"2026-09-20","text":"Measured before the fix, on a real agent. The turn driver reports a killed agent within a second: it exits 5 and writes the turn's end to its log on the member. The agent's own answer to `--state` is `absent` within five seconds. So the five silent minutes this record describes were not the driver's. They were the settling window, which held the ladder for 300 seconds after the newest message although the turn had already recorded its end. A turn that has recorded its end now skips the window. The earlier note here prepared for a driver that outlives its agent. On this agent that does not happen, and the wording for it stays in place for an agent where it does. One false lead is worth recording. A loop that polled `--state` matched the probe's own process pattern and counted itself as a live driver for three minutes. The probe now leaves such a call out of its count."}],"links":[]},{"id":"SAC-031","title":"The global --json flag is ignored by version and doctor","type":"defect","severity":"low","status":"open","foundBy":"session agent working in the simple-tools-demo repository, which runs a three member campaign at the pinned build of 2026-09-17, while scripting a version check","opened":"2026-09-19","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`cs-campaign --help` lists `--json   print machine-readable JSON` as a global flag. `cs-campaign ls --json` does what the flag says. `cs-campaign version --json` and `cs-campaign doctor --json` both accept the flag, print their ordinary text, and exit 0.\n\nA script that asks for JSON and gets text fails later and further away, in whatever parses the output. A flag a command cannot honour should be refused by that command.\n\nTo reproduce, run `cs-campaign version --json`. It prints the same single line of text as `cs-campaign version`.","notes":[],"links":[]},{"id":"SAC-032","title":"destroy leaves each member's recorded agent session on the host","type":"defect","severity":"med","status":"closed","foundBy":"session agent working in the simple-tools-demo repository, which runs a three member campaign at the pinned build of 2026-09-17, after the previous session in that repository lost a day to the failure this causes","opened":"2026-09-19","resolved":"2026-09-20","stint":null,"evidence":{"commits":["1e5b683"],"integrated":[],"verified":"`TestANewMemberForgetsTheSessionOfAnEarlierLife` passes: stale markers read as a session to resume, create fails by name when they cannot be dropped, and a new member is fresh once they are. Live, a two member campaign was destroyed and the host then held 0 session markers for it. The same profile was created again under the same campaign id, every readback passed on a new session, and the campaign ran to its verdict."},"resolution":null,"details":"`cs-campaign destroy` removes the members and the campaign record. It leaves the host's record of each member's agent session under `~/.cs-\u003ccli>-remote-sessions`. After destroying a three member opencode campaign called `hello`, nine files named `hello-\u003cid>-\u003cmember>` were still there, and three of them were `.token` files.\n\nThe leftovers change what the next create does. `hostSessionFresh` in `internal/cli/sandbox.go` treats a present marker as a session to resume. The campaign id is the profile digest, so creating the same profile again produces the same session names. The turn driver then drives the old session id against a brand new member.\n\nThe previous session in the demo repository reported what follows. Every turn failed with `TUI server does not know session`, and that surfaced as `opencode TUI exited during startup (port NNNNN in use, or launch failure)`. The message blames ports and startup, so three runs were spent there. This session did not reproduce that failure, because the demo now deletes the markers before each create. It did confirm the leftovers and the code path.\n\nThe sandbox tools already ship `cs-\u003ccli>-remote-forget`. `destroy` could call it for each member, and the startup error could name a stale session as a cause.\n\nTo reproduce, create and destroy any opencode campaign, then run `ls ~/.cs-opencode-remote-sessions | grep \u003ccampaign-name>`.","notes":[],"links":[]},{"id":"SAC-033","title":"Let an operator record and replay a campaign, as the smoke tier already does","type":"feature-idea","severity":"med","status":"open","foundBy":"session agent working in the tour repository, which records and replays a three member campaign through cs-vcr, after building the same thing from outside in a shell script","opened":"2026-09-19","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The smoke tier replays a whole campaign from cassettes, with no credential and no provider. Everything that makes that work lives in test code: `internal/cli/vcrfabric_test.go`, `livecampaign_test.go` and `smoke_test.go`. The `cs-campaign` command has no way to ask for it.\n\nThe tour repository wanted a campaign a stranger can run for nothing, so it rebuilt the harness in a shell script, `scripts/campaign-vcr`. It works. One committed recording of a three member campaign, 157 model calls, replays with `upstream calls 0` and `misses 0`, and gives the same commit ids on every run. It took five recordings to get there, and what they needed is the design a `--record` and `--replay` pair would have to carry.\n\n1. **The proxy has to start in a gap.** The campaign's network does not exist until `create` makes the first member, and the first readback needs the proxy. The script polls for the network while `create` runs. Inside `create` this is one ordered step.\n2. **The network has to come from the campaign's own record.** The script first searched the host for a network with the campaign's name, and joined another campaign's.\n3. **The proxy has to outlive the mission.** The mission closes when the orchestrator runs `reply`, and the model still gets that command's result and may make one more call. A proxy stopped at mission close records one request short, and every replay then misses at the end.\n4. **A lent member needs only its base URL.** `OPENCODE_BASE_URL` in the profile's `env:` block is enough, because cs-sandbox makes it the loan's upstream. `CS_SANDBOX_AGENT_HOME` has to name a tree with a key file of some kind for a replay.\n5. **`CS_CAMPAIGN_WAIT_SECONDS` must not be shortened when the agents do real work.** A wait that returns before `npm install` has finished lets the recorded orchestrator act on work that does not exist yet.\n6. **The recorder's identity has to be blanked.** The harness blanks the username. A real agent also prints the git name and address, and makes up mail addresses, which the sandbox record SBX-043 and the vcr records VCR-025 and VCR-026 describe.\n7. **The world has to be held still for the result to repeat.** `NPM_CONFIG_BEFORE` and fixed `GIT_*` dates gave byte-identical deliveries.\n8. **A cassette goes stale silently.** Any edit to the mission, a brief or the profile changes the prompts. The tour stores a hash of them beside the cassette, and its gate compares it.\n\nWith the flags in the command, a campaign author gets a free rehearsal of their own campaign. They also get a CI job that proves a brief change did not break the protocol.","notes":[],"links":["SAC-029","SAC-032"]},{"id":"SAC-034","title":"A member the provider is throttling is marked stuck: the ladder answers a rate limit with continues and a restart that re-send the same context","type":"defect","severity":"high","status":"closed","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records after both campaigns had ended","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["8772e63"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run Conformance -count=1`: 14 of 14 scenarios PASS. `TestConformanceThrottleThatClears` and `TestConformanceFleetDoesNotResumeInStep` failed before the change with `the ladder charged 2 continues and 1 restarts` and `6 of 6 throttled members were resumed in the same second`. A live run then used two microVMs, a codex orchestrator and a codex agent on a lent key. An in-stream rate limit was injected on the agent for longer than codex's own retries. `observe` read `node-working` with `the agent is waiting out a provider error`, then `node-refused` with `throttled`, `1 refused in a row`, `provider asked for 13s` and `no rung spent`. A message of the new kind, `.resume.md`, was delivered 31 seconds after the refusal. The agent replied 28 seconds later, and the mission ended `campaign-met` with `0 cont, 0 restarts`."},"resolution":null,"details":"**What happened.** Three members of two campaigns were marked `node-stuck` with `2 continues and 1 restarts spent`. None had crashed. Each machine was up with memory free, its CLI processes were alive, and the kernel log held no kill. Every failed turn of all three ends on the provider's error, in the CLI's own session record. The error is a rate limit on tokens per minute, and it asks the caller to try again in 6 to 18 seconds.\n\n**The mechanism, in four steps.**\n\n1. Several members share one provider key. An agent loop makes a request every ten seconds or so, and each request re-sends the member's whole context. With contexts of 130,000 to 245,000 tokens, one member can ask for more in a minute than the key's per-minute allowance. Several together sit at the allowance for the whole campaign. Cached input was counted toward the limit in full.\n2. The CLI retries about five times over roughly a minute, then ends the turn with the error and no reply. The turn driver reports that turn as finished (filed in the sandbox ledger as SBX-044).\n3. `protocol.Compute` sees an open dispatch, no reply and no live driver, and returns `node-stopped` with `NextMove: \"continue\"`. The orchestrator's `wait` delivers the continue, in one case six seconds after the turn ended.\n4. The continue's first effect is that the member sends its whole context again, into the same exhausted minute. It fails the same way. Two continues and a restart went in 21 minutes for one member and 25 for another. The restart is the worst rung for this failure, because it wipes the session. The member then re-reads its brief and its whole dispatch thread, and it rebuilds the same large context before it does any work.\n\n**Why the protocol's own reasoning does not cover this.** PROTOCOL.md says *\"The ladder replaces diagnosis\"*, because a node that stopped and a session that wedged *\"are not distinguishable by observation\"*, and for those two causes retrying is the cure. A throttle is a third cause, it **is** distinguishable, because the CLI's session record names it, and retrying is not the cure: retrying is the load. The ladder's two remedies both make it worse.\n\n**What it cost.** In one campaign a member was lost before it had committed anything. The orchestrator's only available recovery was to give that member's job to a member with different mounts. That defeated a hold-out the team's design depended on. About two hours of a campaign of under four were spent waiting on turns the provider then ended. The orchestrators behaved correctly throughout: a member inside its ladder is, as far as they can know, working.\n\n**How to reproduce, without a real limit.** Give a member a provider base URL that answers every model call with the provider's rate-limit response for longer than the CLI's retry budget. A local stub is enough. Dispatch to it. Expected today: the turn ends without a reply, `observe` shows `node-stopped · continue next`, the continues and the restart are delivered minutes apart, and the member ends `node-stuck` while its machine is healthy. This reproduction is described from the observed behaviour and from reading `internal/protocol/state.go`; it has not been run against a stub.\n\n**What would fix it.** A turn that ended on a provider throttle should cost a wait and not a rung. The harness should back off, with jitter, for at least as long as the provider asked. It should neither count a continue nor ever reach the restart. The elapsed bound can still apply, so a member cannot wait forever. That needs the turn's end to carry a reason, which is SAC-035. Until then the campaign's own policy is the only lever, and a longer ladder only moves the cliff: the defaults were spent in minutes against a condition that lasted hours.","notes":[{"date":"2026-09-20","text":"The reproduction the record could only describe now runs with no machine. A scripted provider throttles one agent for forty minutes while the real wait loop runs on a simulated clock. The agent is charged two continues and one restart, and it is stuck fifteen minutes after its dispatch opened. This record is now worked as one stint with every record marked `reliability-2026-09`, which includes the three filed today. They share one cause, which is that the harness knows too little about why a node is quiet. The sandbox's turn drivers now report a failure class and whether an agent is in a turn. The plan is to read both from the node's own machine."}],"links":["SAC-035"]},{"id":"SAC-035","title":"A turn's end carries no reason, so a throttle, an outage and a rejected credential all read as a member that stopped","type":"improvement","severity":"high","status":"closed","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records after both campaigns had ended","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["8772e63","8401224","c1e5e66"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run Conformance -count=1`: 14 of 14 scenarios PASS. `TestConformanceRejectedCredentialStopsAtOnce` failed before the change with `4 turns were started against a credential the provider rejects`. `TestAwaitReplyNamesARejectedCredentialAtOnce` and `TestAwaitReplyWaitsOutARefusalAndSaysSo` pass for the readback at create. Live, a 401 was injected on an agent. Sixteen seconds after the dispatch `observe` read `node-stuck` with `the provider rejected this node's credential` and quoted the turn driver's words. The mission ended `campaign-blocked` 40 seconds after the dispatch, and the agent's input channel held only the opening message. An archive of a live campaign held `.cs-turns/codex.log` for both members."},"resolution":null,"details":"**What is missing.** The protocol's facts about a node are its messages, its replies and a count of live turn drivers. When a turn ends without a reply, nothing anywhere says why. The CLI knew: its own session record held the provider's error, word for word. The turn driver could have known. The harness never finds out, so `observe` shows `node-stopped` and the ladder runs (SAC-034). An operator learns the cause only by opening a member's session store after the campaign is over.\n\n**Why it matters beyond rate limits.** The same silence covers every provider-side failure, and each wants a different answer:\n\n| why the turn ended | what it looks like today | what it should cost |\n|---|---|---|\n| provider throttled the key | `node-stopped`, then `node-stuck` | a wait with backoff; no rung of the ladder |\n| provider at capacity, or down | the same | pause the dispatch clock and say so on the host, loudly; a campaign that waits out an outage has learned nothing |\n| credential rejected or expired | at create, `readback FAILED`, which the manual already says *\"looks like silence\"* and is indistinguishable from a bad brief | stop at once and name the credential |\n| context too long for the model | the same as a stop | a finding for the orchestrator, not a retry |\n| the model finished its turn without replying | `node-stopped` | the ladder, as now |\n\nOnly the last is what the ladder was built for. An operator watching two campaigns saw three healthy members marked stuck. Nothing the tool printed could tell them whether a machine had died, a model had wedged or a provider was refusing calls. The next outage at any provider will look exactly the same.\n\n**What is asked for.** A typed reason on every turn end, written by whatever is closest to the CLI and knows it. The turn drivers are the sandbox repository's, and the matching record there is SBX-044. The reason should be carried in the node's facts and shown by `observe` beside the state, for example `throttled 4m, provider asked for 12s`. It should be kept by `archive`, and be available to the orchestrator's `wait`, so that it can choose a wait over a rung. A reason the driver cannot classify should be recorded as unclassified with the CLI's own text, never dropped.\n\n**How to reproduce the gap.** Make any model call fail at the provider for a member with an open dispatch, by any of the means in the table. Every one of them produces the same `observe` line.","notes":[{"date":"2026-09-20","text":"The sandbox half is SBX-060 in the sandbox ledger: each turn driver now appends how a turn ended to a log on the agent's own machine. The probe reads its tail as `TURNEND` lines in the same round trip as everything else. The outage row of this record's table is handled as a wait and not by pausing the dispatch clock. One absolute backstop, the elapsed bound, stays in force, and a separate number, `providerWaitSeconds`, bounds the wait itself."}],"links":["SAC-034"]},{"id":"SAC-036","title":"observe reads an orchestrator that is working as node-stopped once its turn driver has exited","type":"defect","severity":"low","status":"closed","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records after both campaigns had ended","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["8772e63"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run Conformance -count=1`: 14 of 14 scenarios PASS. `TestConformanceTheAgentsOwnWordDecidesWorking` holds an agent in a turn of its own for two hours with no driver alive. Every look reads `node-working`, and no message is sent. With the agent's word ignored the test fails with `an agent in a turn of its own read node-stopped`. Live, the probe's `AGENT` line was read from a real agent: `observe` showed `the agent is waiting out a provider error` while the agent's driver reported `busy retrying`. A turn that an agent started by itself was not reproduced live."},"resolution":null,"details":"**What happened.** For the last forty minutes of a campaign `observe` showed the orchestrator as `node-stopped · m1 · 0 cont, 0 restarts · continue next`. In those forty minutes it accepted a member's reply, wrote and committed the campaign's report, dispatched the final job, merged it and replied to its mission. Nothing was wrong with the campaign. An operator who believed the line would have sent a nudge to an orchestrator that was mid-task, which the playbook rightly calls the most expensive kind of intervention.\n\n**The mechanism.** `protocol.Compute` returns `node-working` only while `Facts.Drivers > 0`, that is, while a turn-driver process is alive for the node's CLI family. A turn driver wraps a turn the host started. The orchestrator here ran on the claude CLI, and it did what its briefing invites. It started a background shell loop that polls `cs-campaign-member observe` until a member is no longer working. Then it said it would wait, and ended its turn. The driver saw the turn end and exited. Minutes later the loop finished, the CLI's own runtime delivered the completion to the session as a new turn, and the session went on working. No driver wraps that turn, because the host did not start it. `Drivers` stays at zero for the rest of the campaign while the session works.\n\n**What follows from it.** Any consumer of \"no node is working\" is wrong about a live campaign from that moment. A watcher that waits for the campaign to leave `node-working` fires early. The PROTOCOL says that *\"the orchestrator cannot observe its own death, so the host is the only party that can see it has stopped\"*. That statement still holds, but the host's view of that one node is now a false positive. An orchestrator that stopped and one that continued itself print the same line.\n\n**How to reproduce.** Run a campaign whose orchestrator is on the claude CLI. Have its brief tell it to wait for a member by starting a long-running command in the background and ending its turn. After the driver exits, watch the orchestrator's branch: commits keep arriving while `observe` reports `node-stopped · continue next`.\n\n**What would fix it.** Liveness for a node should not rest on the driver alone. The session's own record growing, or the CLI process holding an active turn, is evidence of work that a driver count cannot see. Alternatively the orchestrator's waiting should be something the harness provides and a driver stays alive across. An orchestrator would then never have a reason to end a turn to wait.","notes":[{"date":"2026-09-20","text":"Half of this is done in 41fec1d, and the record stays open for the other half. A `node-stopped` line now says when the node's own session record last changed, as in `continue next · session record changed 40s ago`. An operator reading that line would not have nudged the orchestrator in the case above. The state itself still reads `node-stopped`, on purpose. The record's age was tried as a second measure of liveness and rejected. A node blocked in one long tool call writes nothing. A probe run inside a live three member campaign showed exactly that. The orchestrator had a live driver and a record 27 seconds old, because it was blocked in `wait`. A state that rested on the record would also delay the ladder for a member that had truly stopped. The proper measure is whether the agent is in a turn, whoever started it. The sandbox's turn drivers already know how to tell, and SBX-056 in the sandbox ledger asks for that as a command a probe can run. When it exists, `Compute` should use it beside the driver count, and this record can close. The severity is lowered to low because the misleading line now carries the evidence that corrects it."},{"date":"2026-09-25","text":"A live campaign on a build carrying this fix read `node-stopped · continue next` for 3h19m while its orchestrator worked. The orchestrator waited in background tasks, so between its 22 self-started turns no driver was alive and the agent was idle. The `busy` word sees a self-started turn only while it runs. SAC-067 records that gap and the failures it hides."}],"links":["SAC-035","SAC-067"]},{"id":"SAC-037","title":"destroy has no preview: nothing says what it will remove before it removes it","type":"improvement","severity":"low","status":"closed","foundBy":"session agent about to destroy one of two eight-member campaigns on a host where a third campaign belonged to someone else","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["0abc452"],"integrated":[],"verified":"`TestDestroyDryRunNamesWhatItWouldRemoveAndRemovesNothing` drives the command against a fake `cs-sandbox` that logs every call. The preview named two present members in destroy order, one absent member, one stray machine in the group, the archive root and two host session records. It left out a sandbox in another group. The only calls it made were `ls`, no archive directory appeared, and the campaign record still loaded. `--archive-output` without `--archive` was refused in a preview too. The built binary was then run against a live three member campaign on a real host, in the middle of its run. It showed the three members as `present, running`, with the last member first. It counted the 2 sandboxes outside the group and 9 host session records. The three machines and the record were still there afterwards, and the campaign finished its run with no fault. `make ci` passed every gate up to the smoke tier. The smoke tier failed once, in a scenario this change cannot reach, for the cause now noted in SAC-008. It passed all six scenarios when run again on the same tree."},"resolution":null,"details":"**The gap.** `cs-campaign create` takes `--dry-run` (*\"resolve only; create nothing\"*), and an operator can read back exactly what will be provisioned before spending anything. `destroy`, the one command in the surface that cannot be undone, has no equivalent. Its flags are `--force`, `--archive` and `--archive-output`. It loads the campaign's record, lists the live sandboxes, and destroys every member whose ref is present, last member first; with `--force` it asks nothing.\n\n**Why it matters.** Destroying a campaign takes each member's machine with it, and with the machine everything that was never fetched or archived: uncommitted work, the member's out-of-tree output, its CLI session store. The playbook tells an operator to harvest first and to check rather than assume. The check an operator wants at that moment is the tool's own answer to *\"which machines, exactly?\"*. On a host that is running more than one campaign, possibly someone else's, they also want to ask *\"and nothing else?\"*. Today the only way to get it is to go around the tool, by listing the sandboxes and filtering by the campaign's group by hand. That is the operator re-deriving the member set the command already holds.\n\n**What is asked for.** `destroy \u003ccampaign> --dry-run`: resolve and print, and remove nothing. It should name the group, and every member it would destroy, with its sandbox ref and whether that machine is present. It should name any member in the record that has no live machine. It should say whether `--archive` would run first, and where to. It is also the natural place to say what `destroy` does **not** remove. An operator is then not surprised later by what a removed campaign leaves on the host. SAC-032 is one case: each member's recorded agent session stays behind.\n\n**How to see the gap.** Read `cs-campaign destroy --help` beside `cs-campaign create --help`.\n\n**Not a regression.** `destroy` has never had this flag in this repository's history; it is filed as an improvement for that reason.","notes":[],"links":["SAC-032"]},{"id":"SAC-038","title":"A replay of real work can cross the wait chunk on a slow host, and the documents only say how to shorten it","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, maintainer of this repository, after repeated replays of one recorded campaign on a shared host","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["b7a128b"],"integrated":[],"verified":"`TestTheDocumentedWaitOverrideCanBeRaised` passes, and it fails when the sentence is taken out of MANUAL.md. It also holds that an override of 840 stands against the default and against a smaller `--for`. A full replay of a recorded three member campaign then ran with `CS_CAMPAIGN_WAIT_SECONDS=840`, which the pinned `create` forwarded to the members. It served every recorded call with no miss and delivered the recorded commit ids. The idea of making an elapsed chunk visible outside the model stays open as a design question, and it is not part of this closure."},"resolution":null,"details":"**What this is.** SAC-033 asks for `--record` and `--replay`, and lists what a replay has to hold still. A cassette fixes what the models say. It cannot fix how long an agent's real work takes, such as a package install. So the question is which timers in this harness turn elapsed time into control flow.\n\n**The wait chunk does.** `wait` returns when its chunk elapses, 240 seconds by default, whether or not a reply arrived, and it tells the model to call `wait` again. A live orchestrator does. A recorded orchestrator does whatever it did when recorded. Suppose a dispatch took under 240 seconds in the recording and takes longer in the replay. The proxy tolerates the changed tool result, and the recorded orchestrator then reads and accepts a reply that does not exist yet. The conversation replays with no miss, and the delivery is wrong. The other direction is harmless, and it was observed. A chunk that elapsed in the recording returned a judgment in the replay, the next recorded `wait` returned at once, and the delivery was identical.\n\n**The setting already exists.** `CS_CAMPAIGN_WAIT_SECONDS` overrides the chunk, `--for` included, and `create` forwards it to the members. The function `WaitChunk` accepts any value, so it can go above the default as well as below it. SPEC §6.1 and R126, and the manual, present it only as the way a replay tier shortens a wait. A replay of real work needs the opposite. The ceiling is the tool call timeout that the recorded model asked for, which is part of the recording and so is constant. In the recording studied it was 900 seconds, so a chunk of 840 seconds is safe and gives three and a half times the default.\n\n**What is asked for.** Say in the manual and in SPEC §6.1 that a replay whose agents do real work should raise the chunk. Say what bounds it, and add the doc claim test that keeps the sentence true. Consider making an elapsed chunk visible outside the model, so that a wrapper can fail a replay whose `wait` elapsed where the recorded one returned a judgment. Today only the model is shown that line.\n\n**How to reproduce.** Replay a recorded campaign on a host slow enough that one dispatch takes more than 240 seconds where the recording took less. The replay ends with no miss and a wrong delivery. Set `CS_CAMPAIGN_WAIT_SECONDS=840` and it passes.","notes":[{"date":"2026-09-20","text":"Corrected on the day it was filed, after reading the source. The first text named three timers, and two of the claims were wrong. The stall threshold does not fire on slow work. Each turn driver calls a stall only when the agent is no longer working. The opencode driver asks the server whether the session is busy. The claude and codex drivers check the TUI state as well as the transcript. A long silent tool call is busy. The readback bound of 15 minutes is about fifteen times a healthy readback, so it is not a practical risk either. The type went from defect to improvement and the severity from med to low, because the setting that solves the remaining case already exists and is forwarded."}],"links":["SAC-033","SAC-030"]},{"id":"SAC-039","title":"Every lent scenario of the smoke tier failed at create on Linux, because the lender had no binary to run","type":"defect","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository, running `make ci` before a push","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["b83f35c"],"integrated":[],"verified":"Before the change, `make ci` on a Linux host reached `test-smoke` and failed. Five scenarios were reported as `create-failed`, and each one had `exec: \"cs-sandbox\": executable file not found in $PATH` from the lender container. After the change, `make test-smoke` on the same host passed all six scenarios of `TestSmokeReplay` with exit 0, and left no sandbox behind."},"resolution":null,"details":"A lent scenario puts a credential lender on the campaign's network, and that container runs `cs-sandbox lender`. The slim image the test tiers boot carries no `cs-sandbox`. `cs-sandbox` copies one in only when `CS_SANDBOX_LENDER_BIN` names it, which is the change SBX-041 describes in the sandbox ledger.\n\nThe helper `ensureLiveLenderBinary` in `internal/cli/livecampaign_test.go` sets that variable, and it returned early on Linux. Its comment gave the reason: `cs-sandbox` mounted its own executable into the lender on Linux. That stopped being true when the pin moved onto the sandbox revision that holds SBX-041. From then on the lender container started and died at once on a Linux host, and the campaign reported only that create had failed.\n\nThe unit tier fakes `cs-sandbox`, so it could not see this. The smoke tier skips itself where a host cannot carry it, so a CI runner with no KVM could not see it either. It took a Linux host with KVM and a full `make ci`.\n\nThe helper now sets the variable on every host, and its comment says why.","notes":[],"links":["SAC-033"]},{"id":"SAC-040","title":"Once one node is stuck, every later wait returns at once, so the orchestrator can no longer block","type":"defect","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository, running the wait loop against a simulated fleet on a scripted clock","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["b5baae0"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run Conformance -count=1`: 14 of 14 scenarios PASS. `TestConformanceStuckNodeDoesNotEndEveryWait` failed before the change with `wait returned 51 times without the clock moving`. Live, a campaign whose agent was stuck on a rejected credential showed one `reported dev/d002` entry in the orchestrator's log, followed by its assessment and its verdict."},"resolution":null,"details":"**What happens.** `wait` returns when a judgment is due, and `node-stuck` is a judgment. A stuck node stays stuck for the rest of the campaign, and nothing the orchestrator can do acknowledges it. So from the moment one node is stuck, every call to `wait` returns on its first look, before it sleeps once. The other nodes may have hours of work left.\n\n**Why it matters.** PROTOCOL.md §8 puts the polling where no tokens are spent. After the first stuck node that stops being true. The orchestrator's model pays a full turn for every look at the fleet. A model that notices this does the reasonable thing: it starts a poller in the background and ends its turn. Nothing can wake it, and the host then reads the orchestrator as `node-stopped`, which is the failure in SAC-036. One lost member therefore degrades the whole campaign, and how it degrades depends on the model.\n\n**This defect was fixed once already, for another state.** The comment above `cmdWait` describes the same fault for `node-free`. It says the state *\"could not be waited out\"* and that `wait` *\"returned on its first snapshot, before sleeping once, for the rest of the campaign\"*. `node-free` was taken out of the judgments for that reason (SPEC R125). `node-stuck` has the same property and is still a judgment on every look.\n\n**How to reproduce.** Run a campaign of two agents. Let one spend its ladder and become `node-stuck` while the other has a long dispatch open. Call `wait` repeatedly. Every call returns at once with the same judgment. A scripted run counted 51 consecutive returns with no time passing before the test gave up.\n\n**What would fix it.** A judgment should end a wait once. The orchestrator already owes an assessment when it writes a node off, and that assessment is in its own log, which `wait` can read. A stuck node that the log has acknowledged since it became stuck would then be shown in the snapshot and would no longer end the wait. The rule has to stay computed from what is on the machines, as §6 requires, and must not become a flag that `wait` keeps for itself.","notes":[],"links":["SAC-036"]},{"id":"SAC-041","title":"The count of failed looks lives inside one wait call, so a lost machine is never concluded at the defaults, and other numbers let one network fault condemn every node","type":"defect","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository, running the wait loop against a simulated fleet on a scripted clock","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["ce8f2bf","81a2db9"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run Conformance -count=1`: 14 of 14 scenarios PASS. Before the change `TestConformanceLostMachineIsConcluded` failed with `ended node-unreachable and was never concluded gone`. `TestConformanceObserverOutageCondemnsNoNode` failed at a wait chunk of 840 seconds with `a was declared gone at +600s, during an outage that hid every node from the observer at once`. `TestConformanceASlowMachineIsNotALostMachine` fails with the missed-bound rule removed. Not run on real machines."},"resolution":null,"details":"**The mechanism.** PROTOCOL.md §5 says a run of failed probes is the conclusion that a machine is gone, and that the threshold is the operator's number. The run is counted in a map that `cmdWait` creates when it starts and drops when it returns. `observe` creates a fresh one on every call. The count is kept for each node separately. Two faults follow from those two facts, and which one a campaign meets depends on its numbers.\n\n**At the defaults a lost machine is never concluded.** One `wait` lasts 240 seconds and looks every 30, so it makes eight or nine looks. The threshold, `blindProbes`, is 10. No single call reaches it, and the next call starts from zero. A machine that has been gone for hours reads `node-unreachable` for ever. It does not become `node-stuck`, so `wait` returns no judgment for it. The orchestrator is not told that the node's queue is unreachable. §5 warns that such a dispatcher *\"will wait out its whole clock on work that can never be delivered\"*.\n\n**With other numbers, a fault of the observer's own condemns every node at once.** Raise the wait chunk, as the manual advises for a replay, or shorten the poll, and ten looks fit inside one call. Now suppose the orchestrator loses its network for five minutes, or its host is slow enough that probes pass their bound. Every probe fails, every node's count rises together, and every node is declared gone in the same look. The orchestrator is woken to write off a healthy fleet. §5 says a failed probe is *\"a fact about the observation rather than about the node\"*. When every probe of one look fails, the observer has learned something about itself and nothing about any node.\n\n**How to reproduce the first.** In a campaign of two agents at the default policy, make one agent's machine unreachable and leave the other healthy. After two hours `observe` and `wait` still show `node-unreachable`. A scripted run shows exactly that.\n\n**How to reproduce the second.** Set the wait chunk to 840 seconds and block the orchestrator's route to every agent for six minutes. `wait` returns with every node stuck as *machine gone*.\n\n**What would fix it.** Conclude that a machine is gone from elapsed time since the last look that reached it, and not from a count of looks. That measure does not depend on the chunk, the poll or how slow a probe is. The time of the last good look is the observer's own knowledge and can sit beside the orchestrator's log, so it survives between calls. A look in which no node answered should move no node toward the conclusion. A scenario for each half belongs in the conformance suite, because the fix for the first must not bring back the second.","notes":[{"date":"2026-09-20","text":"The first text of this record said one wait makes eight or nine looks. That holds on a real network, where a round trip takes time. The first version of the simulation charged nothing for a round trip, so exactly ten looks fit and the fault hid. The simulation now charges a second per round trip."}],"links":[]},{"id":"SAC-042","title":"A recovery message whose turn failed to launch still spends a rung, so a connection fault can exhaust the ladder without one turn running","type":"defect","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository, running the wait loop against a simulated fleet on a scripted clock","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["8772e63","b54a730"],"integrated":[],"verified":"`go test ./cmd/cs-campaign-member/ -run Conformance -count=1`: 14 of 14 scenarios PASS. `TestConformanceRungsAreOnlyChargedForTurnsThatStarted` failed before the change with `dev was charged 3 rungs and only 0 recovery turns ever started`. `TestStartTurnGivesUpOnALauncherThatHangs` ends a launcher that sleeps for 60 seconds after 4 seconds, under a bound of 2. Not run on real machines."},"resolution":null,"details":"**The mechanism.** The ladder's budget is counted from the node's input channel. `protocol.Current` counts every continuation file as a continue and every restart file as a restart. A recovery move is two steps: write the message into the node, then launch the turn that reads it. The rung is spent by the first step. If the second step fails, the message stays, the count has risen, and no turn ran.\n\n**When the second step fails.** Launching a turn is a longer path than writing a file. It crosses the network again, starts a terminal session, and waits for the agent's CLI to become ready. It fails under the conditions this harness most needs to survive. A network drops for a moment. A slow host makes the CLI miss its readiness deadline. A sign-in check at the provider times out. `wait` reports the failure as a line under *recovery performed while waiting*, and the next look sees a stopped node with one rung fewer.\n\n**What it costs.** Three failed launches in a row, a few minutes apart, leave the node `node-stuck` with *2 continues and 1 restarts spent*. Its machine was healthy and its session was never given a turn. The orchestrator is told the node is unrecoverable and writes off its queue. In a scripted run where the launcher failed for thirty minutes, the node was charged three rungs and zero recovery turns started.\n\n**A second gap on the same path.** The orchestrator's `startTurn` runs the launcher with no time bound, while every other route to a teammate's machine is bounded at 90 seconds for a stated reason. A launcher that hangs therefore hangs `wait` and every node behind it in the loop.\n\n**How to reproduce.** Let an agent's first turn end without a reply. Make the turn launcher fail for that agent while file delivery still works, for example by making the launcher's tool exit non-zero. Call `wait` until the ladder is spent. `observe` shows the node stuck, and its session record shows no turn after the first.\n\n**What would fix it.** Charge a rung only for a turn that started. A delivered message whose launch failed is still in the input channel, so the next look can launch a turn for it without writing another. The launch needs the same bound as the other routes. The count stays computed from the node's machine, as §6 requires, if a started turn leaves its own evidence there.","notes":[],"links":["SAC-034"]},{"id":"SAC-043","title":"An orchestrator can finish the mission inside its readback turn, so the mission's own trigger arrives after the mission is closed","type":"defect","severity":"low","status":"closed","foundBy":"session agent, maintainer of this repository, reading one unmatched request at the end of a smoke tier replay","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["a9d30a0","27dc8cb"],"integrated":[],"verified":"`TestTheMissionIsOpenedAfterTheReadbackTurnEnds` passes, and with the wait removed it fails with `the mission was delivered while the readback turn was still running`. `TestTheMissionIsOpenedAnywayWhenTheTurnNeverEnds` holds the bound. Live, the scenario that showed the fault was recorded again with the fix in place. The mission's prompt is now message 21 of 80 in the orchestrator's conversation, where it was message 72 of 77. The replay serves 45 of 45 requests with no miss, where every replay of the earlier recording missed one."},"resolution":null,"details":"**What happens.** `create` sends every member a readback dispatch and waits for each reply. It then opens the mission on the orchestrator. It writes `m1.md` and starts a turn with a prompt that says to read it. The readback reply is an artifact, and writing it does not end the orchestrator's turn. Some models stop there. Others look at their inbox, find the mission already open, and carry on. They dispatch the work, wait, judge it and reply to the mission, all inside the turn that the readback started. The turn `create` started for the mission is queued behind that one. Its prompt is delivered when the long turn ends, which is after the mission has been closed.\n\n**What it costs.** One model turn at the end of the campaign, spent on a prompt about work that is finished. In the session read here the model answered *\"I already closed m1 with campaign-met last turn\"* and ran an inbox check. A less careful model could do more than check. `observe` also shows the orchestrator as working for that extra turn, after the campaign has a verdict.\n\n**What it does to a recording.** A recording ends when the mission is replied to, and the members are then destroyed. The orchestrator is by then inside the spare turn, so its last recorded answer can be a tool call whose next request was never made. In a replay the timing differs, that next request can get out before the machines go, and the proxy reports one miss at the very end. The smoke tier still passes, because it fails on a call that reaches a provider and not on a miss. One scenario of six did this in one full run of the tier.\n\n**It depends on the run.** Among twelve recordings of six scenarios, the mission's prompt is near message 21 of the orchestrator's conversation in most. That is the expected place, straight after the readback. In three it is within six messages of the end, at message 75 of 80, 63 of 65 and 69 of 71. Those three come from two different agent families and from recordings made weeks apart.\n\n**How to reproduce.** Record any smoke scenario several times and find the index of the message that says to read `m1.md` in the orchestrator's last recorded request. When it is near the end, the mission was done in the readback turn.\n\n**What would fix it.** The rule `send` already follows for a continuation would fit here. A message delivered while a turn is running starts no second one, because the running one or the ladder picks it up. Opening the mission could apply the same test. The readback brief could also tell the orchestrator to end its turn after it confirms the briefing.","notes":[{"date":"2026-09-20","text":"Fixed by waiting and not by skipping the mission's turn when one is already running. The host does not recover the orchestrator during a campaign. A mission left for a running turn to find would never start if that turn ended without finding it. The wait is bounded at two minutes, and past it the mission is opened as before, with a line that says so. The sentence for the readback brief was left out, because it would change the bytes of every recorded session for a gain that depends on the model."}],"links":["SAC-008","SAC-033"]},{"id":"SAC-044","title":"One malformed readback fails the whole create, where asking the member once more would recover it","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, maintainer of this repository, creating a two member campaign for a live test","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["43edff0"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'MalformedReadback|SubstantiveReadback' -count=1` passes three tests against a fake member that keeps its channels as files. A readback with its closing brace missing is followed by a second dispatch, `d002`, which quotes `not valid JSON` and repeats the form, and the second answer is accepted. Two bad answers fail the member with `asked twice, and wrong both times`, and no third dispatch is sent. A readback that reports a seeded file absent fails at once with no second dispatch. With the rework switched off, the first two tests fail. The slip itself was not reproduced on a live model, because whether it happens is up to the model."},"resolution":null,"details":"**What happened.** `create` provisioned two members and sent each its readback dispatch. The orchestrator's answer was there within a minute. Its reply file was complete and was valid JSON. The readback inside it, which the model writes as a JSON object in the reply's note, had no closing brace. `create` reported `replied but readback is not valid JSON (unexpected end of JSON input)`, marked the campaign `create-failed` and stopped. Everything else in the readback was right: the member, the role, the branch, the goal and the obligations.\n\n**Why it matters.** The check is right to refuse the readback, because it is the one proof that a member read its briefing. What is costly is the response. Two machines were up, keys were lent, and the team was ready. All of that was ended by one character a model left out. The operator's only move is to destroy and create again, which takes minutes and spends the readback turns a second time. The same profile, created again at once, passed. So the failure was a slip and not a member that had misread its brief.\n\n**It is the kind of fault the protocol already has an answer for.** A reply that is not good enough gets rework: the dispatcher says what is wrong and the worker answers again. The readback is the one dispatch whose dispatcher is the host, and the host has no such move. It judges the reply once.\n\n**How to reproduce.** Whether it happens is up to the model. It can be forced with a member whose model is served from a recording in which the readback object is cut short.\n\n**What would help.** When a readback reply exists and does not parse, or parses with a field missing, send the member one rework message. The message should quote the parser's error and ask for the readback again. Fail as now if the second one is wrong too. One retry keeps the check as strict as it is, and it turns a formatting slip into thirty seconds of delay.","notes":[{"date":"2026-09-20","text":"Only a fault of form is asked for again: a reply that does not parse, or one with a required sentence left empty. A member that answers under another name, reports seeded files absent or names the wrong branch is failed at once, as before. The second asking is a new dispatch and not a continuation, because the first reply closed its dispatch. The audit already treats every dispatch opened before the mission as the host's own, so a member's second readback is not mistaken for the orchestrator's work. The first asking and its prompt are unchanged, so no recorded session is affected."},{"date":"2026-09-20","text":"A first version of this record's test read message times with `stat -c`, an option only GNU provides. On macOS that call fails, so a fake member emitted one malformed line, no earlier dispatch was seen, and rework landed under a wrong name. That fixture now falls back to `stat -f`. Both flavours are covered, because continuous integration runs Linux and macOS. Product code was never affected: a probe reads times inside its member, which is Linux."}],"links":["SAC-035"]},{"id":"SAC-045","title":"The recording script's own check reports success and exits non-zero","type":"defect","severity":"low","status":"closed","foundBy":"session agent, maintainer of this repository, wiring a new tier into the recording script","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["2514e63"],"integrated":[],"verified":"`./scripts/record-fixtures.sh --check` printed that every prerequisite was present and exited 1. After the fix the same command prints the same report and exits 0. The mechanism was reproduced in six lines of bash: a function whose last command is a false test, installed as an EXIT trap, turns `exit 0` into exit 1."},"resolution":null,"details":"**What happened.** The recording script offers a `--check` mode that reports whether this host holds everything a recording needs, records nothing and spends nothing. It printed a clean report, said that all was present, and exited 1.\n\n**Why.** The script removes its scratch credential tree from an EXIT trap. The cleanup function's last command is a test of whether a tree was ever made. In `--check` mode none is, so that test fails. The function therefore ends unsuccessfully, and an EXIT trap carries such a status out as the script's own. The report above it was accurate; only the status lied.\n\n**Why it matters.** The status is the half a caller reads. Every rule about gates here says to capture output to a log and test the status rather than read words. This is a gate whose status was wrong in its success case. A wrapper that asked `--check` before recording would conclude the host was not ready, and the report explaining that it was would scroll past unread.\n\n**How to reproduce.** Install as an EXIT trap a function whose last command is a false test, and exit zero.\n\n**What would help.** End the cleanup function with an explicit success. A trap that cleans up has no verdict to carry.","notes":[],"links":["SAC-044"]},{"id":"SAC-046","title":"An acceptance could match a dispatch from a node's earlier life","type":"defect","severity":"low","status":"open","foundBy":"session agent, maintainer of this repository, tracing how dispatch ids are minted while fixing stale sessions","opened":"2026-09-21","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"**What could happen.** A member given a fresh disk inside a live campaign mints its dispatch ids again from `d001`. The orchestrator's log still holds `accepted` entries for that node's earlier ids. A new reply under a reused id would then read as already accepted. The node would show `free` while its reply was never judged.\n\n**Why.** The next dispatch id is minted from the messages the node's input channel holds, so an empty disk starts the sequence over. The acceptance lookup matches a log entry by node name and dispatch id alone. Nothing in an entry says which life of the node it belongs to.\n\n**How likely.** It has not been seen. No campaign command replaces one member today, so it would take an operator rebuilding a machine by hand under the same name. Recreating a whole campaign is already safe. The stale-session fix in SAC-032 made `destroy` forget every session, and a new campaign starts a new log.\n\n**Why it matters.** The acceptance record is the one input to node state that does not come from the node. A wrong match frees a node silently, and the unjudged work is counted as done.\n\n**What would help.** Write the conformance scenario first: replace a node's disk after one accepted dispatch, and assert that its next reply reads `replied`. Then tie an acceptance to something a rebuilt node cannot repeat, such as the dispatch's opening time. Refusing to mint at or below the highest id the log holds for that node would also do.","notes":[],"links":["SAC-032"]},{"id":"SAC-047","title":"Destroy relays advice to remove a group that it then removes itself","type":"defect","severity":"low","status":"open","foundBy":"session agent, maintainer of this repository, following the advice after destroying two campaigns","opened":"2026-09-21","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"**What happened.** `cs-campaign destroy --force` printed a line saying the campaign's group held no sandbox, and that its network and gateway were still up. The line advised `cs-sandbox group rm` with the group's name. When the operator ran that command, the answer was `no such group`. This was seen twice in one day.\n\n**Why.** The line belongs to the sandbox tool. It prints it after destroying a group's last sandbox, and for a person who typed that command it is correct. Campaign's destroy streams the sandbox tool's output to the operator, then reclaims the group itself. By the time the operator reads the advice, the group is gone.\n\n**Why it matters.** The last thing a teardown says should be true. An operator who follows the advice gets an error and cannot tell whether the teardown finished. The honest line, that the group was reclaimed, is never printed.\n\n**How to reproduce.** Create any campaign and destroy it with `--force`. Read the line before the final one, then run the command it names.\n\n**What would help.** Campaign should say that it reclaimed the group, and should not pass on advice it is about to make false. Dropping that one relayed line is enough. The sandbox tool's message needs no change.","notes":[],"links":[]},{"id":"SAC-048","title":"cs-campaign needs the agent tools on the host PATH instead of carrying what it drives members with","type":"improvement","severity":"med","status":"open","foundBy":"user report (host): \"cs-campaign should be self contained instead of depending on the agent tools to be on the path, without the CLIs on top of that, which btw is a bit confusing since the agent tools normally require the CLIs to be useful\"","opened":"2026-09-21","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"**What happens.** `cs-campaign` runs `cs-\u003ccli>-remote` from the host's PATH. `create` uses it to send each member its readback and to open the mission. The host-side restart and `send --log` use it too. A host therefore needs `cs-sandbox install-agent-tools` before any campaign can start, and `cs-campaign doctor` fails without them.\n\n**Why it is confusing.** The same host needs none of the agent CLIs (`claude`, `codex`, `opencode`). The tools only drive agents that run inside the members, so nothing on the host runs a CLI. Everywhere else an agent tool is useless without its CLI: `cs-claude`, for one, launches `claude`. So the doctor marks the tools required and the CLIs optional, which is accurate and still reads as a contradiction.\n\n**Why it matters.** It is a second install step, and a second build to keep in step with `cs-sandbox`. A stale host copy also reaches the members, because `cs-\u003ccli>-remote` copies its own `cs-\u003ccli>-turn` into the member it drives. The tools also have host prerequisites of their own. The macOS failure filed as SAC-022, where the driver needed `flock` and `setsid`, came from this path.\n\n**Where it is.** The calls are in `internal/cli/sandbox.go` (`startTurn`, `killSession`, `forgetSession`, `sessionLog`). `internal/cli/hostdispatch.go` calls this the one host-to-agent exception. Section 3 of INSTALL.md documents the install step.\n\n**What would help.** cs-campaign could carry the host-side drivers itself, the way it carries `cs-campaign-member` for the guests, or run those steps inside the VMs. The host would then need only `cs-sandbox`, and the agent tools and CLIs would be optional there, as they are for `cs-sandbox`.","notes":[],"links":["SAC-022"]},{"id":"SAC-049","title":"The dispatch page cannot be deep-linked","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, reading the served page: \"can we add hashtags of some sort so that we can deep link to the member, trace, element etc?\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-22 deep links","evidence":{"commits":["75435ee"],"integrated":[],"verified":"The forms were driven in headless Chromium on the run14-1 site. Opened at `#m/checker/d003`, the inspector shows checker's open of d003 and the view is 1:47 to 2:07, the box zoomed to. At `#m/modeller` it shows modeller's open of d001 at the run view, and at `#e/12` the reply of surveyor-domain/d001. `#nonsense` selects nothing. From a clean load, Home writes `#m/orchestrator/d001`, ArrowRight writes `#m/checker/d001`, and Escape clears the address. Setting the hash to `#m/translator/d002` on the live page selects it and zooms to 2:11 to 3:20. The fixture suite passes 20 of 20 rows and 9 of 9 targets on the page."},"resolution":"The address names the selection. `#m/\u003cmember>` picks the member's first dispatch. `#m/\u003cmember>/\u003cdNNN>` picks that dispatch's opening and zooms to it. `#e/\u003cn>` names any event or step by the index this page gives it. The page reads it on load and on every change, and writes the most specific form back with `replaceState` as the selection moves, so no history entries pile up. The manual's Addresses paragraph says so.","details":"The page held its selection and its view in React state and nothing else. There was no way to hand someone a member, a dispatch or a step: every address opened the run view with nothing selected. The tracer's pages already answer to `#ev-\u003cn>`, and the inspector links into them that way, so the dispatch page was the one place a reader could not point at.\n\nWanted: a form for a member, one for a dispatch, and one for any event or step. The page should read it on load and whenever it changes, and write it back as the selection moves, so the address bar is always worth copying.","notes":[{"date":"2026-09-22","text":"The address also names the view: `@start-end` in elapsed h:mm:ss after the selection, or `@run`. It is written in place, a little after the last change, since a scroll reports a view every frame and a browser may refuse frequent address writes. A view the address already names, within two seconds, is left as written, so a pasted address is not rewritten. A dispatch with no view still means its box, so the page writes `@run` after a dispatch at the whole run."}],"links":[]},{"id":"SAC-050","title":"The wait row draws a wait call before it happened, and repeats the gap between boxes","type":"defect","severity":"high","status":"closed","foundBy":"repository owner, reading the served page at `#e/423@0:01:03-0:16:03`: \"in the orchestrator we seem to have a 'wait' continuing below the strip where there are bars on top that shows it active\", and of the members: \"if it's just calling out empty space, that's redundant\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-22 waiting on the steps row","evidence":{"commits":["3203648"],"integrated":[],"verified":"The run14-1 site was rendered from the tracer's head and opened in headless Chromium at `#e/423@0:01:03-0:16:03`. The page draws 48 hatched spans, the orchestrator's 48 wait calls, and none for any member. The selected wait call's span begins after the last column of the turn that issued it, near 0:06 on the axis, and ends near 0:10, where the next columns begin. Before the change the same span ran from 0:02 to 0:06, under that turn's columns. The inspector names it `wait call · Bash · #178`, 3m48s. The toggles are show orchestrator log, member traces and errors only. The fixture suite passes 20 of 20 rows and 9 of 9 targets, and `make check` is green."},"resolution":"Waiting is drawn on the steps row. A wait call is a hatched span at full height, from its stamp for as long as it took. It is pinned at its real time, and so is the step after it. The columns before it therefore sit before it, and the columns after it start where it returned. Idle is drawn only when the turn ended inside a box, and then as far as the box goes. The wait row, its toggle and the one-hour ceiling are gone. The legend says `waiting`, the tooltip says `wait call` or `idle between turns`, and the inspector's model queue reads `queued`. The manual's traces paragraph says how a column is placed and what a hatched span is.","details":"The page drew waiting in a row of its own under each member's steps, off by default. It held the orchestrator's wait calls and every idle interval after a turn, as hatched bands.\n\nTwo things were wrong with it.\n\n**A wait call's band was drawn backwards.** The page took every step's interval to end at its timestamp. That holds for a thinking or assistant step, since Claude Code stamps a block when it finishes. A tool call is stamped when it is issued, and the tracer'
