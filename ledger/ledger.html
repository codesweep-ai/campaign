  <body>
    <script id="ledger-data" type="application/json">{"project":"campaign","staleAfterDays":14,"records":[{"id":"SAC-001","title":"Initial implementation","type":"improvement","severity":"low","status":"open","foundBy":"the repository's first commit","opened":"2026-08-23","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Give a team of AI coding agents one mission, run them in Firecracker microVMs, and get back evidence of what they did.","notes":[],"links":[]},{"id":"SAC-002","title":"Every turn was told to run in a directory no member has","type":"defect","severity":"med","status":"closed","foundBy":"session agent, after a cs-sandbox fix stopped masking it","opened":"2026-08-23","resolved":"2026-08-23","stint":"2026-08-23 opencode turn driver","evidence":{"commits":["e9060b0"],"integrated":[],"verified":"go test ./cmd/cs-campaign-member/ -run TestStartTurnNamesNoWorkingDirectory -count=1: PASS, and FAIL with the argument restored. Then `make test-smoke` on cs-sandbox 44eb5b5: all five scenarios PASS in 485.66s, opencode-fireworks in 109.97s with 0 continuations and 0 restarts. The same tier against the previous argument failed, with every prompt on the member's session reporting FileSystem.realPath (/workspace)."},"resolution":"Neither side names a working directory now, so a turn runs where the remote tool lands, in the member's home, with the clone one level down. That is where every turn has run all along.","details":"cs-campaign passed `-d /workspace` to every agent turn, from `startTurn` on the host and from the member-side dispatcher. No member has that directory: `ls -ld /workspace` in a Firecracker sandbox reports ENOENT, and the string appears nowhere in cs-sandbox.\n\nIt did no visible harm because every adapter fell back. `tmux new-session -c` starts the session in its own working directory when the path does not exist, so claude and codex turns ran in $HOME while the argument said otherwise. The opencode driver bound its session to the directory it was given, and used to hide that behind `cd \"$dir\" 2>/dev/null || cd \"$HOME\"`.\n\nWhen cs-sandbox stopped hiding it, opencode honoured the path and failed every prompt on the session with `PlatformError: NotFound: FileSystem.realPath (/workspace)`. The campaign then ran its whole restart ladder against members that could not answer.\n\nThe comment on the constant also claimed the value came from the sandbox layer. It did not.","notes":[],"links":["SAC-003"]},{"id":"SAC-003","title":"A member whose agent never launched looks the same as a slow one","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, while diagnosing SAC-002","opened":"2026-08-23","resolved":"2026-08-23","stint":"2026-08-23 opencode turn driver","evidence":{"commits":["e9060b0"],"integrated":[],"verified":"go vet -tags smoke ./internal/cli/ passes with keepDriverLogs called from keepEvidence, and make check is clean. Not exercised by a stalled run: the tier has not stalled since, and provoking one would mean reintroducing SAC-002."},"resolution":"A run that keeps evidence now writes each member's host-side driver log beside the archive, as driver-\u003cmember>.log. The log already existed and named the cause on its first line; nothing collected it.","details":"A turn is dispatched with `-b`, so the remote tool returns as soon as it has forked and its exit code is never read. A driver that failed to launch and a turn that is merely slow both reach the host as a node that has gone quiet.\n\nThe reason exists, on the host, in the log the remote tool keeps at ~/.cs-\u003ccli>-remote-logs/\u003csession>.log, and nothing collected it. The live tiers archive the campaign when a run stalls, and that archive holds what the MEMBER produced, which for this failure is nothing.\n\nMeasured while diagnosing SAC-002: the campaign reported four members stopped and gave up after its ladder, while the driver log named the cause on its first line. Finding it took knowing it was there.\n\nThe protocol's rule that an agent log is never a state input still stands. This is about the evidence a failing run leaves behind, not about how a node's state is decided.","notes":[{"date":"2026-08-23","text":"CI now uploads .tmp/live-evidence/ when the smoke job fails, which is what carries these logs off the runner; before that the job deleted them. The source the collector reads was confirmed non-empty on a real session: cs-opencode-remote-output \u003csession> --full returned 4021 bytes. The write itself is still not exercised by a stalled run."}],"links":["SAC-002"]},{"id":"SAC-004","title":"wait returns immediately whenever any teammate is free, so a phased campaign cannot block","type":"defect","severity":"high","status":"closed","foundBy":"user report (host), from a cs-campaign issue review compiled off the open-source-ui-b campaign runs","opened":"2026-08-25","resolved":"2026-08-25","stint":"2026-08-25 wait judgment-set session","evidence":{"commits":["a5323ab"],"integrated":[],"verified":"go test ./cmd/cs-campaign-member/ -run TestWait -count=1: 13 PASS, including TestWaitDoesNotReturnForAFreeNode. Proved by mutation, each reverted in turn against the suite. Restoring node-free to the judgment set fails 3 tests. Removing the chunk override wiring hangs the suite to its timeout. Dropping the free-node clause from the elapsed line fails 2 tests. Before the fix, wait --for 600 against one working member and one idle member returned in 132 microseconds; after it, the same fleet blocks the chunk out. Both `make check` and `make test-smoke` pass, the latter in 339.56s across all five scenarios. It replayed 234 requests with 0 misses and 0 rejections, so no cassette needed re-recording."},"resolution":"wait returns on world events alone, which are node-replied and node-stuck. The node-free state is reported on the elapsed line instead of ending the block. A phased fleet therefore blocks as intended, and a free seat stays as visible as it was. SPEC.md R125 states the rule, which the specification had left open, and R126 requires the chunk bound that the change makes load-bearing.","details":"The orchestrator's blocking `wait` counted `node-free` as a judgment, alongside `node-replied` and `node-stuck`. It therefore returned on its first snapshot whenever any teammate had no open dispatch, before sleeping once.\n\nA phased campaign always has such teammates by design. One seat works while the others sit idle on purpose. Nothing on a node ever clears `node-free`, and the orchestrator has no instrument that records the decision to leave a seat free. So every `wait` call returned immediately for the rest of the campaign.\n\nMeasured on this branch before the fix. A fleet of one working member and one deliberately idle member, with `wait --for 600`, returned in 132 microseconds.\n\nThe cost is not the wasted call. A model that meets an instantly returning blocking primitive reasons that looping on it spends a turn per poll. In the run that found this, the orchestrator backgrounded a poll loop and ended its turn instead. Nothing can re-invoke a model from a background process, so the host observed a stopped orchestrator four minutes after create.\n\nThe rule underneath it: `node-free` is not a world event. Its only arrows in are `accept` and campaign start, per PROTOCOL.md section 5, and both are the orchestrator's own doing. Returning for it woke the model to report what the model itself had just done.\n\nSPEC.md was silent on what ends a block, which is why the three-state set could sit unchallenged. That silence is part of the defect.","notes":[{"date":"2026-09-06","text":"The closing commit cited 0f53ee4, which this repository does not carry. The fix is a5323ab, which adds TestWaitDoesNotReturnForAFreeNode and SPEC R125. Corrected so the gate can resolve it."}],"links":[]},{"id":"SAC-005","title":"Every member carried a copy of the operator's model credential","type":"improvement","severity":"med","status":"closed","foundBy":"user report (host): \"change from using shared credentials to lent credentials for agents\"","opened":"2026-09-05","resolved":"2026-09-23","stint":"2026-09-05 credential lending session","evidence":{"commits":["def1e50","8af3a1c"],"integrated":[],"verified":"go test ./internal/cli/ passes TestTheSpellingChoosesTheFlagAndSilenceLends, TestAnEnvironmentKeyCannotBeLent, TestCopiedCredentialsAreNamedBeforeCreate and TestTheDocumentedCredentialDefaultIsWhatAProfileGets. ci run 35943266251 at cdbbf93 passed its smoke jobs on firecracker, podman and macOS."},"resolution":"A plain agentLogin or apiKey grant now lends by default, so a member holds a token that is worthless off the host. Copying the credential in takes an explicit inherit spelling or --credentials inherit, and validate refuses an environment key under lend.","details":"A profile's `auth.inheritAgentLogin` was the only way to give a member the operator's agent login, and it copied the credential in. `create` passed `--inherit-agent-login \u003cfamily>` to cs-sandbox, so `~/.cs-claude/.credentials.json` or `~/.cs-codex/auth.json` landed inside a microVM running an agent with no approval prompt. `auth.apiKeyFromEnv` did the same for a key, through `--env`.\n\nReproduce it on any campaign whose profile names a login. Create it, then read the file inside a member with `cs-sandbox exec \u003cmember> cat .cs-claude/.credentials.json`.\n\nIt matters because the value outlives the campaign wherever the agent copied it, cannot be withdrawn without rotating it, and is readable by everything the member runs. cs-sandbox has since grown credential lending, which hands a sandbox a token worth nothing off the host and leaves the credential where it is.","notes":[{"date":"2026-09-05","text":"The profile now names a grant, and the spelling says how it arrives. `agentLogin` and `apiKey` take the campaign's verb, which is `defaults.credentials` and defaults to lend. `lendAgentLogin`, `inheritAgentLogin`, `lendApiKey` and `inheritApiKey` are cs-sandbox's own flag names and state the verb for one member. `--credentials lend|inherit` sets the campaign's verb for a single run. A member speaks one verb, and validate refuses a member that spells two."},{"date":"2026-09-05","text":"Verified short of the resolving commit, which does not exist yet. `go test ./... -count=1`: every package passes. `make check`: clean, prose and drift gates included. `make test-smoke`: all five scenarios pass, 224 requests replayed, 0 misses, 0 upstream calls. The two recorded scenarios keep `inheritAgentLogin` and still copy a login in, so the lent path has unit coverage but no recorded coverage."},{"date":"2026-09-05","text":"The recorded tiers move onto the default they now describe. Five of the six backend scenarios spell no verb and so are lent, and a sixth spells inheritAgentLogin so the copied path stays recorded rather than only unit-tested. A loan moves the client. The member holds a token, and the lender on this host dials cs-vcr, so a lent scenario's recorder is published on loopback rather than joining the campaign network. The committed cassettes were recorded on the copied chain and no longer replay, so the smoke tier is not evidence again until the fixtures are re-recorded."},{"date":"2026-09-10","text":"`apiKeyFromEnv` was an inherit-flavoured grant wearing a neutral name. A seat could pair it with `credentials: lend`, be accepted, and come up holding the raw key while its record claimed a loan. `validate` refuses that pairing now, `inheritApiKeyFromEnv` spells the copy where a key cannot live on this host, and the seats that hold a credential are named before provisioning. Verified short of the resolving commit: `go test ./... -count=1` and `make check` both clean, with this repository's own fixtures moved onto lent or explicitly copied grants."}],"links":[]},{"id":"SAC-006","title":"Role briefs are authored blind to the orientation, so they invent the protocol","type":"defect","severity":"high","status":"closed","foundBy":"user report (host): \"the role briefs include some made up info about this and cause campaigns to fail\"","opened":"2026-09-06","resolved":"2026-09-06","stint":"2026-09-06 orientation visibility session","evidence":{"commits":["530fcb1"],"integrated":[],"verified":"go test ./internal/cli/ -count=1 passes, including five new tests. TestOrientationPrintsTheTextTheMemberWillReceive compares the command's output byte for byte against what buildOrientation renders on the create path, so the command cannot drift into describing the orientation instead of printing it. TestUnbriefedFleetIsStillRefusedByValidate holds R29: creation still refuses a fleet whose briefs are unwritten, while inspection tolerates it. TestManualNamesTheOrientationFileTheProductWrites holds MANUAL.md against guestOrientationFile. make ci exit 0 on this branch, all six smoke scenarios passing."},"resolution":"`cs-campaign orientation` prints the text each member will be given, rendered through the same buildOrientation the create path uses. It answers for a member whose brief is unwritten, which is the ordinary case, because reading it is what an author does before writing one. Four places now send the author to it: init's closing output, the stub comments, MANUAL's authoring section, and the command's own note on standard error. The stubs and the example campaign no longer restate the orientation, so what an operator copies models the split R35 requires.","details":"A campaign's role briefs are written by someone who cannot read the orientation, the standing context every member is given. The two are halves of one contract. SPEC.md R34 and R35 split them. The orientation states what is true of every campaign. The operator's brief states what is specific to this one, and the two must not restate each other.\n\nNothing shows the brief author the orientation. The string `ORIENTATION.md` appears in no shipped document. MANUAL.md's Files table lists `member.json`, `manifest.json` and both channels, and omits it. SPEC.md names the orientation three times, in a glossary row, a `member.json` field and a package map, and never says what it contains. No command renders it. Reading it means holding this Go source, or running `ssh` into a member after `create`, which is after the briefs are written and the microVMs are billing.\n\nAn author who cannot read one half of a contract guesses at the other. Those guesses land in the brief as fact, and the member then holds two instruction sources in one directory with no rule for which one wins. The code allows four such contradictions. A brief can tell an agent to ask the orchestrator a question, which the orientation says is impossible. It can point a teammate at `mission.md`, which `seedCommand` gives to the orchestrator alone. It can name a `cs-campaign-member` verb the member's role refuses. It can invent a fifth `--outcome` value.\n\nThe shipped examples teach the pattern rather than the split. `testdata/example-campaign/roles/worker.md` is three sentences, and all three restate the orientation. `internal/cli/assets/stub-agent.md`, which `init` writes into every scaffolded campaign, pre-fills the bullet \"Your change is committed on your own branch\" and comments that the line is not optional. Those two files are what an operator copies, so the default authoring path leads into the defect.\n\nNothing catches the contradiction before the spend. `loadCampaignInputs` hashes the brief's bytes and never reads them. `validate` prints a digest and a count. The readback is structural by design, per R50, so a member restates a wrong brief faithfully and `create` reports that it read its briefing. The campaign fails later, on live machines, doing something its brief made impossible.\n\nTo see the gap: `grep -rl ORIENTATION.md *.md` in this repository returns nothing, and `cs-campaign init acme --orchestrator codex --agent backend=claude` emits briefs that never mention the file.","notes":[],"links":[]},{"id":"SAC-007","title":"create aborts a campaign when a member's first command outruns its guest sshd","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while running make test-smoke on an unrelated change","opened":"2026-09-06","resolved":"2026-09-06","stint":"2026-09-06 orientation visibility session","evidence":{"commits":["40e633b"],"integrated":[],"verified":"go test ./internal/cli/ -run TestReadyWait -count=1: 3 PASS. Proved by mutation: taking the first refusal as the answer, which is the old behaviour, fails two of the three. Before the fix the same tree produced 2 clean smoke runs in 6. After it, four consecutive runs passed 20 of 20 scenarios, and make ci then passed all six. The line `waiting for \u003cref> to accept commands` appeared in five separate runs, so the race occurred and was absorbed rather than avoided. One scenario boot took 359 seconds against a usual 55 and still passed."},"resolution":"Creation waits for a member to accept a trivial command before configuring it, bounded at two minutes and cancellable. The wait is a readiness probe, not a retry of the caller's command. Retrying prepareAuth or applyModelConfig would re-run real work whose failure means something else entirely. SPEC.md R127 states the rule, which the specification had left open.","details":"`cs-campaign create` aborts a whole campaign when a member's first command reaches its guest before that guest's sshd accepts connections.\n\n`cs-sandbox create` returns once the machine exists and its port forward is up. It does not wait for sshd. `provisionMember` then execs into the guest immediately, and `memberRun` in `internal/cli/sandbox.go` is a bare shell-out with no readiness check and no retry. One refused connection ends the create, after every machine in the fleet has been provisioned.\n\nWhich step reports the failure depends on the member's CLI and its auth mode, so the error message moves around. `prepareAuth` returns without any exec for the claude CLI, and for a member authenticating from an inherited login. Those members fail later, in `applyModelConfig`. A member holding an API key execs during `prepareAuth` and fails there instead. Both are the same race.\n\nThe orchestrator wins this race every time. It boots against an idle host, while the second member boots beside a machine that is already running and taking host CPU and disk. Every failure observed was on the second member.\n\nThese numbers come from `make test-smoke`, which provisions two real machines per scenario. Scenario failures appeared in six of thirteen runs across two commits. Each was preceded by `Connection closed by 127.0.0.1 port \u003cgateway>` and reported as `cs-sandbox exec ...: exit status 255`. One scenario won the race slowly instead of losing it, taking 356 seconds against a usual 59.\n\nThe cost is not the retry nobody wrote. A create that fails this way reads as a broken fleet or a bad profile, and the machines are already paid for when it happens.","notes":[],"links":[]},{"id":"SAC-008","title":"A red smoke tier is not yet evidence, because the tier inherits the create race","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, after chasing a smoke failure to host timing rather than to the change under test","opened":"2026-09-06","resolved":"2026-09-21","stint":null,"evidence":{"commits":["3ac5613"],"integrated":[],"verified":"On `3ac5613`, which pins the sandbox carrying the last fix below, every smoke leg that ran was green on its first attempt, 112 of 112. That was one run on push and four fresh runs dispatched one after another. Each of the first three passed all 24 legs across the microVM, container and macOS matrices. The fourth passed its 16 non-macOS legs, and its 8 macOS legs never started because the self-hosted runners went offline, so none of them failed. Across every run of the day on main, 153 of 154 legs were green on the first attempt. The one red leg was not noise: its evidence showed a turn driver giving up after ten seconds on a slow runner, which was fixed as SBX-063."},"resolution":null,"details":"`make ci` fails intermittently for reasons unrelated to the change being tested. Its smoke tier boots real machines, so it inherits the race recorded in SAC-007.\n\nThe tier is the last gate `make ci` runs. A red result therefore arrives after every cheap check has passed, and the natural reading is that the change broke something. It usually has not.\n\nReproducing the failure is the trap. The race is decided by how fast a guest boots, which depends on host load and on the storage the working tree sits on. Comparing two commits across that difference measures the storage rather than the commits.\n\nThese numbers come from diagnosing SAC-007. Four of six runs on an ext4 tree failed at least one scenario. Three consecutive runs on a tmpfs tree failed none, and a later run on a second tmpfs tree failed two. Storage therefore shifts the odds without deciding the outcome, which is what makes a two-commit comparison so easy to misread.\n\nFixing SAC-007 removes most of this. What remains is worth a sentence in CONTRIBUTING. A red smoke tier is first a reason to run the tier again on the same tree. Suspecting the diff comes after that.","notes":[{"date":"2026-09-06","text":"One session produced three separate environmental causes for a red tier, each hiding the next. An unrelated server held the recorder's port. A rootless network namespace 24 days old had stopped mapping the host, so no guest could reach the lender. A recorder orphaned by a killed run squatted the port an hour later. None was a defect in the code under test. SAC-007 and SAC-009 remove two of them, and the third argues the case here."},{"date":"2026-09-20","text":"A fourth cause, and this one is inside the tier. The tier shortens the wait chunk to 4 seconds through `CS_CAMPAIGN_WAIT_SECONDS`. A recorded orchestrator calls `wait` only as often as it did when it was recorded. In one run a member answered more slowly than it had when recorded. The orchestrator's waits then elapsed where the recorded ones had returned a judgment. It went on to read and accept replies that had not arrived, and 50 of its commands failed. The proxy counted no miss, because every request matched. The driver reported the orchestrator as stalled after 404 seconds, where a good run of that scenario takes 58. The tier passed when run again on the same tree. SAC-038 describes the same mechanism from the other side, where a replay of real work needs a longer chunk. The tier could fail fast here and name the cause. The proxy log already shows a live `wait chunk elapsed` against a recorded `wait returned`."},{"date":"2026-09-21","text":"Closed, and its advice is withdrawn along with it. Every cause this record names has been removed: the create race by SAC-007, and the squatted recorder port by SAC-009 together with isolated groups that publish no port. The recorded wait chunk was fixed by SAC-038, and the turn that died on a slow machine by SBX-063. The advice was to run a red tier again before suspecting the change. The day this closed, that advice would have hidden a real defect. A red leg that passed on its second attempt was a driver that waits too little, three ladder rungs from where it surfaced. A red smoke leg is evidence to read before it is noise to retry. The evidence artifact the tier keeps is where to read it."}],"links":["SAC-007"]},{"id":"SAC-009","title":"A foreign listener on the recorder's port reads as a healthy recorder","type":"defect","severity":"med","status":"closed","foundBy":"session agent, after make ci failed on a branch and the same failure reproduced on a pristine origin/main","opened":"2026-09-06","resolved":"2026-09-06","stint":"2026-09-06 orientation visibility session","evidence":{"commits":["78797ef"],"integrated":[],"verified":"go test ./internal/cli/ -run TestRecorderPort -count=1: 2 PASS. Proved by mutation: dialling instead of binding, which is the behaviour this replaces, fails the suite. The check then proved itself in the field. A cs-vcr orphaned by a killed run held the port 55 minutes later, and the tier refused in 0.68 seconds naming the port and how to find the holder. The same condition had previously cost 931 seconds and a diagnosis that accused the members."},"resolution":"The tier refuses to start when another process holds the recorder's port, by binding it rather than dialling it. A dial accepts whatever answers, which is how a foreign listener read as a healthy recorder. The check runs before any machine is booted, and the port itself does not move, because every committed cassette derives its names from it.","details":"The replay tier proceeds against any process listening on the recorder's port, then blames the members when nothing works.\n\n`startVCR` launches `cs-vcr` on `0.0.0.0:8080`, and `waitForVCR` waits for it by dialling `127.0.0.1:8080`. That dial succeeds as soon as anything answers. An unrelated server on the same port therefore reads as a healthy recorder. cs-vcr has already failed to bind, and its error reaches only the proxy log under `.tmp/live-proxy/`.\n\nEvery member then sends its model calls to the stranger. Nothing usable comes back, so no turn ever starts. `cs-claude-turn` reports a stalled turn with the interface idle, three times, then restarts the session. Each scenario burns the fifteen minute readback bound. The tier finally reports that the members did not reply.\n\nMeasured on a host running an unrelated development server on port 8080. One scenario took 931 seconds to fail and named the members. The proxy log held the whole answer in one line: `listen tcp 0.0.0.0:8080: bind: address already in use`.\n\nThe port cannot move. It travels in the profile, the campaign ID is the sha256 of that profile, and every name in every committed cassette derives from it. The collision has to be reported rather than avoided.\n\nThe recorder moved onto the host in 110ea18, which is what made a collision possible. It previously ran in a container on the campaign's own fabric, where the port was private to the group.","notes":[{"date":"2026-09-06","text":"A killed run is one way the port gets held. startVCR registers its stop through `t.Cleanup`. That does not run when the test process is killed rather than failed, so the recorder outlives it and squats the port. Observed 55 minutes after the run that started it. Reaping such an orphan by pid would go further than this check does."}],"links":[]},{"id":"SAC-010","title":"A member is never told about the snapshots it was given","type":"defect","severity":"low","status":"closed","foundBy":"user report (host), relaying a reviewing agent: the orientation names a member's repositories but not its snapshots","opened":"2026-09-06","resolved":"2026-09-06","stint":"2026-09-06 orientation visibility session","evidence":{"commits":["5531fd1"],"integrated":[],"verified":"go test ./internal/cli/ -run TestOrientationNamesSnapshotsBesideRepos -count=1: PASS. Proved by mutation: dropping the two lines that state a snapshot fails it on three counts, the two names absent from the prose and the empty list in member.json. Rendered against a real profile with `cs-campaign orientation`, which prints the snapshot under the same heading as the clone. make check exit 0."},"resolution":"A member is told about its frozen trees where it is told about its clones. The orientation names each one at its guest path and says it is frozen, so it is not mistaken for somewhere to work, and member.json carries the same names. Both come from one pass over the profile, the way the repositories already did, so the prose and the machine-readable copy cannot disagree. SPEC.md 5.3 now lists snapshots among what the member document carries.","details":"A member is told about its repositories and never about its snapshots, though both are directories placed in its home.\n\n`--repo` and `--snapshot` are siblings in cs-sandbox. Each shares a directory into the guest at `~/\u003cname>`, and cs-campaign derives that name the same way for both. A repository arrives as a writable clone on the member's own branch. A snapshot arrives as a frozen read-only copy.\n\nThe orientation lists the repositories under \"What you have\" and stops. `member.json` carries the repositories with their base commits, and carries no snapshots at all. A member holding a reference tree therefore has no way to learn that it exists, short of listing its home directory.\n\nThe orchestrator is told. Its `manifest.json` gives every agent's roster row that agent's snapshots. The product treats a snapshot as worth knowing for the seat that allocates work, and not for the seat that holds it.\n\nR13 names frozen snapshots among what each member can see. R31 says a member's knowledge must be exactly its trees, its seeded input and its dispatches, and that the enumeration is what makes the question answerable. A snapshot is a tree the member was given, and nothing enumerates it to the member.\n\nThe cost is quiet. An operator who shares a reference tree and expects it to be read must name it in the brief. Naming a path the product could have stated is the guesswork SAC-006 removed everywhere else.","notes":[],"links":["SAC-006"]},{"id":"SAC-011","title":"A snapshot that never arrived is reported by nothing","type":"defect","severity":"med","status":"closed","foundBy":"user report (host), asking whether snapshots are checked the way repositories and inputs are","opened":"2026-09-06","resolved":"2026-09-06","stint":"2026-09-06 orientation visibility session","evidence":{"commits":["a6a4cc8"],"integrated":[],"verified":"go test ./internal/cli/ -run TestSnapshotPathMustExist -count=1 and go test ./cmd/cs-campaign-member/ -run TestCheckInputs -count=1: 4 PASS across the two halves. Proved by mutation: making neither side look for a snapshot fails all three new tests. End to end, the profile that validated with exit 0 before the fix now exits 1 and names the agent and the path. make check exit 0."},"resolution":"Both ends now look for a frozen tree. The host refuses a path that is absent or is not a directory, at validate and at plan, where it costs nothing. The member stats each snapshot its document lists, so the readback carries a tree that never arrived and creation fails by name. Repositories stay out of the guest walk on purpose: the readback already compares the branch a member believes it is on against the recorded one.","details":"A snapshot is never checked. A path that does not exist passes `validate`, reaches `create`, and the member is told it has a tree that is not there.\n\nThese numbers come from this branch. A profile naming `/nonexistent/definitely-not-here` as a snapshot validates with exit 0, and `plan` carries the path through unchanged. Nothing on the host resolves it, and nothing in the guest looks for it afterwards.\n\nThe other two kinds of input are checked. A missing brief is refused by name before anything is allocated. `check-inputs` then stats every seeded file inside the member, so the readback reports one that never arrived and creation fails. A repository is resolved on the host and recorded with its base commit, and the readback compares the branch the member believes it is on.\n\n`cmdCheckInputs` walks `member.Inputs` and nothing else. Snapshots are absent from that walk, so the one instrument a member has for auditing what it was given cannot see half of its trees.\n\nThe fix for SAC-010 sharpened this gap. The orientation now names each snapshot and `member.json` lists them, so the product makes a promise about a directory that nothing verifies. R36 warns about exactly this shape: two delivery paths for one job, and the one lacking the existence check is the one whose failure nobody sees. R49 requires the member to check its own environment against the manifest it was given.","notes":[],"links":["SAC-010"]},{"id":"SAC-012","title":"The manual ends with links its reader cannot follow","type":"defect","severity":"low","status":"closed","foundBy":"user report (host): \"the manual needs to be self contained\", on reading the See also section of cs-campaign manual","opened":"2026-09-06","resolved":"2026-09-06","stint":"2026-09-06 orientation visibility session","evidence":{"commits":["e3a4f69"],"integrated":[],"verified":"A grep for a relative markdown link in MANUAL.md returns 0 matches, against 8 before. The gate passes: make check exit 0, which includes the refs linter. The SPEC.md 5.1 citation still resolves as plain text, because that rule reads the citation rather than the link. cs-campaign manual now ends on the examples."},"resolution":"The See also section is gone, and the three inline links are plain names. A document named in prose still tells a reader which one to look for, and it renders as a name rather than as a bracketed path that goes nowhere. Routing stays with AGENTS.md, which exists for it.","details":"The manual ends with five links a reader holding only the binary cannot follow.\n\n`cs-campaign manual` prints MANUAL.md verbatim, and its \"See also\" section is a list of relative markdown links: README.md, INSTALL.md, PROTOCOL.md, SPEC.md and CONTRIBUTING.md. None of those files is beside the binary. The section renders in a terminal as bracketed paths that go nowhere.\n\nThe comment on manualCmd says the manual travels with the executable so that a host with only the binary is not left guessing. A closing list of unreachable documents is the one part of it that does leave the reader guessing.\n\nThree more links sit inline, at the description and at the profile schema. Those name a document as an authority or cite a section of it, so the name is the useful part and the link is decoration.\n\nThe links are also wrong in the published site, where the documents are pages rather than markdown files. They resolve only in a clone, which is the one place a reader does not need them.\n\nRouting is another document's job. AGENTS.md exists to point at the rest and holds no knowledge of its own, and MANUAL.md is the full surface for someone using the tools.","notes":[],"links":[]},{"id":"SAC-013","title":"No document tells an operator how to set a campaign up well","type":"improvement","severity":"med","status":"closed","foundBy":"user report (host): \"we haven't really told the user of cs-campaign about best practices for how to setup campaigns\"","opened":"2026-09-06","resolved":"2026-09-09","stint":"2026-09-07 playbook session","evidence":{"commits":["12ef20f"],"integrated":[],"verified":"go test ./internal/cli/ -run TestPlaybook -count=1: PASS, with four tests holding the document. The embed arrived and the verb prints it byte for byte. The manual keeps every imperative and the playbook keeps the reasoning behind each. Every heading a brief or a mission carries is named in the playbook. No embedded document links a file it ships without. End to end, `cs-campaign playbook` prints 614 lines from inside the binary. make check exit 0.\n\nRead by the user, who accepted it. Also exercised by seven fresh-agent runs across two models, each given only the binary and asked to set a campaign up. Every one found the document, and what it says held: repositories declared for every member, no invented outcome values, and no countable gate in any brief."},"resolution":"`cs-campaign playbook` prints PLAYBOOK.md from inside the binary, the way `manual` prints the manual, so an operator with the binary and no clone can read it. It covers the lifecycle. Deciding whether the work suits a campaign, designing the team, writing the mission and the briefs, what to check before spending, reading a run, and harvesting one.\n\nThe manual keeps every rule it stated and gains pointers. The reasoning moved here, which is what the record asked for: MANUAL's Notes for agents carried several rules with the argument compressed out of them.\n\nIt is also the system of record for what an author writes. Nothing scaffolds a mission or a brief any more, and this document says what belongs in each. The guidance is anchored on the three questions the readback asks rather than on headings nothing parses.","details":"Nothing tells an operator how to set a campaign up well.\n\nThe documents each have a job, and none of them is judgement. README is the tour. INSTALL is setup. MANUAL is every command, flag, file, variable, exit code and diagnostic. PROTOCOL states the protocol, SPEC states what the behaviour must be, and AGENTS routes while holding no knowledge of its own.\n\nMANUAL comes closest, with a five step shape and an authoring section, and both are mechanics: where the files go, what the orientation already says. Neither answers how to scope a mission, how many members to give it, how to phase the work, or what a good brief contains.\n\nSAC-006 is the evidence. Role briefs were failing campaigns because their authors could not see the orientation, and the fix made that text readable. What still has no home is the other half: what to write once you can see it.\n\nA command would carry it the way `manual` carries the manual, so an operator with the binary and no clone can read it. The name `authoring` is free, and AUTHORING.md does not exist.\n\nThis is an editorial decision about a document set whose jobs were assigned deliberately, so the shape belongs to the maintainer rather than to whoever files this.","notes":[{"date":"2026-09-06","text":"The scope may be wider than authoring. Running a campaign asks for judgement too. When to leave a stalled orchestrator alone, what to read in observe's two panes, and when a finding is worth more than a fix. MANUAL's Notes for agents carries several of those as bare rules with no reasoning attached. A document covering both halves would have a name like RUNNING.md rather than AUTHORING.md, and the command would follow it. The name is worth settling before the outline."},{"date":"2026-09-07","text":"The document and its command are landed in 12ef20f. `cs-campaign playbook` prints PLAYBOOK.md from inside the binary, the way `manual` prints MANUAL.md. The scope is the whole lifecycle, settled with the user: designing a team, writing the mission and the briefs, running and monitoring, harvesting and closing out. The name PLAYBOOK was chosen over RUNNING because AGENTS.md and CONTRIBUTING.md already use running a campaign for driving the harness at all. MANUAL keeps every imperative and gains a pointer, and the reasoning moved across. The text is a first draft read out of SPEC and MANUAL, and it awaits the user's review and the learnings from earlier campaigns."},{"date":"2026-09-09","text":"Closed on the user's read. The campaign learnings a second session was gathering are not in it yet, and they are an addition to a document that stands rather than a condition of closing this. Ten commits shaped it, and most of the later ones came from watching fresh agents use it."}],"links":["SAC-006"]},{"id":"SAC-014","title":"init never mentions the snapshots a member can be given","type":"defect","severity":"low","status":"closed","foundBy":"user report (host), asking whether init allows for snapshots too, or whether it is an oversight","opened":"2026-09-06","resolved":"2026-09-07","stint":"2026-09-07 shorthand surface session","evidence":{"commits":["eefd7cd"],"integrated":[],"verified":"go test ./internal/cli/ -run TestShorthandOffersBothSharedTrees -count=1: PASS. Proved by mutation: dropping the flag registration and the line that shares a snapshot fails it on seven counts, one for the missing flag and one per seat. End to end, three checks. Every scaffolded member carries the snapshot. A missing path is refused by name at plan, exit 1. A profile beside the flag is refused as a fleet flag. make check exit 0."},"resolution":"The shorthand offers `--snapshot PATH` beside `--repo PATH` on init, plan and create, so `--help` shows both halves of what a member can be given. Both stay singular and fleet-wide: one path each, handed to every seat. Anything richer belongs in a profile, where repos and snapshots already take lists carrying refs and names. MANUAL states the flag in both synopses and in the options table.","details":"`cs-campaign init` never mentions snapshots, so an operator meets them only by reading the schema.\n\nThe scaffolded profile carries a repository and says where credentials go. It says nothing about the frozen trees a member can be given, and `init` has no flag for one. An operator who would benefit from a reference tree has no reason to learn that the feature exists.\n\nThis is the shape SAC-006 described. A campaign is set up out of what the scaffolding shows, and what the scaffolding omits is invented or forgotten.\n\nA flag may be the wrong answer, because a snapshot is optional and `init` is deliberately minimal. A line in the generated profile, beside the one that says where credentials go, would cost nothing and name the feature where an author is already reading.","notes":[{"date":"2026-09-06","text":"The premise above is wrong. MANUAL's Configuration section documents snapshots where an operator writes a profile, with a worked example in the profile block and a sentence saying what one is for. SPEC's profile schema table carries the same. The feature is discoverable to anyone reading how to write a profile, which is when it is needed."},{"date":"2026-09-06","text":"Reopened. The note above answered the wrong question. Whether the manual documents a snapshot is not the same as whether the command surface offers one. The surface is the asymmetric part. --repo appears on init, plan and create, and --snapshot appears on none of them, while cs-sandbox offers the two side by side. AGENTS.md tells an agent to prefer --help over any command line quoted in a document, so a capability absent there is invisible to the reader this product is built for. This is the same omission as SAC-010 and SAC-011, in a fourth place."},{"date":"2026-09-06","text":"The arity differs too. cs-sandbox takes --repo and --snapshot as repeatable arrays, and cs-campaign takes a single --repo, documented as one repository cloned into every member. Matching the layer below therefore means making both repeatable, not only adding the missing one. The narrower alternative keeps the shorthand minimal, on the grounds that it serves the profile-less path and anything real declares a profile, where lists of both already work. The choice is a public surface decision."},{"date":"2026-09-07","text":"The arity is settled at singular. The layer below spells --repo as PATH[@REF][:NAME] and --snapshot as PATH[:NAME], both repeatable and both per-machine. This shorthand is fleet-wide and bare, so matching cs-sandbox would mean adopting its micro-syntax as well as its arity. The two flags now match each other, which is the symmetry an operator reads."}],"links":["SAC-010"]},{"id":"SAC-015","title":"A member with two transcripts failed its readback on a model it had named","type":"defect","severity":"high","status":"closed","foundBy":"session agent, from the evidence a failed CI leg uploaded, 2026-09-09","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 CI bringup","evidence":{"commits":["9860d2f"],"integrated":[],"verified":"The reader was run against the transcripts the failing leg uploaded, with the newer file's model line removed to restore the moment of the check. Reading the newest file alone returns nothing; reading every file returns the model. TestTurnConfigReadsEveryTranscript fails against the old shape and passes against the new one."},"resolution":"observedTurnConfig reads every transcript the member holds rather than the most recent. The shell it runs moved into turnConfigCommand so the invariant has a test of its own, and that test refuses the `head -1` shape outright.","details":"A readback confirms that a member answered on the model it declared, by reading the transcript its CLI wrote. It read one file: the newest, chosen with `ls -t | head -1`.\n\nA member can hold more than one session file. On the CI leg that failed, dev had two, written three seconds apart. The check read the newer one, which had not named a model yet, and reported that the member named none at all. The turn being confirmed sat complete in the older file, with the model in it.\n\nThe failure is confident and wrong, which is what makes it expensive. It reads as a member answering on the wrong model, so it fails create outright and says do not dispatch. The campaign was correctly configured.\n\nIt hid because the orchestrator holds one transcript and dev sometimes holds two, and because a faster machine writes the second file before the check rather than during it. The scenario passes locally and failed in CI on the same commit.\n\nBoth of that member's files named claude-sonnet-5 by the time the evidence was collected, which is why the artifact alone looks healthy. The reader had to be run against them to see it.","notes":[],"links":[]},{"id":"SAC-016","title":"The surface linter never reads PLAYBOOK.md, so its commands go unchecked","type":"defect","severity":"med","status":"closed","foundBy":"session agent, after SAC-020 raised the question of which documents the surface linter reads","opened":"2026-09-07","resolved":"2026-09-07","stint":"2026-09-07 playbook session","evidence":{"commits":["9920407"],"integrated":[],"verified":"Proved by mutation: a fenced `cs-campaign frobnicate acme` block appended to PLAYBOOK.md is now SURF-101 at PLAYBOOK.md:317, and it was 0 errors before this change. The real document passes all three: surface 0, refs 0, oss 0 errors. make check exit 0."},"resolution":"PLAYBOOK.md is named in both `extraDocs` lists in `.cs-lint.yaml`, so the surface and refs linters read it beside PROTOCOL.md and the oss linter counts it in the document set. Every command line and sample in the playbook is now held against the binary.","details":"`cs-lint surface` does not read PLAYBOOK.md, so every command line and sample output in it is unchecked.\n\nThe linters read a fixed document set plus `docs.extraDocs` in `.cs-lint.yaml`, which names PROTOCOL.md alone. PLAYBOOK.md landed outside both, so the rules that hold a document's commands and samples against the binary never see it. The prose linter walks the tree instead and does read it, which is why the document passed `make check` on the day it landed.\n\nProved by mutation: appending a fenced `cs-campaign frobnicate acme` block to PLAYBOOK.md leaves `cs-lint surface` at 0 errors, and the same line in MANUAL.md is an error.\n\nThe cost is specific to this document. A playbook is mostly judgement, and the command lines in it are the part a reader copies. Those are exactly what the command rule and the sample-output rule hold true everywhere else.\n\nThe oss linter's `docSet` omits it too, so whatever that check holds about the document map does not cover the new page.","notes":[],"links":["SAC-013"]},{"id":"SAC-017","title":"No document says how to start a campaign on an application that does not exist yet","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, from a fresh-agent test: an agent given only the binary designed a new-application campaign and named a repository path that was never going to exist","opened":"2026-09-08","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["b434ba1"],"integrated":[],"verified":"go test ./internal/cli/ -run TestTheDocumentedNewRepositoryPathIsWhatPlanDoes -count=1: PASS. The test holds both documents and the behaviour together: an absent path plans with a pinned initial commit, `initialize` set, and the directory still absent afterwards. Proved by mutation: changing one word of the manual's sentence fails it by name. make check exit 0."},"resolution":"MANUAL states the three outcomes where an author writes a profile. An absent path is planned as an empty repository and created at `create`, an unborn one is adopted on `main`, and a directory of untracked files is refused. PLAYBOOK carries the reason under a new heading on building something that does not exist yet. A new application has to live in a repository on the host rather than only inside machines that get destroyed. The base commit is what makes the work fetchable and mergeable afterwards. It also names the seam R124 implies, that whoever owns an application owns its runtime, and says to settle that before the briefs are written.","details":"Nothing tells an operator what to do when the application does not exist yet.\n\nThe product handles the case well. A repository path that is absent plans as an empty repository, with a deterministic initial commit pinned and `initialize` set, and planning creates nothing. An unborn git repository is adopted on main. A directory that holds files and is not a repository is refused rather than adopted in silence.\n\nProved by probe. Running plan with `--repo` pointed at an absent path exits 0 and leaves the parent directory empty. The pinned initial commit is derived rather than read, so every host computes the same one.\n\nNo document a reader can reach says any of it. MANUAL names no initial commit and no adoption rule. PLAYBOOK describes a repository as a writable clone at the campaign's base commit and never covers the case where there is nothing to clone. SPEC R123 requires the behaviour, and it is written as a rule for the implementation rather than as guidance for an operator.\n\nThe cost showed up in a test. An agent given only the binary was asked to design a campaign building a new task-tracking application. It read the playbook and then wrote a placeholder repository path into its profile. Nothing it could reach told it what the tool does with a path that is not there.\n\nBuilding something new is one of the strongest reasons to run a campaign, so this is a path an operator meets early.","notes":[],"links":["SAC-013"]},{"id":"SAC-018","title":"The scaffolded brief invites the integer gate the playbook forbids","type":"defect","severity":"med","status":"closed","foundBy":"session agent, from a fresh-agent test: an agent that had read the playbook wrote coverage thresholds into three of the four briefs it authored","opened":"2026-09-08","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["6040dba"],"integrated":[],"verified":"go test ./internal/cli/ -run TestScaffoldPromptsDoNotInventVocabulary -count=1: PASS. Proved by mutation: putting `Met` back into the mission stub fails it by name. End to end, init's closing output now names the playbook, and MANUAL's sample of that output matches the binary, which SURF-303 checks. make check exit 0."},"resolution":"The scaffolded brief asks for what an author could check rather than what they could count. One worked contrast carries it. An endpoint test that fails without the change holds up, and a coverage percentage invites a member to manufacture coverage. The orchestrator stub carries the other half, that a teammate's reported number is confirmed rather than taken. Neither comment argues the case, because `cs-campaign playbook` now carries the reasoning and every stub points at it.","details":"`init` writes a brief stub that suggests a benchmark and warns about nothing, so an author fills it with the gate the playbook exists to prevent.\n\nThe stub's comment under \"Proof your work must carry\" tells the author to add what this campaign requires, offering a test run, a benchmark or a migration applied. It says nothing about the shape a check should take.\n\nPLAYBOOK says the opposite at length. Verify every number and gate on none. State a count as a property rather than an integer, because an integer pass condition invites a member to manufacture whatever is counted. An unsatisfiable gate is not survivable, because a capable agent finds a way to appear to pass it.\n\nThe scaffolding wins that argument. In a fresh-agent test, an agent read the playbook as its second command. It then wrote coverage thresholds into three of four briefs, including a percentage of API coverage and a minimum count of end-to-end journeys. It copied the stub's shape rather than the document's advice.\n\nThis is the shape SAC-006 recorded. What the scaffolding shows is what an operator copies, and what it omits is invented. The stub is read at the moment the advice is needed, and the playbook is read before or not at all.","notes":[{"date":"2026-09-09","text":"Superseded in part by SAC-027. The comments this record improved are gone, because the stubs that carried them are gone. What survives is the guidance itself, now in the playbook under the headings a brief uses."}],"links":["SAC-006","SAC-013"]},{"id":"SAC-019","title":"A member's seeded files are passed as one argv string, so a large team fails create","type":"defect","severity":"high","status":"closed","foundBy":"user report (host): create fails with \"argument list too long\" when a member's input file set is large","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 argv limit session","evidence":{"commits":["afe95be"],"integrated":[],"verified":"go test ./... -count=1: all packages pass. TestLargeSeededSetIsDelivered seeds one member 320 KiB across eight files and delivers it. Proved by mutation: putting the payload back in the command fails that test at 444092 bytes in one argv entry. TestPutScriptsAreFixedSize holds the property in the protocol package, that a delivery script's length does not depend on its content. TestPutMsgScriptRefusesClobber still passes, so the noclobber claim on a message name survives. End to end, a profile seeding 155 KiB validates with exit 0 and one warning, and plan's JSON still parses with the warning on stderr. make check exit 0."},"resolution":"All three writers pass the payload on standard input. `PutFileScript` and `PutMsgScript` take a path and read the content from stdin, `PutPayload` encodes it, and the transports carry it: `memberRunStdin` on the host and `sshOut` inside a member. Channel configuration is one exec per file rather than one script for all of them. Nothing bounds a seeded set now, because a pipe has no argv limit. The guest binary already arrived this way, so the fix generalises a pattern the code already trusted.\n\n`validate` and `plan` warn when a member is seeded more than 64 KiB, naming the member and the size. It is advisory, and it is about the reader rather than the kernel: the playbook puts a member's seeded reading in the thousands of words. MANUAL carries the warning in Diagnostics.","details":"`create` fails partway through with \"argument list too long\" once a member's seeded files grow, and no earlier command can see it coming.\n\nEvery file the host writes into a member is base64-encoded into a shell fragment. The fragments are joined with `&&` into one string, and that string is a single argument to `cs-sandbox exec`. Linux caps one argument at MAX_ARG_STRLEN, which is 32 pages. That is a separate and far smaller limit than the total argument space, so the assembly is refused whole by execve.\n\nThe numbers come from this host. The largest single argument accepted is 131071 bytes, so the cap is 131072. Nine files holding 98225 bytes assemble through this repository's own `mkGuestDirs` and `putGuestFile` into a 131787 byte script, and exec refuses it.\n\nThe orchestrator meets it first. It is the one member seeded with the mission and with every role's brief, its own included. The payload therefore grows with team size times the length of each. A reported eight-member run carried nine files at 98225 bytes raw and 130976 base64, which is 96 bytes under the cap before the shell wrapper is counted.\n\nTwo things make it expensive to diagnose. The error names the last file in the sequence, which is arbitrary, because the script is assembled whole and rejected whole. Nothing before `create` assembles the exec, so `validate`, `plan` and `create --dry-run` all pass.\n\nThe campaign is left in `create-failed` with some sandboxes provisioned and billing, and the readback never runs.\n\nThree writers share the pattern, so a fix confined to channel configuration leaves two open. `putGuestFile` seeds the channels and is the reported failure. `PutFileScript` writes a single file to a member. `PutMsgScript` writes dispatch messages, which is how the mission body reaches the orchestrator, so a long mission fails the same way.\n\nNone of this is documented. MANUAL states a different limit, the composed path length, and says nothing about how large a seeded file set may be.","notes":[{"date":"2026-09-09","text":"The failure shape changes with this fix. Channel configuration was one exec and is now one per file, so an interrupted create can leave a member partly seeded. That is already caught downstream. The member's own check-inputs reports the absent files, and the readback fails creation by name rather than letting a half-briefed member work."}],"links":[]},{"id":"SAC-020","title":"SPEC still lists a pin verb the tool dropped six months ago","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while reading SPEC 3.1 for the playbook's material","opened":"2026-09-07","resolved":"2026-09-07","stint":"2026-09-07 playbook session","evidence":{"commits":["8bb030b"],"integrated":[],"verified":"go test ./internal/cli/ -run TestSpecNamesEveryCommand -count=1: PASS. Proved by mutation: restoring the old line fails it on two counts, `pin` named with no verb behind it and `playbook` carried by the binary and unnamed. The whole gate is green: make check exit 0, and the surface linter reports 0 errors after the waiver was dropped."},"resolution":"Section 3.1 lists the verbs the binary has. The dead `pin` is gone, `orientation` and `playbook` are named, and section 7.1 says the upstream check where it used to say pin. The stale `sampleSkip` waiver is dropped from `.cs-lint.yaml`. TestSpecNamesEveryCommand now holds the block against the command tree in both directions, which is the gate this section never had.","details":"SPEC's host command surface lists a `pin` verb that `cs-campaign` does not have.\n\nSection 3.1 prints `cs-campaign doctor|pin|manual|version` as the health and metadata group. Running `cs-campaign pin` answers `unknown command \"pin\"`, and the root command registers no such verb.\n\nThe verb was real and was removed. Commit 133ba66 replaced the operator-written pin file with the `go.mod` embedded in the binary. That change rewrote R75, deleted section 5.8 and dropped the `CS_CAMPAIGN_PIN` variable, and it left the synopsis in 3.1 naming the verb.\n\nTwo other traces are left behind. Section 7.1 lists pin among what `internal/cli` holds, which reads as the upstream check rather than a verb and is defensible. `.cs-lint.yaml` carries a `sampleSkip` waiver for `cs-campaign pin --note ...`, and no document contains that sample any more.\n\nThe surface linter has the rule that would catch this. SURF-101 refuses a command a document names and the tool lacks, and it reports zero errors here. The line is pipe-separated inside a fenced sh block, which reads as a shell pipeline rather than as four verbs.\n\nSPEC is the contract a reader trusts about the surface. A verb listed there that does not exist is the staleness that makes the rest of the page suspect.","notes":[{"date":"2026-09-07","text":"The surface linter still cannot read this block. SURF-101 parses `cs-campaign doctor|manual|playbook|version` as a shell pipeline rather than as four verbs, so the rule that exists for this defect stays blind to the synopsis form. The new test covers this repository. Teaching cs-lint the form would cover every project that writes a synopsis this way."},{"date":"2026-09-09","text":"This record was filed as SAC-015 on a branch and renumbered on integration. The maintainer's own SAC-015 reached the remote first, and an ID belongs to whoever integrates it. The record is otherwise unchanged, and the work it describes is unaffected."},{"date":"2026-09-09","text":"The maintainer fixed the same line upstream in a275f4e, which dropped the pin verb and left the section without `orientation`. The merge kept this branch's version, which also names `orientation` and `playbook`. TestSpecNamesEveryCommand is the part that is not duplicated, and it would have caught the missing verb as well as the dead one."}],"links":[]},{"id":"SAC-021","title":"The mission stub names two outcome values the product does not have","type":"defect","severity":"med","status":"closed","foundBy":"user report (host), reading the scaffolded comments: \"they seem very esoteric, stated as if some obscure concepts must be pre-known\"","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["6040dba"],"integrated":[],"verified":"go test ./internal/cli/ -run TestScaffoldPromptsDoNotInventVocabulary -count=1: PASS. Proved by mutation: putting `Met` back into the mission stub fails it by name. End to end, init's closing output now names the playbook, and MANUAL's sample of that output matches the binary, which SURF-303 checks. make check exit 0."},"resolution":"The mission stub carries no outcome value. It says the orchestrator ends with one of four, that every one but success names what is unmet, and sends the reader to the playbook for the list. Deleting the vocabulary rather than correcting it removes the surface the drift came from. TestScaffoldPromptsDoNotInventVocabulary refuses a stub that spells one again.","details":"`init` scaffolds a mission whose comments name outcomes that do not exist.\n\nThe stub calls the definition of done \"what an outcome of `Met` will be judged against\". It also names \"a `Converged` report\" that must name gaps relative to it. The product has four values and neither of those is among them. `protocol.Outcomes` is `campaign-met`, `campaign-converged`, `campaign-exhausted` and `campaign-blocked`.\n\nAn author writes the mission against the vocabulary the stub gave them, and meets the real one when reading the campaign's verdict at the end. The two outcomes the stub omits are the two an operator most needs to tell apart. Whether effort was ever the problem separates `campaign-exhausted` from `campaign-blocked`, and each implies a different move.\n\nThe drift has a cause worth fixing rather than patching. The stub restates a vocabulary that is defined elsewhere, so it can disagree with it. PLAYBOOK carries the four values in a table with what each means for the operator, and MANUAL carries them too. Nothing held the stub against either.\n\nThe same pass should reach the comments around it. They allude to concepts an author has not met. One names an obligation as irreversible rather than saying that uncommitted work dies with the machine. Another calls a brief standing context without introducing the term.","notes":[{"date":"2026-09-09","text":"Superseded in part by SAC-027. The comments this record improved are gone, because the stubs that carried them are gone. What survives is the guidance itself, now in the playbook under the headings a brief uses."}],"links":["SAC-018"]},{"id":"SAC-022","title":"No turn can be dispatched from a macOS host, because the driver needs two Linux-only tools","type":"defect","severity":"med","status":"closed","foundBy":"session agent, bringing the smoke tier up on the self-hosted macOS arm64 host, 2026-09-09","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 CI build matrix","evidence":{"commits":["3421b3b","0cb5836"],"integrated":[],"verified":"CI run 34400422118 was the first with no util-linux step in it. All six macOS smoke legs passed, claude-inherit among them, and nothing in the run failed. The tools those turns needed were not there to be found. Homebrew keeps util-linux keg-only, and the macOS runners' .path carries /opt/homebrew/bin without it, so `command -v flock setsid` under that PATH answers with neither. Before this, by hand on that host, a claude-subscription replay reached campaign-met in 40s with the fixed scripts and neither tool on PATH."},"resolution":"This was fixed upstream rather than documented. The fix is SBX-038 in the sibling project, which replaced the three constructs macOS lacks. The turn lock is a directory naming its owner, the background turn is detached without setsid, and the runner's identity is read from ps rather than /proc. This repository picked it up by repinning its dependencies, and the commits above are that repin and the one that then removed the step installing util-linux on the macOS runners.","details":"A campaign dispatches every turn from the host: `cs-\u003ccli>-remote -H \u003cmember> -b` takes the prompt, holds a per-session lock over it and launches the turn detached. The lock is `flock` and the detach is `setsid`, both from util-linux, and macOS ships neither.\n\nThe failure names neither tool. The driver prints `flock: command not found`, then treats the lock as unheld and reports the session busy. `create` sees a member that never answered: the turn log holds the prompt and nothing else, and no agent process is ever started inside the member. Six members go quiet the same way and the campaign spends its readback bound before it stops.\n\nReproduce it on any macOS host with a member up: `cs-claude-remote -H \u003cref> --turn-timeout 60 --resume \u003csession> 'say hi'`. It returns `session is busy` after `flock: command not found`.\n\nInstalling the tools makes it work. `brew install util-linux` puts flock and setsid in a keg-only prefix. With that prefix on PATH the whole path runs: a claude-subscription replay on that host passed in 39s, 43 requests replayed, 0 misses. The CI job for that host does exactly this, and fails with a message naming the tools when they are absent.\n\nWhat is unresolved is who should carry it. The drivers are the sibling project's, so the fix is a portable lock and a portable detach there, or a documented macOS prerequisite here. `cs-campaign doctor` checks neither today, so a macOS host reports itself healthy and then cannot run a turn.\n\nThis product ships Linux binaries only and README says so, which is why this is not critical. It became visible because CI now runs the smoke tier on macOS.","notes":[{"date":"2026-09-09","text":"This was fixed upstream rather than documented, as SBX-038 in the sandbox project. The turn lock is now a directory naming its owner, the background turn is detached without setsid, and the runner's identity is read from ps instead of /proc. Measured on the macOS arm64 host: a recorded campaign replayed in 40s with neither flock nor setsid anywhere on PATH.\n\nWhat is left here is a `make repin` onto a sandbox build carrying it. Until that lands the smoke job for that host still installs util-linux, because this repository's members run the pinned tools."},{"date":"2026-09-09","text":"Closed on the run above. The util-linux install stays on that machine and does no harm. Nothing puts a keg-only prefix on PATH, so the tier exercises the portable path rather than falling back to the real tools."}],"links":[]},{"id":"SAC-023","title":"A campaign with no repository validates, plans, and has nowhere to put the work","type":"defect","severity":"high","status":"closed","foundBy":"session agent, from a fresh-agent test: an agent given only the binary designed a campaign to build an application and declared no repository at all","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["b967ffb"],"integrated":[],"verified":"go test ./... -count=1: every package passes. TestAFleetWithNoRepositoryIsRefused covers three cases. A fleet with none is refused and names every member. A fleet whose agents lack one is refused by agent name. A whole fleet passes. End to end, the profile the test agent produced now exits 1 and names orchestrator, backend and frontend. Eleven existing tests had to gain a repository, which measures how reachable the old behaviour was. make check exit 0."},"resolution":"`validate`, `plan` and `create` refuse a member with no repository, before anything is provisioned. The refusal names each member and says what to do. It covers the case the operator is most likely to be in: an application that does not exist yet, where you name the path it should live at.\n\nThe check sits in the planning path rather than in profile parsing. `init` scaffolds a profile with no repository yet, and adding one is the first edit an author makes.\n\nPLAYBOOK leads with the decision. Its heading says repositories and snapshots rather than trees, so it uses the word an operator looks for. It opens by saying a campaign that declares none has nowhere to put its work. The three ways a path resolves are a table in both documents, because the run-on sentences they replaced were read as one wrong rule.","details":"A profile that gives no member a repository passes `validate` and `plan`, and every member is recorded with a branch that nothing can ever create.\n\nR116 requires the orchestrator and every agent to be seeded with separate clones. R38 requires every member to commit its work to its own branch, because harvesting reads a branch and work that is never committed dies with the machine. A member with no clone can meet neither.\n\nProved by probe. A profile declaring three members and no repositories validates with exit 0, and `plan` prints all three with an empty repository list and a branch name each. The failure surfaces after the machines are provisioned and billing, when work has nowhere to go.\n\nThe gap was found by an agent given only the binary and asked to set up a campaign building a new application. It read the documentation on repositories and then declared none, and its own report says why. It could not tell whether the campaign creates the repository or expects one, where the repository should live, or how the base commit is chosen for something new.\n\nThe documentation answers a different question than the one an operator asks. It says what the tool does with a path that is absent. It never says that a repository is the only place a member can put work. Declaring none should not be a choice an operator can make by accident.","notes":[{"date":"2026-09-09","text":"Found by the second fresh-agent test rather than by review. The same run showed the integer gates gone, which was the point of the earlier work, so the test earned its keep twice. It also showed that a brief's headings are not followed now that nothing scaffolds them. That is a separate question about the document SAC-013 covers."}],"links":["SAC-017"]},{"id":"SAC-024","title":"A mission can name outcome values the product does not have, and nothing says so","type":"defect","severity":"med","status":"closed","foundBy":"session agent, from a fresh-agent test: the mission it wrote declared campaign-partial and campaign-unmet, and briefed the orchestrator to reply with one of them","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["a652867"],"integrated":[],"verified":"go test ./internal/cli/ -run TestAnInventedOutcomeIsNamedBeforeTheSpend -count=1: PASS. Proved by mutation: widening the pattern to bare text reports campaign-free as an invented outcome, and the test fails on it. End to end, the mission the test agent wrote now draws four warnings by file and token, and a mission naming only real values is silent. make check exit 0."},"resolution":"`validate`, `plan` and `create` warn when a seeded document names an outcome the product does not have, before anything is provisioned. The warning names the file, the invented token and the four real values.\n\nThe pattern matches a value where an author is naming it as a value, inside backticks or after `--outcome`. Bare text is left alone on purpose: this document set writes campaign-free and campaign-specific in ordinary prose, and warning on those would make the warning worthless.\n\nA warning rather than a refusal, because a document may name an outcome for a reason this cannot see. Checking a closed vocabulary the product owns is not grading prose, which R50 forbids.","details":"A seeded document can declare an outcome vocabulary the product will reject, and every pre-spend command accepts it.\n\nAn agent given only the binary wrote a mission naming `campaign-met`, `campaign-partial` and `campaign-unmet`. Two of those do not exist. The values are `campaign-met`, `campaign-converged`, `campaign-exhausted` and `campaign-blocked`. It then briefed the orchestrator to close the campaign with `campaign-partial`, which the reply verb refuses.\n\nThe failure lands late and expensively. The mission is seeded at create, the orchestrator works the whole campaign against a vocabulary it cannot use, and the refusal arrives when it tries to report. Nothing before that reads the words.\n\nThis is not a documentation gap. MANUAL states the four values in the same sentence as the `--outcome` flag, and the agent cited that sentence. It had the vocabulary and wrote different words anyway.\n\nChecking it is not grading content, which R50 forbids. The outcome vocabulary is a closed set the product owns, in the way the `--set` override paths are a closed allowlist. A seeded document that names a value outside the set is wrong however good the prose around it is.\n\nThe same shape was fixed once already in the scaffolded mission, which named `Met` and `Converged`. Removing the stub took away that instance and left the class in place.","notes":[{"date":"2026-09-09","text":"The same commit rewrote part of the playbook, for a related reason. It presented a brief's parts as headings, which read as a schema that nothing enforces. They are now the three questions the readback asks, which are the part that is real. Inventing a heading breaks nothing, and leaving out what the member has to answer does. The orchestrator's brief is also told not to restate the outcome vocabulary at all."}],"links":["SAC-021"]},{"id":"SAC-025","title":"A ref on a repository that does not exist yet fails with a bare git exit code","type":"defect","severity":"med","status":"closed","foundBy":"session agent, from a fresh-agent trial: two of three runs wrote a ref beside a path that did not exist and were stopped by an unexplained error","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 scaffold prompts session","evidence":{"commits":["263c49a"],"integrated":[],"verified":"go test ./... -count=1: every package passes. TestARefOnARepositoryThatDoesNotExistYet holds both halves. The branch the repository will be born on plans as an empty repository. Any other is refused with the path, the ref and the remedy, and without git's exit code. Proved by mutation: restoring the old guard fails it with the exact error the trial agents hit. End to end, the probe profile that exited 1 with exit status 128 now resolves, and the same profile asking for develop is refused by name. make check exit 0."},"resolution":"An absent repository is recognised whatever ref the operator wrote. The branch it will be born on resolves the way no ref at all does. Any other ref is refused, naming the path, the branch it will actually get, and the two ways out.\n\nSubstituting a branch would be worse than refusing. An operator who wrote `develop` asked for something specific, and a repository the tool creates will never have it.\n\nThe documents no longer teach the combination. PLAYBOOK's example drops the ref that sat seventeen lines from the advice to name a path that is not there. Both documents now state the rule, which is that a ref names a branch on a repository that already exists.","details":"Naming a `ref` on a repository path that does not exist yet fails with `exit status 128`, and nothing says why.\n\nProved by probe. A profile that declares a ref beside an absent path exits 1, and the whole of what it says is `resolve repo /tmp/does-not-exist-yet-xyz ref main: exit status 128`. The same profile without the ref validates, because an absent path is planned as an empty repository.\n\n`resolveRepoRefs` asks git to resolve the ref, and falls back to creating the repository only when the ref is the default. A ref the operator wrote skips that recovery and returns git's own failure, wrapped and otherwise unexplained. Git fails for the same reason in both cases, which is that there is no repository there yet.\n\nThe message names neither the cause nor the remedy. It does not say the repository is missing, that the ref is what stopped it, or what to do instead.\n\nThe documents teach the combination that fails. PLAYBOOK shows a repository declared with a ref in one section, and seventeen lines later tells an operator to name a path that is not there. Two agents in a six-run trial wrote both together and were stopped. One of them had declared no repository at all on the command line, so it wrote the block itself from what it had just read.\n\nThe rule is stated nowhere. No document says that a ref only means something on a repository that already exists.","notes":[{"date":"2026-09-09","text":"The code fix alone would not have prevented either failure in the trial. Both agents would still have written the ref, and would have been told why rather than left with an exit code. The playbook edit is the part that stops it happening, and the adjacency it removes was introduced the same day by the fix for SAC-023."},{"date":"2026-09-09","text":"The resolving commit was reworded before it reached a remote, because its subject ran to 62 characters and the gate refuses one over 60. Rewriting it moved its hash, so the citation above was repointed from the orphaned one. This is the defect SAC-004 records, caught by scanning every cited hash against HEAD rather than by noticing."}],"links":["SAC-023
