s rule R70 measures it forward from the previous step's end to its result. On run14-1 the orchestrator's wait call at step 178 was issued at 05:57:03 and returned at 06:00:49. The page drew its band from 05:53:15 to 05:57:03, under the columns of the turn before it. That is what the owner saw: a wait under bars that show the agent at work. Checked against the raw trace, 253 of the orchestrator's 255 tool calls have `workMs` equal to the result's timestamp less the previous step's end, within 50 ms. The other two are sub-second.\n\n**A member's idle band repeated the gap between its boxes.** Idle (rule R68) is the time from a turn's end to the next turn's start. For a member that is the time between one dispatch's reply and the next dispatch's opening, which the boxes already show. Measured on run14-1: checker idled 194 minutes, surveyor-interface 107, surveyor-behaviour 69 and modeller 6. In every case under a tenth of a minute of it fell inside a box.\n\nTwo smaller confusions came with these. The columns inside a box are placed by order between the steps pinned at their real time. The steps after a wait call were therefore spread back across the wait, and the row above the band showed work where there was none. And the inspector's \"of which waited\" is a model step's queueing time, a different fact under the same word.\n\nThe previous session recorded two tracer findings for filing: a model step ending after its tool call began, and a batched call inheriting a wait's length. Both are the same misreading of the timestamp, and neither occurs in the trace. Nothing is filed against the tracer.","notes":[],"links":["SAC-053"]},{"id":"SAC-051","title":"A call that forked a session drifts from the fork it started","type":"improvement","severity":"low","status":"closed","foundBy":"repository owner, reading the served page at `#e/2355@0:24:34-0:39:34`: \"does the teal dot symbolize that it's the start of a fork\", and \"should the inspector mention the fact that a subagent was spawned?\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-22 waiting on the steps row","evidence":{"commits":["9d65b2c"],"integrated":[],"verified":"The run14-1 site was rendered from the tracer's head and opened in headless Chromium at `#e/2355@0:24:34-0:39:34`. Modeller's `task` call now sits at 28:24 on the axis, over the first step of the fork row, where before it sat near 0:31. The inspector shows `spawned: a forked session, 29 events, from 28:24` with a link that opens the fork's trace. At `#e/2249`, the fork's first step, it shows `forked by: tool · task at 28:24`. `make check` is green."},"resolution":"A call that forked a session is pinned at its real time, like an anchor or a turn's edge. The inspector's spawned row names the fork, its event count and its start, jumps to its first step and opens its trace. A step in a fork has a forked-by row that jumps back to the call. The manual's traces paragraph says so.","details":"A column that forked a session carries a dot on top, and the fork's steps are a row beneath. The column was placed by order between the pinned steps, while the fork's first step was pinned at its real time. On run14-1 modeller's `task` call at 28:24 sat near 0:31 on the axis, three minutes right of the row it started. The inspector said nothing about the fork either way: neither that the call spawned one, nor, from a fork's step, which call did.","notes":[],"links":["SAC-050"]},{"id":"SAC-052","title":"The protocol marks and the traces clash on one row set","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, reading the served page: \"the protocol and the traces seem to be clashing, making the diagram hard to read. like maybe we have a protocol view that has the protocol stuff and a trace view that has the traces\", and \"the default view could be what you see if you are on run and ONLY the show orchestrator log is selected\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-22 waiting on the steps row","evidence":{"commits":["28926e1"],"integrated":[],"verified":"The run14-1 site was rendered from the tracer's head and opened in headless Chromium. At `#m/orchestrator@run` the page opens in the protocol view. The lanes are the orchestrator log, then the eight members. It draws 67 marks. The log panel is present, errors only is disabled, and the legend has the channels and log rows. Choosing member traces gives the same lanes plus modeller's fork row. It draws 1665 marks, with every channel and log mark hidden. There is no log panel, errors only is enabled, and the legend has the steps row alone. A step address, `#e/423`, opens in the traces view. The fixture suite passes 20 of 20 rows and 9 of 9 targets after re-recording CF-01, CF-05 and CF-15 with the owner's approval, and `make check` is green."},"resolution":"A segmented control in the timeline's header chooses protocol or member traces, and shows only when the page has traces. Protocol is the run as the channels and the log show it: the log row first, always drawn, every box with its marks, and no trace rows. Member traces hides the marks and the log's claims, keeps the log row empty, and frames each traced member's steps with its box on one row. Errors only and the legend follow the view, and a step address switches to traces. The manual's Timeline paragraph says so.","details":"Every member had a protocol row of boxes and marks and, under it, a steps row of the tracer's columns inside the same boxes. The orchestrator's log claims sat on a row at the bottom, hidden until a checkbox showed them. Read together the two vocabularies fought: dots and labels above, columns below, links between. The owner's reading: the run view with only the log shown is the page that gives the run's shape. The traces are a second page rather than a second row. Wanted: two views. Protocol, the default, is the run as the channels and the log show it, with the log row on top of the orchestrator. Traces empties the log row, drops the marks, and shows the steps inside the boxes. Errors only is a traces control.","notes":[{"date":"2026-09-22","text":"The owner's review of the first cut: the rows moved between views. A protocol row was 24 px and a steps row 34, and the fork rows came and went. In de13eed both rows are 34 px with one hidden, and the fork rows stay in both views. A probe reads the same label top and height for every row in either view. The same commit puts the view in the address, as a leading `traces/`, and renames the option to traces."}],"links":["SAC-050"]},{"id":"SAC-053","title":"The viewer writes a site when traces are wanted, and nothing on record says so","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, deciding to keep the folder form after a week of using it: \"agreed on keeping the folder\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-22 site mode on record","evidence":{"commits":["976c8ec","83896c0"],"integrated":[],"verified":"Rendered run14-1 with `-o site/ --tracer` from the tracer's head. The site holds `index.html`, `tracer/index.html` and 16 trace pages, one per session the page names, with none missing on disk. A failed step was selected on the page in headless Chromium, and its inspector link, `tracer/traces/\u003csession>.html#ev-345`, was followed. The tracer's page has an element with that id. The option for event 345 carries `aria-selected`, and the listbox's active descendant names it. The page's data names 77 anchors, and the earlier probe in `~/.tmp/dispatch-viewer/session3/probe.cjs` found the run view fitted and the bands in place. `make prose` passes on the spec and this record."},"resolution":"`SPEC.md` section 3.3 now says the viewer writes a site when traces are wanted, chosen by giving `-o` a directory. It also says why the folder beat baking the traces in: size, the tracer's ownership of its pages, and links that need pages to land on. This record holds the decision. The folder form itself landed with the traces branch.","details":"**What exists.** Since the traces branch, `cs-dispatch-viewer` draws each member's trace inside its dispatch boxes. Every step and anchor on the timeline is meant to link to its event in the trace, and a link needs a page to land on. So when `-o` names a directory, the viewer writes a site: the dispatch page as `index.html`, and the tracer's own export of every session under `tracer/`, one page per trace. A single-file render still carries the trace data, and has no links.\n\n**What was missing.** `SPEC.md` said the viewer writes one file, and no record said the folder form exists or why it was chosen over baking the traces into the page. The owner held both back until they had used it.\n\n**Why the folder.** On run14-1 the page is about 1 MB and the tracer's export about 7 MB across 16 traces; baked in, the page would parse all of it before showing anything. The trace pages are the tracer's, made by `cs-tracer` at render time from the archive's raw evidence. So the viewer learns nothing CLI-specific, and a newer tracer can re-read an old archive. And the links need real pages. The cost is that a folder is passed around by zipping or serving it, which suits a tool whose readers are the owner and the agents.\n\n**What to do.** Say so in `SPEC.md`, and keep this record as the decision.","notes":[{"date":"2026-09-22","text":"Filed as SAC-048 on the traces branch while main gained a different SAC-048; renumbered at the merge, since main's record was on the remote first. The commits it cites still say SAC-048 in their messages."}],"links":[]},{"id":"SAC-054","title":"A refused orchestrator has no resumer: the host derives the resume and nobody performs it","type":"defect","severity":"high","status":"closed","foundBy":"user report (host), from the operator postmortems of two campaigns that ran the same night on one claude login, brought to the maintainer with a proposed design","opened":"2026-09-22","resolved":"2026-09-22","stint":"campaign-reliability-v4","evidence":{"commits":["8b39999","b8a6d72","3993946"],"integrated":[],"verified":"`go test ./internal/cli -run Resume -count=1`: 6 of 6 PASS. All six failed before the fix with `unknown command \"resume\"`. `./scripts/record-fixtures.sh claude-fault-capacity`: the recording PASSED in 358 s. The driver read `node-refused` for the orchestrator, the host sent one resume, and the verdict was `campaign-met`. `make test-smoke SMOKE_TESTS=TestSmokeReplay/claude-fault-capacity`: PASS in 266 s, with 0 upstream calls and one host resume. `make ci`: rc 0, with 8 of 8 smoke scenarios replayed and 0 upstream calls."},"resolution":null,"details":"**What happened.** The provider ended the orchestrator's mission turn in two campaigns within a minute and a half of each other, one with a 529 and one with a 500. Both orchestrators were claude on a lent login. The turn driver classified each as `capacity`. From the next look, `observe` read `orchestrator node-refused m1 capacity · 1 refused in a row · resume next, no rung spent` on every look. No resume was sent. After `providerWaitSeconds` the line became `node-stuck … provider wait bound tripped`, and it read that way for two more hours. Every agent sat `node-free` or `node-replied` with work waiting to be read. Both campaigns stood idle for a little over three hours, until a person sent `cs-campaign send` to each. That is a continue, so it spent a rung and re-sent the mission, where a resume would have carried the same session on for nothing. Each campaign then went on to converge.\n\n**Why.** A refused agent is resumed by the orchestrator's wait loop, and that loop worked the same night: eight codex throttles across the pair, eight resumes, no rung spent. The orchestrator has no dispatcher above it inside the campaign. The host is that party, and it already computes the orchestrator's state and derives the move. What the host lacks is any way to perform it. The host has `send`, which continues, and `restart`, which restarts. No command of the host performs a resume. PROTOCOL.md section 9 then says that during a campaign the host observes and does not act, so nobody built one.\n\n**Why it matters.** A campaign whose orchestrator is refused once stops until a human notices. A pair on one login fails together. Unattended, the login would have expired before either deadline and neither campaign would have produced an answer. The provider's own retries do not cover this. The CLI retried the overload by itself for four and a half minutes before it gave up. The driver read that as working, which is right. An overload that lasts longer than the CLI's retry budget always reaches this gap.\n\n**How to reproduce.** Open a mission on an orchestrator whose lent slot has a 529 armed for its next call. Watch `observe` derive `resume next` for the orchestrator and watch nothing send it.\n\n**What would help.** A host command that performs the no-rung move on the orchestrator and nothing else. It probes, computes the state, and sends the resume into the open mission when the derived move is `resume`. That move arises for a provider refusal whose wait has elapsed, or for a turn that never ran. In every other state it refuses and names the instrument that applies. A consumer's own tending loop then calls it when `observe` says so, and the pacing, the one-per-look rule and the bound come from the same computation. Section 9 changes to match: the host may perform the no-rung moves for the one node that has no dispatcher, and judgment stays where it is. Continue, restart and the verdict remain a person's. A machine that is gone remains unrecoverable.\n\n**How it is proven.** The first proof is a unit scenario on the host's ladder, where a refused orchestrator gets exactly one resume into the same dispatch and the same session after its wait. It gets none before the wait, and none once the bound has tripped. Then a fault-tier scenario on a real fleet with the fault armed on the orchestrator's lent slot, recorded once and replayed in CI. This is the first evidence for the claude family under an injected fault, which the conformance suite covered and no run had shown.","notes":[{"date":"2026-09-22","text":"Measured on the recording: the CLI retried the overload by itself for about three minutes before the driver saw a refusal. The host's resume went out thirty-five seconds after that. A refused orchestrator now costs a campaign a few minutes, not a person's attention."},{"date":"2026-09-25","text":"A second report confirms that the derivation reaches a failure in the middle of a response. A 500 ended a mission turn three hours long, and the turn driver classed it `capacity`. `Compute` reads any refused class newer than the newest message as `node-refused`, whenever in the turn the error came, and derives `resume` once the hold is over. Two bounds still come first: `elapsedSeconds`, which is checked before the class, and `providerWaitSeconds`. The move still needs the host to run `cs-campaign resume`, by hand or from a tending loop. Turns the orchestrator started by itself are not reached, and SAC-067 records that gap."}],"links":["SAC-034","SAC-067"]},{"id":"SAC-055","title":"A resumed create re-sends the first readback verbatim, and members read it as a broken channel","type":"defect","severity":"med","status":"closed","foundBy":"session agent, operating the deps-pilot campaign on 2026-09-22, from the replies of its pm, frontend and orchestrator","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["9263f09"],"integrated":[],"verified":"At 28e6ba6, `go test ./internal/cli/ -run 'Resumed|FirstReadbackIsAsked|DocumentedResumedReadback|MalformedReadback|SubstantiveReadback' -count=1` passes 10 tests against a fake member that keeps its channels as files. A member whose recorded readback passed in d001, against unchanged seeded files, receives no d002, and create prints `confirmed its briefing in d001 on an earlier create`. A member whose d001 answer failed is asked in a new message headed `This is dispatch d002`. It quotes the failure and says `Nothing in your briefing has changed since.`, and never names d001 as its own id. A changed brief is asked for again, naming `roles/dev.md`. An unanswered d001 is continued as `d001.001.md`, which says the dispatch is still open. With the skip and the reason switched off, four of the tests fail, measured before the fix was replayed onto the traces work, which left its code unchanged. `make ci` passed at 28e6ba6, and its smoke tier replayed all 9 scenarios."},"resolution":null,"details":"**What happens.** Re-running `create` after a failed readback opens a new readback dispatch on every member. Members whose readback already passed get one too. The text is `readbackPrompt`'s, word for word, so a dispatch with id `d002` or `d003` opens with \"This is dispatch d001\" and says nothing about why it came again.\n\n**Seen live.** deps-pilot took three creates on 2026-09-22, because a provider outage kept two members from answering within the readback bound. The other members received the same briefing up to four times. pm concluded that \"your send path is broken\". It then wrote its shortlist under a dispatch that said not to perform any work, and refused the next copy as blocked. frontend also started work early. The orchestrator spent a note proving by md5 that the copies were identical.\n\n**Why it matters.** The readback exists to confirm a briefing before any work. A repeated, misnumbered copy teaches capable members that the channel is unreliable, and they respond by acting on their own reading. That is the opposite of what the readback is for.\n\n**Where it is.** `runReadback` in `internal/cli/readback.go` calls `readbackOne` for every member on every create, whatever that member's saved readback says. The text is `readbackPrompt` in `internal/cli/readbackverify.go`. MANUAL.md says a re-run \"continues the still-open readback dispatch\", which holds only for a member whose readback is still open.\n\n**What would help.** Skip a member whose saved readback passed and whose dispatch is closed. When a member must be asked again, name the real dispatch id and say why: create resumed after an earlier failure, and nothing in its briefing changed.","notes":[{"date":"2026-09-22","text":"The skip reads two things: the saved readback record and the member's own channel. The record now carries the dispatch its answer closed and the seeded digests the member held. A record written by an older build carries neither, so its member is asked once more, with the reason."},{"date":"2026-09-22","text":"A first create asks exactly as before, so no recorded session changes. Everything a resumed create adds is in the message file, which a replay treats as a tool's output."}],"links":[]},{"id":"SAC-056","title":"A resumed create moves the deadline under members that have already read it","type":"defect","severity":"low","status":"closed","foundBy":"session agent, operating the deps-pilot campaign on 2026-09-22, from the orchestrator's first assessment note","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["9377cec"],"integrated":[],"verified":"At 28e6ba6, `go test ./internal/cli/ -run 'LiveDeadline|DocumentedMissionDeadline|ResumedCreateReanchorsDeadline' -count=1` passes 3 tests. A first create's mission reads `The campaign's deadline is 2026-09-22T15:32:51Z.` and says nothing of a resume. A resumed create's mission adds that the deadline moved to this attempt, and that a deadline read before it is out of date. A campaign with no deadline is told of none. With the deadline line switched off, two of the tests fail, measured before the fix was replayed onto the traces work, which left its code unchanged. `make ci` passed at 28e6ba6."},"resolution":null,"details":"**What happens.** `adoptResumableCreate` re-anchors the saved deadline to each new create attempt, and the resumed create rewrites `member.json` with it. Nothing tells a member that its clock moved. The campaign's `createdAt` stays at the first attempt.\n\n**Seen live.** deps-pilot's deadline went from 14:48:04Z to 15:06:18Z to 15:32:51Z across three creates on 2026-09-22. The orchestrator read `member.json` during the first attempt and derived hour 0 as the deadline minus `elapsedSeconds`: 00:48:04Z. It kept that clock for the whole run. It told pm, qa and ux that the briefing loop had spent most of the two-hour planning box, when the harness's own clock had barely started.\n\n**Why it matters.** The orchestrator enforces the deadline by judgement, so its reading of the clock is the one that counts. Two clocks that disagree by 45 minutes turn a delay the harness absorbed into schedule pressure the team felt. Here the cost was a shorter planning phase. With a short deadline it could cut work.\n\n**Where it is.** The re-anchor is in `adoptResumableCreate`, in `internal/cli/create.go`. The comment there explains the re-anchor: without it, a short deadline could expire before the mission opens.\n\n**What would help.** Keep the re-anchor, and say so where members will read it. The resumed readback or the mission dispatch could state the deadline and that it replaced an earlier one. Recording each attempt's start next to `createdAt` would also let `ls` and `observe` show which clock is live.","notes":[{"date":"2026-09-22","text":"The re-anchor stays. The mission now states the live deadline, because the orchestrator is the one enforcing it, and on a resumed create it says that earlier readings are out of date. Recording each attempt's start for `ls` and `observe` was left out."},{"date":"2026-09-22","text":"The tests call the mission body directly. No unit test drives a resumed create end to end, so the resume flag's wiring in `executeCreate` rests on reading the code."}],"links":["SAC-055"]},{"id":"SAC-057","title":"A send to a seat whose dispatch is open silently continues it, so an approval can carry another dispatch's id","type":"defect","severity":"high","status":"closed","foundBy":"session agent, from the two deps-maintenance campaigns of 2026-09-22: the first pilot's orchestrator findings (§2.7 and its dispatch-id table) and its findings log, and the pilot2 review of both","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["877177f"],"integrated":[],"verified":"At 28e6ba6, `go test ./cmd/cs-campaign-member/ -run 'Send|MintRace|Continuation' -count=1` passes 7 tests against the scripted fake world. A plain send to dev, node-working on an open d001, fails with `dev is node-working on d001, which is still open: this message would continue d001, not open a new dispatch. Nothing was delivered.` No message is delivered and no turn is started. A `--continue` after dev replied to d001 fails with `would open d002, not continue d001`. A lost mint race is refused, naming the winner's dispatch. With the refusal switched off, three of the tests fail, measured before the fix was replayed onto the traces work, which left its code unchanged. `make ci` passed at 28e6ba6, and all 9 smoke scenarios still replay."},"resolution":null,"details":"**What happens.** `cs-campaign-member send \u003cagent>` continues the agent's dispatch when one is open and opens a new one when it is closed. The only sign of which happened is the word `continued` or `opened` at the end of the output, after the message has been delivered.\n\n**Seen live.** In the first deps pilot the orchestrator numbered its dispatches itself. Its message meant as `d030` went to pm while pm was still working on `d029`, so it landed as `d029.001.md` under a heading that said `d030`. From then on the orchestrator's ids ran one ahead of the transport's. The converse happened too: a ruling meant to continue qa's `d005` opened `d006`, because qa had replied 106 seconds earlier, and the orchestrator then read `d006` as unanswered.\n\n**Why it matters.** Two steps merge into one, or one step splits into two, and nobody is told before it happens. The dispatch id is the token a design approval cites, and a frozen value is re-recorded under that token. An approval that lands inside another dispatch carries that dispatch's id. The pilot3 orchestrator brief works around it by sending only to free seats, which costs latency.\n\n**Where it is.** `sendBody` delivers and `cmdSend` reports what it did, both in `cmd/cs-campaign-member/dispatcher.go`. The orientation template says \"you never classify, the tool computes it\".\n\n**What would help.** Keep the classification computed, and make the sender say which it expects. A send that would continue an open dispatch is refused unless it says `--continue`, naming the open dispatch and its state. A `--continue` that would open a new dispatch is refused too, naming the reply that closed it. Nothing is delivered on a refusal.","notes":[{"date":"2026-09-22","text":"The refusal works in both directions. The pilot3 brief works around the first, and the first pilot's findings log shows the second happening to a ruling. SPEC.md R57 now requires a send a model issues to state which it expects, which changes a MUST."},{"date":"2026-09-22","text":"The host's `cs-campaign send` and the wait ladder's own continues are unchanged. Both act on facts they have just computed, and neither is issued by a model."}],"links":[]},{"id":"SAC-058","title":"The orchestrator cannot list a teammate's output channel, so files reach other seats only by pasting","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, from the deps-pilot2 orchestrator's findings (mechanism 3, the tracer baton) in campaign-workspaces/deps-maintenance/pilot2/archives/deps-pilot2-20260922T203209Z/orchestrator/output/findings.md","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["28e6ba6"],"integrated":[],"verified":"At 28e6ba6, `go test ./cmd/cs-campaign-member/ -run 'ReadList|SafeRead' -count=1` passes 3 tests. The listing script runs in a real shell against a temporary home, with only the ssh hop replaced. `read ux --list` prints `ux: 4 files in ~/.local/share/cs-campaign/output`, with `2772  pack-spec.md` among them, and `read ux pack-spec.md` then fetches that listed path. A name `read` cannot fetch is flagged, a directory outside the channel is refused, and an absent channel is named. With the listing branch switched off, both listing tests fail, measured before the fix was replayed onto the traces work, which left its code unchanged. `make ci` passed at 28e6ba6."},"resolution":null,"details":"**What happens.** `cs-campaign-member read \u003cagent> \u003cpath>` fetches one file from an agent's output channel, but only a file whose name the orchestrator already knows. Nothing lists what is there. A misspelt name and an absent file both fail the same way.\n\n**Seen live.** In deps-pilot2, ux wrote a 99-line pack specification into its output channel. It reached frontend only because the orchestrator pasted it into a dispatch verbatim. In the first deps pilot the orchestrator guessed five names in qa's channel, all wrong, before concluding the file was not there. The pilot2 review measured pasting as the largest single waste in both pilots: one paste at 11 actions, and the bottleneck at the 83 the full campaign plans.\n\n**Why it matters.** Seats write durable output to their channel as SPEC.md R39 asks, and the orchestrator is the only route between seats. A route that needs the exact filename in advance pushes seats to paste whole files into replies instead, which costs context on every hop.\n\n**Where it is.** `cmdRead`, in `cmd/cs-campaign-member/dispatcher.go`, reads only a path it is given.\n\n**What would help.** A listing verb, `read \u003cagent> --list`, printing every file in the channel with its size, as paths `read` accepts.","notes":[{"date":"2026-09-22","text":"The listing is `read \u003cagent> --list [dir]`, capped at 500 files, with a directory argument for a larger channel. The orientation now tells the orchestrator to fetch a teammate's file by path, and tells agents to name a long file in a reply rather than paste it."}],"links":[]},{"id":"SAC-059","title":"The dispatch viewer treats only d001 as a readback, so a resumed create's later readback reads as orchestrator work","type":"defect","severity":"low","status":"closed","foundBy":"user report (host), after SAC-055's fix showed that a resumed create can put a member's readback past d001: \"fix the dispatch viewer (frames.go) so it no longer assumes the readback is always d001 when a create was resumed\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier1","evidence":{"commits":["639954e","ca8a7d6"],"integrated":[],"verified":"At ca8a7d6, `go test ./dispatch-viewer/internal/frames/ -count=1` passes 16 tests. Two load an archive in which a resumed create put dev's readback at d002 and the mission then sent d003. An accept of `dev/d002` is reported once as `accept-of-readback`, naming `dev/d002`, with real message times and with clobbered ones. `dev/d002` yields no `reply-not-accepted` in either case, and neither does a failed create with clobbered times and no readback record. Against the code without the fix, both tests failed on 4 of those 5 cases, measured before the fix was replayed onto the traces work. In the traces view, `TestJoinAnchorsOwesNoSendForALaterReadback` owes a send anchor for d003 alone. Against the code at 639954e, it also reported `dev/d002: no sent anchor was found in the traces`. `make ci` at ca8a7d6 passed, and its smoke tier replayed all 9 scenarios."},"resolution":null,"details":"**What happens.** `cs-dispatch-viewer` decides which dispatches are create-time readbacks partly by the literal id `d001`. A resumed create, or a readback asked for a second time, puts a member's readback at `d002` or later. That breaks two findings.\n\n- `accept-of-readback` fires only for `d001`. A log that accepts `dev/d002`, where `d002` is dev's readback, reports nothing.\n- `reply-not-accepted` falls back to `d001` alone when the archive's message times are clobbered. dev's `d002` readback is then reported as orchestrator work nobody accepted. It is a warning when later work followed and severe when it is the node's last dispatch, as in a failed create.\n\n**How to reproduce.** Build an archive in which dev's `d001` readback failed, a resumed create asked again in `d002`, and the mission then sent `d003`. Load it with `frames.Load`. With real message times, an accept of `dev/d002` yields no finding. With clobbered times, `dev/d002` yields `reply-not-accepted`.\n\n**Why it matters.** The viewer is how a run is audited afterwards. A readback shown as unjudged work sends a reader looking for a failure that did not happen. An acceptance of a readback shown as normal hides an orchestrator judging what the host judges.\n\n**Where it is.** The two checks are `buildEventsAndSpans` and `check`, in `dispatch-viewer/internal/frames/frames.go`. The finding's definition in `issueDefs` and MANUAL.md also names `d001`.","notes":[{"date":"2026-09-22","text":"A readback is now a dispatch create issued, found in one of three ways. The first is `d001`, or any dispatch when no mission ever opened. The second is any dispatch up to the one readback.json records for that member. The third is any dispatch opened before the mission, when message times are real. The readback.json record is the `dispatch` field SAC-055's fix added, so an archive from an older build with clobbered times still falls back to `d001` alone."},{"date":"2026-09-22","text":"The traces view, which landed while this fix waited to be pushed, carried the same assumption. It listed the anchors a dispatch owes, and owed a send for every dispatch but `d001`, so a resumed create's readback at d002 was reported as a send nobody made. It now asks the same question as the rest of the viewer."}],"links":["SAC-055"]},{"id":"SAC-060","title":"After a resumed create, neither ls nor observe says which attempt's deadline is live","type":"improvement","severity":"low","status":"closed","foundBy":"user request (host): \"Add the missing parts of SAC-056\", naming the two things SAC-056's notes record as left out","opened":"2026-09-22","resolved":"2026-09-22","stint":"sac-056-attempts","evidence":{"commits":["cfad94d","e68c922"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'ResumedCreateKeepsReadbacks|ResumeOfAnOlderRecord|NoDeclaredDeadline|MovedDeadlineNames' -count=1` passes 4 tests. The end-to-end test runs `create` twice through a fake cs-sandbox, and the first attempt fails as it opens the mission. On the resume, both members print `confirmed its briefing in d001 on an earlier create`, and no d002 is sent. The record then holds two attempts, and the deadline is the second attempt's start plus 30m. The mission states that deadline and says it moved. `ls` shows the deadline with `(attempt 2)`, and `observe` prints `moved by create attempt 2` and the deadline it replaces. Six deliberate breaks each fail at least one of the four tests: the resume flag, the readback skip, the attempt record, the re-anchor, the `ls` suffix and the replaced deadlines. With the resume flag broken, the new end-to-end test is the only test in the package that fails. `make ci` passed at e68c922, and all 9 smoke scenarios replayed."},"resolution":"The campaign record now keeps every create attempt, with its start and the deadline it set. `ls` and `observe` read the live deadline from it and name the attempt that moved it. A test drives a resumed create through `executeCreate`, so the resume's wiring is measured rather than read.","details":"A resumed `create` re-anchors the campaign's deadline to the attempt that resumed it, and the mission dispatch now says so to the orchestrator. The host still cannot see it. The campaign record keeps `createdAt` from the first attempt and one `deadline`, so nothing records when each attempt started or which one set the live clock. `cs-campaign ls` prints an age measured from the first attempt, and `observe` prints no deadline at all. An operator who watched the first attempt's clock has no way to learn it moved.\n\nThe resume path also has no test of its own. The tests for the readback skip and for the mission's deadline sentence call `readbackOne` and `missionDispatchBody` directly. Whether `executeCreate` passes the resume through to both rests on reading the code.\n\nSAC-056's design proposed recording each attempt's start beside `createdAt`, so that `ls` and `observe` can show which clock is live.","notes":[{"date":"2026-09-22","text":"A record written before this change has no attempts. Its resume takes the first attempt's start from `createdAt` and leaves that attempt's deadline out, because an older build may already have moved it."},{"date":"2026-09-22","text":"The state file stays at version 2, as it did when the readback gained its dispatch and inputs. An older cs-campaign refuses a record that carries attempts, because the store rejects unknown fields."}],"links":["SAC-056"]},{"id":"SAC-061","title":"make repin pins a sibling's tip whether or not its CI passed","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"If I wanted make repin to look for the last green built commit, could this just work with curl?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["6ca023d","5d23fd5","cdbbf93"],"integrated":[],"verified":"`make repin` in a clean clone of main at cdbbf93 pinned each codesweep-ai tool at the first commit in its project's `built` list. The pin on lint went to its last build, though lint's main had since moved on to commits that changed only the ledger."},"resolution":"`make repin` pins each codesweep-ai tool to the first commit in the `built` list of that project's status file. A tool whose project lists no build keeps its pin rather than moving to the tip.","details":"`make repin` moves every codesweep-ai tool pin to its sibling's main with `go get …@main`. The tip of main may be a commit whose CI failed, one still building, or one that changed only the ledger and was never built. The status file each project publishes now names the newest commit its CI built and passed, as `built`. `make repin` pins that commit, and falls back to the tip where the file names none.","notes":[{"date":"2026-09-23","text":"`make repin` now reads `built` as the list the status file holds, and keeps a pin whose project lists no build. Moving it to the tip would pin a commit that may not have built."}],"links":[]},{"id":"SAC-062","title":"A push that changes only the ledger runs the whole of ci","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"support ledger builds on pushes that only contain ledger changes, with just linting, ledger checking, and a pages build to publish the ledger page\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"ledger-builds","evidence":{"commits":["c448a20"],"integrated":[],"verified":"Pushing cceb066, which changed only `ledger/`, started the ledger and pages workflows and no ci. Both passed, and the status file still lists cdbbf93 first in `built`."},"resolution":"ci skips a push that changes only `ledger/`. The ledger workflow runs the ledger check and the document linters, and pages republishes the ledger's page. Nothing is built or published, so `built` stays.","details":"Closing an issue is a commit that changes only `ledger/`, and pushing it runs the whole of `ci`. Nothing `ci` builds or tests has changed but the records. Such a push needs only the ledger check, the document linters and a site build, which publishes the ledger's page.","notes":[],"links":[]},{"id":"SAC-063","title":"make repin leaves the viewer's ui pin where it is","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"is make repin also repinning the npm dependency on the ui npm package in the ledger, tracer and campaign projects?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"npm-repins","evidence":{"commits":["7cf9cdf","6a72a68"],"integrated":[],"verified":"In a clean clone of main with the change, `make repin` moved the dispatch viewer's ui pin to ui's last build and rebuilt the committed page. `make ci` then passed, smoke legs included. `make -n repin` moved no pin. ci runs 35957448142 and 35958979991 passed on the two commits."},"resolution":"`make repin` moves the viewer's `@codesweep-ai/ui` pin to the npm version of ui's last build, through `scripts/repin-npm.mjs`, and rebuilds the committed viewer on it. Where the status file lists no npm version yet, it takes the version the build's npm image carries. A pin whose project lists no build stays where it is.","details":"`make repin` moves the codesweep-ai tools in `go.mod` to the last commit each one's CI built, and stops there. The viewer's `@codesweep-ai/ui` pin in `dispatch-viewer/app/package.json` stays where it was set by hand. It moves only through oss-repin, which needs every sibling checked out beside this one. A clone of this repository alone has no way to take ui's last build.","notes":[],"links":[]},{"id":"SAC-064","title":"A profile cannot name a model's context-window variant, because the token rule forbids brackets","type":"defect","severity":"med","status":"closed","foundBy":"user report (host): \"Make sure to update the campaign profile to use the latest Opus 5.5 1M context model which is now available\", while writing a campaign profile","opened":"2026-09-24","resolved":"2026-09-24","stint":"2026-09-24 context-window variant","evidence":{"commits":["32fedef"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'TestModelConfig|TestApplyModelConfig' -count=1`: PASS, including a case that validates `claude-opus-5-5[1m]` and one that still refuses `$(id)`. The new TestApplyModelConfigClaudeKeepsContextVariant runs the composed guest command, then sources the file it wrote with `set -a`: `ANTHROPIC_MODEL` reads back as `claude-opus-5-5[1m]`. The full gate passes on this commit, with the smoke tier included. A profile declaring that model validates on a binary built from this commit, and fails with `invalid model` on the one before it."},"resolution":"The token rule now allows square brackets. The comment beside it says where the value lands in each adapter, and why a bracket is safe in all three.","details":"**What happens.** `model: claude-opus-5-5[1m]` fails validation with `invalid model`. The bracketed suffix is how a CLI names a model's context-window variant. The plain slug runs the default window, and `[1m]` asks the same model for its million-token one. A campaign can run that model, but only on the smaller window.\n\n**Why.** `modelToken` in `internal/cli/profile.go` allows letters, digits, dot, underscore, slash and hyphen, and nothing else. Its comment gives the reason. Each adapter writes the value somewhere different, so one rule here replaces escaping it three ways.\n\n**Why brackets are safe.** `applyModelConfig` composes every command through `shellArgs`, which single-quotes each value. The guest shell therefore sees the brackets literally. codex writes `model = %q`, a quoted TOML string. opencode takes the slug as argv to python, which encodes it as JSON. Only cs-claude reads a bare value, from the file it sources with `set -a`. There the value sits on the right of an assignment, and a shell expands no pattern in that position.\n\n**Why it matters.** The window decides whether a long orchestrator turn holds its history or compacts. A member can be moved by hand afterwards. A profile is what a campaign is reproduced from, so the declaration belongs in it.","notes":[],"links":[]},{"id":"SAC-065","title":"The dispatch viewer writes nothing an agent can read to answer questions about a finished run","type":"improvement","severity":"med","status":"closed","foundBy":"user request (host), settled in a design conversation on 2026-09-22 and 23 that followed a trial of twenty questions about four finished runs, asked of eight model and CLI pairs","opened":"2026-09-23","resolved":"2026-09-25","stint":"agent-q_and_a","evidence":{"commits":["439f8dd","69e0a97","6dc21af","702ccec","9b45cdb"],"integrated":[],"verified":"`make ci` passed with all 9 smoke scenarios replayed, and the fixture suite passed 21 of 21. Both ran before a rebase onto 02c755f, which changed only ci.yml, and `make actionlint` passes after it. Four deliberate breaks each fail a test. With an undrawn step addressed again, CF-62 reports 2 wrong. With the trace-page links removed, TestEveryStepTheFactsNameHasALinkThatResolves names the rate-limit step. With a resume read as a continue, TestFactsShowWhatQuestionsAboutARunTurnOn fails. With work summed from the strip, TestMemberTotalsKeepTheirMeasuresApart fails. In an eval of five questions about an invented run, Sonnet 5 answered 15 of 15 right, and all 105 links resolved."},"resolution":"A site now holds the page's data, each trajectory, computed facts and an AGENTS.md generated from the types. An agent answers from files in its working directory. Every event, dispatch and drawn step carries its address, and every step the facts name carries an address or a trace page. The guide says how to cite a figure and a step the page does not draw. A resume is its own event, and spends no rung.","details":"Someone who comes back to a campaign days later asks plain questions: what went wrong, where the time went, who waited on whom, and whether anyone looped. An agent CLI can answer them, with every claim linked to the dispatch page. Today it cannot do that well, for four reasons.\n\n- **The data is only inside HTML.** `cs-dispatch-viewer` embeds the run document in `index.html` and each trajectory in chunked script tags. It deletes the tracer's normalized output when it finishes. Agents in the trial spent their effort extracting data, and the GPT-5 models mostly failed to find it at all.\n- **Step addresses have to be reverse-engineered.** The page numbers trace steps after the events, two per step, so step 5 is not `#traces/e/5`. Nothing in the data says so.\n- **Agents compute the facts, and they get them wrong.** In the trial, five of eight columns answered tool-output bytes when asked for output tokens. Several summed idle across members, and several called polling a loop.\n- **A missing or stale tracer is silent.** On 2026-09-23 the installed viewer predated traces, and it wrote a page with no traces and no warning.\n\nThe change: `--file` and `--site` replace `-o`, and `--no-traces` goes. `--site \u003cdir>` also writes `run-data.json`, the kept trajectories, `facts.json` and an `AGENTS.md` for the agent that is started there. Every event, dispatch and step in the data carries its page address. The facts are computed in Go beside the page's own model, with tests, and stalls are reported as the harness's own continue and restart events against the run's policy. Without a tracer, the single file still renders, with a warning that names the install. `--site` needs one. A tracer whose output the viewer does not read stops both modes.","notes":[{"date":"2026-09-23","text":"Three choices the design left open were settled as defaults, for the host to confirm. The facts stay in the site's files and are not drawn on the page. The spec gains rules R136 to R140, and PROTOCOL.md is unchanged. A site holds one run, so comparing runs means reading several sites."},{"date":"2026-09-23","text":"Agents invent a link when they cite a figure with no page address, such as a total or a policy value. In a retest both models did, writing `#facts`, a JSON path after `#`, or a real address for an unrelated event. The site's AGENTS.md needs to say how to cite a figure."},{"date":"2026-09-23","text":"A turn end, meta or system step got an `addr`, but the page draws no column for it, so the address selected nothing. Fixture CF-62 now checks that every step address in the page's data selects its step."},{"date":"2026-09-24","text":"An eval of five questions about an invented run found three more faults. The facts name many steps the page does not draw, and on the four run14 sites 5 to 26 of them per run have no `addr`, only a trace page. The field description of `providerWaitSeconds` called it the seconds the harness waits, and both models then said the harness waited out the limit. And the viewer reported a resume as a continue. On run14-3, 5 of the 6 continues in the facts were resumes. A resume spends no rung, yet each was counted against `continueAttempts`."},{"date":"2026-09-25","text":"Before the resume and policy fixes, Sonnet 5 answered the first question wrong in 3 of 3 samples. Each said the harness waited out `providerWaitSeconds` and then continued the orchestrator."}],"links":[]},{"id":"SAC-066","title":"The mini-guest unit tests stall while a real campaign runs on the same host","type":"defect","severity":"med","status":"closed","foundBy":"session agent, running `make ci` while two live campaigns ran on the same host","opened":"2026-09-25","resolved":"2026-09-25","stint":"agent-q_and_a","evidence":{"commits":["160429c"],"integrated":[],"verified":"With two campaigns live on the host, `TestCampaignDoctorPassesAMemberOnTheShippedHarness` took 121 seconds before the fix and 1.4 after. The `internal/cli` package took 21 seconds, where it had passed the 10-minute timeout. `make ci` then passed, with all 9 smoke scenarios replayed, before a rebase onto 02c755f that changed only ci.yml."},"resolution":"The mini guest now carries its own `pgrep`, which sees no process, as a real member's sees only its own machine. The member probe run on the host no longer counts another campaign's turn drivers.","details":"The mini-guest tests in `internal/cli` stand a directory on the host in for a member, and their fake `cs-sandbox` runs each command there on the host. The member probe counts running turn drivers with `pgrep -fa 'cs-[c]laude-turn '`. On the host, that also counts the turn drivers of any real campaign running there.\n\nWith two campaigns live, `openMissionWhenQuiet` saw their orchestrators as the test's own, busy in a turn. It waited out its two-minute bound in every test that runs `create`. `TestCampaignDoctorPassesAMemberOnTheShippedHarness` took 121 seconds instead of a few, and the `internal/cli` package passed the 10-minute test timeout, so `make ci` failed. A unit test should not depend on what else the host is running.","notes":[],"links":[]},{"id":"SAC-067","title":"An orchestrator that waits in background tasks works in turns no driver wraps, so a failure there is seen by nothing","type":"defect","severity":"high","status":"closed","foundBy":"user report (host), from the operator postmortems of two campaigns of one profile that ran the same night, one orchestrator waiting in the foreground and one in background tasks","opened":"2026-09-25","resolved":"2026-09-26","stint":"2026-09-26 session","evidence":{"commits":["f06d9ee"],"integrated":[],"verified":"`go test ./internal/protocol/ -count=1`: `TestAnIdleOrchestratorWhoseRecordOutlivesAWaitChunkIsStuck` and `TestADrivenMissionEndedByTheProviderKeepsTheRefusalPath` PASS. The first holds run 17.2's shape. Idle with the session record changed 16s ago stays `node-stopped`. Busy with it still for 2h stays `node-working`, and idle with it still for 12m reads `node-stuck`. The second holds run 17.1's shape: a driven mission ended by a capacity error is `node-refused · resume` 20m later and `node-stuck` on the provider wait bound 4h36m later. `TestTheDocumentedIdleOrchestratorLineIsTheOneComputed` PASS. `make check` exit 0, and `make ci` exit 0 with all 9 smoke scenarios replayed."},"resolution":"The decided rule is in `Compute`. Take an orchestrator on its mission with no turn driver and an agent that answers idle. Once its session record is still for longer than one `wait` chunk plus the settling window, it reads `node-stuck`, and the line says why. SPEC.md R64 is amended to allow it, and PROTOCOL.md, MANUAL.md and PLAYBOOK.md make foreground waiting the supported style. Two readings were chosen where the decision left room. The margin is the settling window, which SPEC.md already defines as how long a turn may take to start. The chunk is the default as `CS_CAMPAIGN_WAIT_SECONDS` overrides it, because an observer cannot see a `--for`, and SPEC.md now says a longer one reads stuck early. The orientation and mission dispatch text and the smoke fault scenario are not done, because both change the prompt every committed cassette was recorded on. SAC-069 carries them.","details":"**What happened.** Two campaigns of one profile ran on the same night. Both orchestrators were on the claude CLI, and they waited for their members in two different ways.\n\nThe first called `cs-campaign-member wait` in the foreground, each call blocking for about four minutes. Its whole mission ran as one turn that the host started, 3h13m long. The CLI's session record marks only its start and its end. A provider error in the middle of a response ended that turn, and the turn log classed it `capacity`. That half is now covered: see the note on SAC-054 dated today.\n\nThe second launched each `wait` as a background task of its CLI and ended its turn. The turn the host started ended after 13 minutes with exit 0. The orchestrator then ran 22 more turns, each started by its CLI when a background wait finished. It dispatched, accepted and merged for 3h19m, and every look at `cs-campaign observe \u003ccampaign>` read:\n\n```\norchestrator  node-stopped  m1  0 cont, 0 restarts · continue next · last turn ended 3h ago, exit 0 · session record changed 16s ago\n```\n\n**Why.** A turn driver wraps only what the host started, and only the driver writes the turn log, `~/.cs-turns/\u003ccli>.log`. SAC-036 made `Compute` read `node-working` while the agent says it is `busy`, which sees a self-started turn while it runs. Between turns this orchestrator is idle, waiting on its background task. Most looks therefore find no driver, an idle agent, and a turn log whose newest line is the mission turn's clean exit. `Compute` in `internal/protocol/state.go` then falls through to `node-stopped · continue next`. The record age beside it is evidence only, and MANUAL.md says it \"changes no state and no ladder move\".\n\n**Why it matters.** A provider error in any of those self-started turns is written to no turn log. It carries no class, trips no `providerWaitSeconds` bound and derives no resume, so `cs-campaign resume` would refuse it as a continue that spends a rung. The line reads the same whether the orchestrator is waiting on a background task or has died, until a person notices the record age growing. A person who acts on `continue next` in the meantime spends a rung on an orchestrator that is working.\n\n**No document says which waiting mode is supported.** PROTOCOL.md section 8 draws the orchestrator as \"one long turn\" that calls a blocking wait. The orientation and the mission dispatch say only \"Never end your turn without either calling `wait` or replying\". A wait launched in the background and followed by the end of the turn obeys that sentence. SPEC.md R125 already records a model that \"backgrounded a poller and ended its turn\".\n\n**How to reproduce.** Create a campaign with a claude orchestrator whose brief tells it to run `cs-campaign-member wait` as a background task and then end its turn. After its first dispatch, run `cs-campaign observe \u003ccampaign>` every few minutes. The orchestrator reads `node-stopped · continue next` while its branch and its claimed log keep moving. Arm a provider error on one of its later turns, as the claude fault scenario does. The turn log gains no line, and `cs-campaign resume \u003ccampaign>` refuses. The last two steps are read from the code and have not been run.\n\n**What would help.** Three changes, and they compose:\n\n1. Read the turns no driver wrapped from the session record. The CLI records every turn's end and any provider error there, whoever started the turn. A turn-log line derived from it would give those turns a class, the bound and a resume.\n2. Let a stopped orchestrator's record age decide a state. SAC-036 rejected the record as a liveness measure because a node blocked in one long tool call writes nothing. That objection does not arise here, since this rule applies only with no driver alive and an agent that is not busy. A record that keeps changing means working, and one that has been still for longer than the seat's `stallSeconds` means stopped.\n3. Say which mode the harness supports. If only the foreground is supported, the orientation and the mission dispatch should say to call `wait` there and never as a background task. `observe` should then say when the orchestrator's turns come from nothing the host started.","notes":[{"date":"2026-09-25","text":"Decided, by the reporter, how to fix this. Background waiting is made safe, and foreground waiting becomes the documented style. Full support for background waiting is left for later. It would build turn ends from the session record for turns no driver wrapped. Refusing a backgrounded `wait` is dropped. Telling that a command runs as a background task needs knowledge of each agent family, and the harness serves every family alike.\n\n**R64 is amended, not bypassed.** It says a record's age must not decide a state, because slow silent work (a long model call, a long tool call) also leaves the record unchanged. The new rule reads the age only when two liveness facts already agree that nothing is running. Take an orchestrator whose turn driver is absent and whose agent answers `idle` to its family's `--state`. If its session record has not changed for longer than one `wait` chunk can block, plus a margin, it is `node-stuck`. The reason says so, and R126 sets the chunk's bound. A thinking model answers `busy` and is never caught. A background `wait` always wakes the agent within one chunk, so idle past that bound means the wake never came. Every input is one every family already provides: the driver in the process table, `--state`, the record age, the chunk bound.\n\n**Foreground waiting is the documented style.** The orientation, the mission dispatch and the playbook say to call `wait` in the foreground, where a provider error ends a turn the driver wraps and `resume` recovers it (SAC-054).\n\n**Tests.** `Compute` cases: idle with a stale record past the bound goes `node-stuck`; busy with the same stale record stays `node-working` (R64's case); idle within the bound stays `node-stopped`. A fault scenario for the smoke tier in which the orchestrator waits in the background and its wake never comes. The document-claim tests hold SPEC, MANUAL and PLAYBOOK to the amended rule."}],"links":["SAC-036","SAC-054","SAC-069"]},{"id":"SAC-068","title":"A copied agent login expires with the token it was copied from, and neither the warning nor the repair says so","type":"defect","severity":"med","status":"closed","foundBy":"user report (host), from the operator postmortem of a campaign whose orchestrator held a copied claude login and failed about eight hours after create","opened":"2026-09-25","resolved":"2026-09-26","stint":"2026-09-26 session","evidence":{"commits":["4c0176c"],"integrated":[],"verified":"`go test ./internal/cli/ -count=1`: `TestACopiedLoginIsSaidToExpireWithItsToken` PASS. It shows a seat granted `inheritAgentLogin` gets the lifetime line and a seat whose key displaces its login does not. `TestTheDocumentedCopiedLoginWarningIsTheOnePrinted` PASS. It holds MANUAL.md's quote to the printed line, and MANUAL.md and PLAYBOOK.md to the split repair. `make check` exit 0, and `make ci` exit 0 with all 9 smoke scenarios replayed."},"resolution":"The record's first two remedies landed as its documentation half. `validate`, `plan` and `create` print a second warning for a seat holding a copied agent login. It says the copy does not renew, lasts as long as the access token it was copied from, and is not reached by a host sign-in. MANUAL.md and PLAYBOOK.md now split the repair. A lent credential is renewed on the host and the session restarted. A held one needs a sign-in inside the member, or the seat is recreated. The warning does not set the token's expiry against the campaign's deadline, which the first remedy also asked for. That comparison is not done. Moving the orchestrator to a lent login is not done here. It waits on sandbox records SBX-030 and SBX-064, and the decision is the maintainer's.","details":"**What happened.** A campaign's orchestrator was granted `inheritAgentLogin: [claude]`, so its member held a copy of the host's login. It kept working through the night. About eight hours after the host sign-in that preceded `create`, its next turn failed with the CLI's `remote Claude login expired`. The copy had not renewed itself, and a later sign-in on the host did not reach it. `cs-campaign restart \u003ccampaign>` starts a new session on the same expired copy, so it cannot repair this. The repair was to sign in again inside the member.\n\n**What the tool says.** `validate`, `plan` and `create` warn that a seat holding a copy keeps it \"until it is destroyed, and the host cannot revoke it\". That is true, and it is about revocation. Nothing says that the copy lives only as long as the access token that was copied, about eight hours for claude, or that it does not renew. MANUAL.md says of logins only that \"A lent one is read fresh on every call, so signing in again on the host is all a stale one needs.\" For a rejected credential it says \"The repair is to renew the key, and then to restart the member's session with `cs-campaign restart`\". That repairs a lent seat and not a held one. PLAYBOOK.md says only \"A rejected credential is yours to renew.\"\n\n**Why it matters.** A campaign whose deadline outlasts the copied token fails at a time nobody chose: whenever the operator last signed in on the host before `create`. The documented repair then does not work, and the operator has to find the one that does while the campaign waits.\n\n**How to reproduce.** Sign in on the host, then create a campaign whose orchestrator is granted `inheritAgentLogin: [claude]`, with a deadline more than eight hours away. Sign in on the host again part way through. The orchestrator's first turn after the original token expires fails with `remote Claude login expired`, and `cs-campaign restart \u003ccampaign>` does not bring it back.\n\n**What would help.** Any of these would close the gap:\n\n1. `validate` and `plan` state the held login's lifetime beside the existing warning, and the time it expires set against the campaign's deadline. They warn when the deadline is later.\n2. The manual and the playbook name the repair for a held login: sign in inside the member, because a sign-in on the host does not reach the copy.\n3. `restart` copies the host's current login in again, for a seat whose grant inherits, before it starts the new session.\n\nLending the login avoids the whole problem, because a lent seat reads the host's login on every call.","notes":[],"links":[]},{"id":"SAC-069","title":"The orientation and the mission dispatch still allow a background wait, and no smoke scenario exercises one","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, while closing SAC-067","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["48dc317"],"integrated":[],"verified":"`make ci` passed on fdef140, with all 10 scenarios replayed and 0 misses in each. The claude-fault-lost-wake replay served 39 requests, and its orchestrator read `node-stuck` 76 seconds idle, past the 64-second bound, with the line naming a background wait whose wake never came. Its recording reached the same state past the 5-minute bound. `TestTheDocumentedIdleOrchestratorLineIsTheOneComputed` now also holds the orientation's foreground sentence."},"resolution":"The orientation and the mission dispatch tell the orchestrator to call `wait` in the foreground and never as a background task. The orientation adds that a wait left in the background does not count. PLAYBOOK.md and MANUAL.md now point at the orientation for it. The new fault scenario claude-fault-lost-wake gives its Claude orchestrator a ten-second shell bound and freezes every wait as it starts. The wait is moved to the background and never wakes it. That scenario ends on `node-stuck` rather than on a verdict. Every scenario was re-recorded for the new prompt.","details":"The decision recorded on SAC-067 has two parts that did not land with its fix at f06d9ee.\n\nFirst, the orchestrator's own instructions should say to call `wait` in the foreground. The orientation, `internal/cli/assets/orientation.md.tmpl`, and the mission dispatch in `internal/cli/create.go` say only \"Never end your turn without either calling `wait` or replying\". A wait launched as a background task, followed by the end of the turn, obeys that sentence. Both texts reach the model inside the requests the cassettes under `test/cassettes/` recorded, so editing either makes every recorded scenario miss. The change needs every scenario re-recorded against real providers.\n\nSecond, the smoke tier has no fault scenario in which the orchestrator waits in the background and its wake never comes. That scenario would prove the idle-orchestrator rule of SPEC.md R64 end to end. Recording it costs a real campaign too.\n\nUntil both land, the rule catches an orchestrator that waits in the background, and PLAYBOOK.md tells the operator to brief foreground waiting. Nothing tells the orchestrator itself.","notes":[],"links":["SAC-067"]},{"id":"SAC-070","title":"make repin cannot pin a sibling's local build","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["b5f5d4e"],"integrated":[],"verified":"dashboards' tests/test_repin_go.py passes all 7 of its tests against this same scripts/repin-go.sh. They pin and name a newer local build, and take CI's under `LOCAL=0`, when CI's is newer, and on a tie. They hold a build awaiting images, and skip one whose commit left the branch. In ui, scripts/repin-npm.test.mjs passes all 17 of its tests against this same scripts/repin-npm.mjs. In a scratch workspace, campaign's copy left out sandbox's newest local build once the sandbox checkout beside it held that commit on no branch. It said so, and took the build CI had made. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"`make repin` now moves each cs- pin to the newer, by commit time, of the sibling's last CI build and its newest local build. It names each pin taken from a local build, and resolves those through the store's module proxy ahead of the usual one. `make repin LOCAL=0` takes CI builds only, and no module is fetched with `GOPROXY=direct` any more. The viewer's @codesweep-ai/ui pin moves the same way, through scripts/repin-npm.mjs. scripts/with-npmrevs.sh serves the npm packages the store holds.","details":"`make repin` moves each codesweep-ai tool pin to the first commit in `built` of its project's status file, and to nothing else. A build that a clean `make ci` recorded in the build store is invisible to it. So a change made across several projects cannot pin its own parts before they are pushed. Every module is also fetched with `GOPROXY=direct`. On a cold cache that reaches every module's source host, and it hung for over seven minutes where one did not answer. The viewer's `@codesweep-ai/ui` pin moves the same way, through `scripts/repin-npm.mjs`, and `scripts/with-npmrevs.sh` serves none of the packages the store holds.","notes":[],"links":[]},{"id":"SAC-071","title":"A -dirty ui pin passes the pin check, and fails only in CI","type":"defect","severity":"low","status":"closed","foundBy":"agent review (session): `npm run registry:pack` on a tree with changes packs a -dirty build, and nothing stops a pin on one before CI fails on it","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["69b23ac"],"integrated":[],"verified":"In a scratch clone, the @codesweep-ai/ui version dispatch-viewer/app/package.json pins was given a `-dirty` suffix. Then `go run scripts/consumer-conventions.go` failed with exit status 1. It said the version is a build of a tree with changes, which no CI ever builds and no other machine can install. With the pin as committed, it passed. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"The pin check rejects a ui version ending in `-dirty` or `+dirty`, and says to pin a build of a commit instead.","details":"`scripts/consumer-conventions.go` accepts any exact version as the ui pin, `-dirty` ones included. `npm run registry:pack` on a tree with changes packs such a build. A pin on one installs on the machine that made it and nowhere else, since no CI ever builds that version. CI then fails with E404, long after the commit.","notes":[],"links":[]},{"id":"SAC-072","title":"make repin can pin a local sandbox build that has no image","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach images (tasks/pin-on-local-builds.md, section 7)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["b5f5d4e"],"integrated":[],"verified":"dashboards' tests/test_repin_go.py passes its image test against this same scripts/repin-go.sh. A build whose entry awaits two images is left out and named until a file for each exists. For real, sandbox's `make ci` at its pushed head recorded the build awaiting sandbox and sandbox-slim. `cs-sandbox build` and `cs-sandbox build --slim` then wrote both files under images/sandbox/. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"sandbox's `make ci` records its build awaiting its two images, and `cs-sandbox build` records each image it makes. The repin takes a local sandbox build only once both are there, and names a newer one still waiting.","details":"The smoke and live tiers boot the image the pinned cs-sandbox names. `make repin` takes sandbox's newest local build as soon as its `make ci` passes, whether or not an image of it exists. CI's status file waits for both images before it lists a commit. A campaign member cannot build a full image at all, since Firecracker needs /dev/kvm.","notes":[],"links":[]},{"id":"SAC-073","title":"The member fetch leaves a delivered build store unmerged","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["0a0d4ce"],"integrated":[],"verified":"TestFetchTakesABuildStoreIn passes under `go test ./cmd/cs-campaign-member/ -count=1`. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"A member fetch of the repository `CS_BUILD_STORE` names takes the teammate's builds into the orchestrator's clone at once (SPEC R119a). That is a fast forward where it took in nothing since, and a merge otherwise. MANUAL.md shows how to give a campaign a shared store.","details":"A campaign's build store is a repository its members hold a clone of, which the orchestrator carries like a project repository (DSH-029). `cs-campaign-member fetch` leaves what it fetched on a remote-tracking ref. So the orchestrator's own store does not see a member's new builds until somebody merges them by hand, and every store push waits on that.","notes":[],"links":[]},{"id":"SAC-074","title":"A campaign cannot pass image stores to its members","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["e0fcd1a"],"integrated":[],"verified":"TestImageStoresReachEveryMember, TestImageStoresRefuseAName and TestImageStoresLeaveTheCampaignIDAlone pass under `go test ./internal/cli/ -count=1`. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"A profile's `imageStores`, in `defaults` or on a member, names shared image stores. Each becomes an `--image-store` on that member's create, and a member's own list replaces the defaults', as `env` does. A profile naming none keeps its campaign ID.","details":"`cs-sandbox create --image-store` mounts a shared image store in a member, which is how an image built on the host reaches a member that cannot build one. A profile has no field for it, so a campaign cannot use it.","notes":[],"links":[]},{"id":"SAC-075","title":"The version checks record nothing of the image members boot","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["e0fcd1a"],"integrated":[],"verified":"TestUpstreamRecordsTheImageMembersBoot, TestUpstreamRecordsTheImageCSSandboxImageNames and TestUpstreamNamesTheBinaryCSSandboxBinPicks pass under `go test ./internal/cli/ -count=1`. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"`UpstreamCheck` and upstream-fingerprint.json record the image members boot, as the host holds it: its reference, podman's ID for it, and the revision its label names. A deviation names the binary it asked, which `CS_SANDBOX_BIN` may pick.","details":"`UpstreamCheck` and `upstream-fingerprint.json` record the cs-sandbox version, and nothing of the image its members boot. Once a local build of a version can be tagged under a localhost/ name, the version alone no longer says which bytes a campaign ran on. The doctor also says `cs-sandbox on PATH` when `CS_SANDBOX_BIN` names another binary.","notes":[],"links":[]},{"id":"SAC-076","title":"The smoke tiers boot only the published image name","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["e0fcd1a"],"integrated":[],"verified":"TestSandboxImagePicksTheImageThisHostHolds passes under `go test ./internal/cli/ -count=1`. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"`SMOKE_IMAGE` and `SBX_IMAGE` come from scripts/sandbox-image.sh. It picks the published image where this host holds it, then the localhost/ build this host holds, and otherwise the published name, which `cs-sandbox build` pulls or builds.","details":"`SMOKE_IMAGE` and `SBX_IMAGE` are the published names `cs-sandbox version --images` prints, passed as `CS_SANDBOX_IMAGE`. An image `cs-sandbox build` makes of an unpublished version is now tagged under localhost/ instead. So a campaign pinned at a local sandbox build rebuilds the image on every run and boots a name no host holds.","notes":[],"links":[]},{"id":"SAC-077","title":"The upgrade steps test the old cs-sandbox pin","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["e0fcd1a"],"integrated":[],"verified":"In a scratch clone at 8fd7503, `make tools` built bin/tools/cs-sandbox at the sandbox version go.mod pins. So a pin moved first is the cs-sandbox `make test-integration` runs. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"CONTRIBUTING.md now has the pin moved in the working tree first. `make test-integration` then runs the new cs-sandbox, which `make tools` builds at that pin, and the pin is committed only once it passes.","details":"CONTRIBUTING.md says to install the new cs-sandbox, run `make test-integration`, and only then move the pin. `make test-integration` runs bin/tools, which `make tools` builds at the pin go.mod names. So the validation step runs the old cs-sandbox, and the new one is never tested before its pin is committed.","notes":[],"links":[]},{"id":"SAC-078","title":"A passing make ci leaves no build a sibling can pin","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["b5f5d4e"],"integrated":[],"verified":"`make ci` at 8fd7503 ended `record-build: recorded campaign 8fd7503 as a local build in ~/.local/share/cs-builds/codesweep-ai (go v0.0.0-20260926051938-8fd75035428e)`. dashboards' tests/test_record_build.py passes all 15 of its tests against this same scripts/record-build.sh, byte for byte. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"A clean, passing `make ci` now records its commit in the owner's build store, `~/.local/share/cs-builds/\u003cowner>/`. It keeps the Go module in the module proxy's layout, the npm packages where the project has them, and an entry naming the versions. A run over uncommitted changes records nothing, and says so.","details":"`make ci` runs every gate CI runs, on this machine, and leaves nothing another project can pin. Pins move only to commits GitHub CI lists as built. So a change across several projects has to be pushed and built one project at a time before the next can pin it. A clean passing run could record its commit as a local build instead: the module zip Go resolves it from, and an entry naming its versions. They would go in a store the sibling projects read. Go and npm builds of a clean commit are byte-identical to CI's. A pin on such a build is therefore the pin CI writes once that commit is pushed.","notes":[],"links":[]},{"id":"SAC-079","title":"make tools builds a cs-sandbox that names codesweep-ai images","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach images (tasks/pin-on-local-builds.md, section 9)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["e0fcd1a"],"integrated":[],"verified":"In a scratch clone at 8fd7503 whose origin is `git@github.com-fork:forker/campaign.git`, `make tools` built a bin/tools/cs-sandbox whose `version --images` names ghcr.io/forker/sandbox. With origin at https://github.com/codesweep-ai/campaign, it names ghcr.io/codesweep-ai/sandbox. GitHub CI's `ci` passed on 8fd7503, once a macOS smoke job was run again: podman there had refused to start a container."},"resolution":"`make tools` links the image owner into cs-sandbox, as sandbox's own Makefile does. It reads the owner from origin, SSH host aliases included, so a fork's tiers look for the fork's images.","details":"`make tools` installs cs-sandbox at the pin with a plain `go install`, so nothing links in the image owner, and it stays `codesweep-ai`. In a fork workspace, bin/tools/cs-sandbox therefore names `ghcr.io/codesweep-ai/sandbox:\u003cversion>` for a version only the fork published, and the tiers boot an image that is not there.","notes":[],"links":[]},{"id":"SAC-080","title":"The claude-subscription replay misses on Claude Code 2.1.283, because the replay credentials name no account","type":"defect","severity":"high","status":"closed","foundBy":"session agent, replaying the cassettes re-recorded for the move to sandbox d9279e7 and Claude Code 2.1.283","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["c8fd7b4","cac0cb2"],"integrated":[],"verified":"`make ci` passed on cac0cb2. TestSmokeReplay/claude-subscription passed, and its cs-vcr summary read 47 requests and 0 misses. The other 8 scenarios passed too."},"resolution":"The cs-vcr ruleset v15 removes the account reminder whole when cutting the address leaves it empty, on both sides of a replay (VCR-042 in cs-vcr). Campaign took it by moving its cs-vcr pin in c8fd7b4 and re-recording in cac0cb2. The fabricated credential tree is unchanged.","details":"Recorded on Claude Code 2.1.283, the claude-subscription scenario fails in `make test-smoke`. Both members miss at their second request with `messages[0].content: 4 items vs 3`, so the campaign never reaches its verdict.\n\nA lent Claude login carries the host's `oauthAccount`, address included, into the member. A recording runs on the real profile, so the member knows an address, and Claude Code writes it into a `# userEmail` section of a system reminder. The recorder, cs-vcr, strips that section and keeps the reminder. The replay's fabricated credential tree holds a token and no account, so the member knows no
