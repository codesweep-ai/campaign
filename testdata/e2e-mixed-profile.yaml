apiVersion: codesweep.ai/v1alpha1
kind: CampaignProfile
defaults:
  engine: firecracker
orchestrator:
  cli: claude
  auth:
    agentLogin:
      - claude
agents:
  claude-worker:
    cli: claude
    auth:
      agentLogin:
        - claude
  codex-worker:
    cli: codex
    auth:
      apiKeyFromEnv:
        - OPENAI_API_KEY
