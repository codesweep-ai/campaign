# Mixed-adapter live smoke used by TestLiveClaudeSmoke (internal/cli/live_claude_test.go).
# The Claude member borrows the host login rather than carrying a copy: it
# holds a loan token, and the credential that rotates stays on the host.
apiVersion: codesweep.ai/v1alpha1
kind: CampaignProfile
defaults:
  engine: firecracker
  resources:
    cpus: 2
    memoryMiB: 2048
orchestrator:
  cli: codex
  auth:
    apiKeyFromEnv: [OPENAI_API_KEY]
agents:
  claude-worker:
    cli: claude
    auth:
      agentLogin: [claude]
