# Build, unit tests, every gate a contributor runs before pushing, and the
# smoke tier.
#
# The smoke job boots real Firecracker microVMs on a hosted runner. That works
# because ubuntu-latest does have /dev/kvm — it is root:kvm and the runner user
# is not in that group, so it reads as absent until the job widens it. What the
# job does not have is a credential, and it needs none: every model call is
# served from the committed cassette by a cs-vcr on the campaign's own fabric.
#
# The integration tier is not here. It talks to real providers and spends real
# money, so it runs by hand on a machine with the logins (CONTRIBUTING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The two tools `make check` shells out to that the Go distribution does
      # not carry. golangci-lint is pinned because it gains checks between
      # releases: unpinned, somebody else's release becomes a red build on a
      # pull request that touched nothing.
      #
      # The cs- tools are not here. They are pinned in go.mod and the gates run
      # them with `go tool`, so `fixtures-check` asks about the same cs-vcr a
      # run would use without anything being installed onto PATH.
      - name: linters
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install golang.org/x/tools/cmd/deadcode@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The same one command a contributor runs before pushing
      # (CONTRIBUTING.md): fmt, vet, the Go linters, the unit tier and all
      # three prose gates. The jobs below run three of those again, on their
      # own, so they answer in seconds and answer when the tests are failing.
      - name: make check
        run: make check

      - name: build
        run: make build-go

      # The tier this leg produced, for the coverage job to merge. Uploaded
      # rather than reported here: the unit tier is one number only once it
      # stands beside the smoke tier, and judging it on its own would measure a
      # slice of the suite instead of the suite.
      - name: keep this leg's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.os }}
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # Schema only: this validates the manifest and does not prove a release
      # can be cut. `make snapshot` does that, locally.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # Its own job, and pinned. What it checks is platform-independent, so it runs
  # once rather than per matrix leg; and these linters gain checks between
  # releases, so an unpinned one turns somebody else's release into a red build
  # on a pull request that touched nothing.
  lint:
    name: lint (go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: go install golang.org/x/tools/cmd/deadcode@latest
      - run: make lint
      - run: make deadcode

  # The prose rules from CONTRIBUTING.md, checked by cs-lint. Its own job
  # because it needs no matrix and builds nothing of this repository, so it
  # answers in a minute and answers even when the tests are failing.
  # cs-lint is installed from source in each of the three jobs below rather
  # than pinned: it is this family's own linter, and a check it gains has to
  # reach here on the day it lands.
  prose:
    name: docs prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make prose

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  # Everything the documents point at, resolved against the tree. It needs
  # no binary either, so it answers beside the prose job rather than after
  # the build.
  refs:
    name: docs refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make refs

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  oss:
    name: open-source readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make oss

  # The documented interface against the real one: every command they name
  # exists, every command the binaries carry is named, the settings the code
  # reads are the settings they list, and a sample output is still what the
  # command prints. It builds first, because every check here asks the binary.
  surface:
    name: docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make surface

  # The ledger's freshness gate. CONTRIBUTING.md asks for a render and a check
  # before every commit that touches ledger/, and nothing enforced it until
  # this job did.
  ledger:
    name: ledger check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make ledger

  # The whole dispatch protocol on real machines, with the model's answers
  # replayed. This is the job that proves the harness rather than its parts: two
  # microVMs boot, the readback runs, the mission opens, the orchestrator drives
  # an agent, and a verdict comes back — for nothing, because cs-vcr serves every
  # call from the cassette and the run holds no credential at all.
  #
  # It needs no checkout of the sibling repositories: cs-sandbox embeds its own
  # image tree and builds the guest image and the Firecracker artifacts itself,
  # and `make tools` builds both at the versions go.mod pins.
  #
  # Those pins, and not @latest, are what this job has to run. `create` refuses a
  # cs-sandbox that is not the one the binary under test was built against, so a
  # job on @latest is green only while nothing has landed in sandbox since the
  # last `make repin` — and red, at the upstream gate, on the first commit that
  # does. Pinning also makes the cache key below a property of this repository
  # rather than of another repository's branch tip.
  smoke:
    name: smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # CS_SANDBOX_IMAGE is NOT set here. cs-sandbox names each image variant
      # after the version that built it, so the reference is derived rather than
      # written down; the tools step below asks the binary for it and exports it
      # for the rest of the job.
      #
      # Out of ~/.cache and into the workspace, so the pack and unpack steps
      # below have a single path to name.
      CS_SANDBOX_FC_CACHE: ${{ github.workspace }}/bin/fc-cache

      # The variant this job can afford, for every `cs-sandbox build` it reaches:
      # the step below, and the one `make setup-smoke` runs if it ever finds this
      # host short. The shipped image is 9.3 GB and a hosted runner does not have
      # the disk — every attempt died partway through `podman build` with "no
      # space left on device". The slim image is the same Containerfile with the
      # developer toolchains dropped.
      #
      # --with-agents is what this repository needs beyond the plain slim image
      # cs-sandbox's own CI uses: every scenario here drives claude, codex or
      # opencode INSIDE the member, and the readback runs `command -v <cli>`
      # before anything else, so a member without them fails before the first
      # dispatch. The mission itself asks only for git and python3, both of which
      # the slim base already carries.
      SANDBOX_BUILD_FLAGS: --engine firecracker --slim --with-agents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Skip the whole job, cheaply, when there is nothing to replay. A
      # repository whose cassette has not been recorded yet cannot be said to
      # have a broken replay, and forty minutes of image building would prove
      # only that.
      #
      # The glob is <scenario>/<member>/index.jsonl, which is the shape
      # `make fixtures` writes and the shape hasCassette globs for in
      # internal/cli/smoke_test.go. One level shallower matches nothing, and a
      # guard that matches nothing skips every step below and still reports a
      # green job in twenty seconds.
      - name: is there a cassette to replay?
        id: cassette
        run: |
          set -euo pipefail
          if compgen -G 'test/cassettes/*/*/index.jsonl' >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no cassette committed; record one with \`make fixtures\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # /dev/kvm is present on these runners but root:kvm, and the runner user
      # is not in that group — so it reads as absent, every microVM skips
      # itself, and that looks exactly like passing.
      - name: host prerequisites
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fakeroot e2fsprogs dnsmasq-base passt socat uidmap iproute2 curl podman
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm || { echo "/dev/kvm still not writable" >&2; exit 1; }

      # `make tools` is the same target a contributor runs: it installs
      # cs-sandbox and cs-vcr at the go.mod pins into bin/tools, static for
      # cs-vcr, and puts the agent tools cs-sandbox ships beside them. Running
      # the target rather than restating it here is what keeps this job and a
      # developer's machine on one surface — including the CGO_ENABLED=0 that
      # keeps cs-vcr runnable inside a distroless container, which is the kind
      # of detail a second copy loses.
      - name: install cs-sandbox and cs-vcr
        id: tools
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          make tools
          echo "$PWD/bin/tools" >> "$GITHUB_PATH"
          # What the cache below is keyed on: the pinned version, so the entry
          # moves when `make repin` moves the pin and not before.
          #
          # NR==1 because `cs-sandbox version` prints the image it names on a
          # second line. Without it $2 is taken from every line, $ver arrives
          # here multi-line, and the write below is rejected as an invalid
          # workflow output rather than as anything about versions.
          ver=$(bin/tools/cs-sandbox version | awk 'NR==1{print $2}')
          # An empty key segment would collapse every sandbox version onto one
          # cache entry, which is the stale image this key exists to prevent.
          test -n "$ver" || { echo "cannot read the cs-sandbox version" >&2; exit 1; }
          echo "sandbox=$ver" >> "$GITHUB_OUTPUT"
          # The image this job builds, boots and saves, asked of the binary that
          # names it rather than written out here. cs-sandbox gives each variant
          # its own package, and `--slim --with-agents` is the only one that can
          # run an agent, so a reference composed by hand here would drift the
          # moment sandbox renamed anything and fail at `command -v claude`.
          #
          # Exported, because it is load-bearing twice: `build` tags it, and the
          # `cs-sandbox create` inside every smoke scenario boots it. Left unset,
          # create would look for the full sandbox image, which this job never
          # builds. It is the published reference rather than a local tag, so
          # the build can pull it where that package is reachable from here; it
          # falls back to building, which is what the old local tag always did.
          image=$(bin/tools/cs-sandbox version --images | awk '$1=="image-slim-agents"{print $2}')
          test -n "$image" || { echo "cannot read the cs-sandbox slim-agents image name" >&2; exit 1; }
          echo "CS_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"

      # Packed, not cached in place. The base rootfs is a 32 GiB file that is
      # almost entirely holes: `tar --sparse` stores it in a few hundred
      # megabytes, where caching the directory itself would hand actions/cache
      # 32 GiB of zeros to store and, on the next run, to write back out onto a
      # runner that has about 21 GB of disk.
      - name: cache the guest image and the Firecracker artifacts
        id: artifacts
        if: steps.cassette.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: bin/ci-artifacts
          key: cs-sandbox-ci-${{ runner.os }}-${{ steps.tools.outputs.sandbox }}

      # SANDBOX_BUILD_FLAGS, set on the job above, is why this asks for the slim
      # image with agents rather than the 9.3 GB one — and the same variable
      # reaches `make setup-smoke` later, so the two cannot ask for different
      # images.
      - name: build the guest image and the Firecracker artifacts
        if: steps.cassette.outputs.present == 'true' && steps.artifacts.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Unquoted on purpose: these are several flags, not one argument.
          # shellcheck disable=SC2086
          cs-sandbox build $SANDBOX_BUILD_FLAGS
          mkdir -p bin/ci-artifacts
          podman save --format oci-archive -o bin/ci-artifacts/image.tar "$CS_SANDBOX_IMAGE"
          tar --sparse -C "$CS_SANDBOX_FC_CACHE" -czf bin/ci-artifacts/fc-artifacts.tar.gz .
          ls -lh bin/ci-artifacts
          # This job died on a full disk for its entire first week, so what it
          # cost is worth a line in the log rather than a bisect next time.
          df -h /

      # `create` checks the image exists before it boots anything, so the microVM
      # path needs it loaded even though it boots from the rootfs and not from
      # podman.
      - name: load the cached guest image and artifacts
        if: steps.cassette.outputs.present == 'true' && steps.artifacts.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          podman load -i bin/ci-artifacts/image.tar
          podman image exists "$CS_SANDBOX_IMAGE"
          mkdir -p "$CS_SANDBOX_FC_CACHE"
          tar -C "$CS_SANDBOX_FC_CACHE" -xzf bin/ci-artifacts/fc-artifacts.tar.gz

      # Both paths land here, so a cache hit is held to the same bar as a build.
      #
      # The agent tools are already in bin/tools — `make tools` put them there
      # beside the cs-sandbox that ships them. What is left is the verdict, and
      # it is a gate here rather than the report `make setup-smoke` prints: a
      # developer's machine that cannot boot a microVM should skip the tier, and
      # this one is built to run it, so anything short of ready is a failure.
      - name: the artifacts this host will boot
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          cs-sandbox doctor --engine firecracker

      # All five scenarios. opencode-fireworks was left out here for a member
      # that never got its turn started on a two-core runner: it sat out the
      # whole 300s settling window and took the run to 1250s before the tier
      # gave up. The cause it is back on is cs-sandbox SBX-023 — a turn used to
      # boot a second opencode server to mint a session id, and one that died
      # in that window left it holding the port. Two servers is also about 2 GiB
      # in a member given 2048 MiB, which a hosted runner feels and a developer
      # machine does not.
      #
      # That is a mechanism rather than a measurement: the stall was never
      # reproduced on a machine with room, so this job is where the fix is
      # actually tested. The step below is what makes a relapse legible.
      - name: smoke
        if: steps.cassette.outputs.present == 'true'
        run: make test-smoke

      # Why a member went quiet, for the failure modes this tier cannot explain
      # from its own output. A turn is dispatched with `-b`, so the agent
      # driver's exit code is never read and a failed turn reads as a node that
      # stopped; the reason is on the host, in the log the remote tool keeps,
      # and a run that keeps evidence collects it per member. The proxy
      # directory carries the other half: cs-vcr's whole log, and the request it
      # could not serve, written in the same normalized form the cassette stores
      # so `cs-vcr calibrate` can read it. Without this the runner deletes both.
      - name: keep the evidence of a failed run
        if: failure() && steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence
          path: |
            .tmp/live-evidence/
            .tmp/live-proxy/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: keep this job's coverage
        if: steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # The behaviour map is committed, and it is a pure function of the rubric and
  # the run records. A stale page is a merge gate rather than a confusing diff
  # somebody finds later.
  covmap:
    name: behaviour map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: the committed page is what the rubric renders
        run: |
          set -euo pipefail
          go test ./internal/covmap/... -run TestCoverageHTMLCurrent -count=1
          git diff --exit-code -- covmap/

  # One number for the whole run, and the gate that keeps it honest.
  #
  # Every job above uploads its tier rather than judging it, because each sees
  # only the part of the suite it ran: the unit leg never boots a machine, and
  # the smoke job never runs the unit tier. Merged here they are one picture,
  # which is the only one worth reporting or gating on.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [build-test, smoke]
    if: always() && needs.build-test.result == 'success'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: collect every tier
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: .coverage-artifacts

      # Unpacked side by side as <tier>@<job> rather than merged into one
      # directory per tier: covdata data files are named after a build hash, so
      # two jobs' files would collide on name while differing in content.
      # scripts/coverage.sh treats every <tier>@* directory as that tier.
      #
      # Found by searching rather than by walking one fixed level down, because
      # download-artifact does not always put an artifact in a directory of its
      # own: it unpacks straight into `path` when exactly one artifact matched
      # the pattern. So the depth here depends on how many jobs uploaded, and a
      # loop written for the many-artifact shape silently assembles nothing on
      # the day only one did.
      - name: assemble the tiers
        run: |
          set -euo pipefail
          mkdir -p .coverage
          while IFS= read -r dir; do
            tier=$(basename "$dir")
            job=$(basename "$(dirname "$dir")"); job=${job#coverage-}
            # The flat shape above: the tier's parent is the download root
            # itself, which names no job, so the tier names it.
            [ "$job" = ".coverage-artifacts" ] && job=$tier
            cp -a "$dir" ".coverage/$tier@$job"
          done < <(find .coverage-artifacts -type d \( -name unit -o -name smoke \) | sort)
          echo "tier directories assembled:"
          find .coverage -mindepth 1 -maxdepth 1 -type d -printf '  %f\n' | sort

      # Prints the aggregate to the job summary and fails if a package the
      # baseline records has stopped being reached by the tier that reached it.
      - name: report and gate
        run: make coverage-check
