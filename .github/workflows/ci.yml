# Build, unit tests, every gate a contributor runs before pushing, and the
# smoke tier — on every host this product is built and driven from.
#
# The smoke tier runs three times, and the three answer different questions.
# One boots real Firecracker microVMs on a hosted runner; one runs the same six
# campaigns as podman containers on the same runner image; one runs them on the
# self-hosted macOS arm64 host, the only kind that can boot a real
# engine at all. None of them holds a credential and none needs one: every model
# call is served from the committed cassette by a cs-vcr on the campaign's own
# fabric.
#
# Two engines rather than one, because the profile field that chooses between
# them is a documented product surface (`defaults.engine`) and only one half of
# it was ever tested. A cassette does not care which: the engine reaches the
# campaign ID and nothing a model is shown, and the recorder blanks that ID and
# every name derived from it. What the second engine costs is minutes; what it
# buys is that `engine: podman` is run rather than only accepted.
#
# The macOS leg is podman for a harder reason: macOS has no KVM, so a microVM is
# not on offer there. It is the only tier that exercises the macOS host paths
# under a real engine — ~/Library/Application Support as a state root, the
# podman machine, and every path a member is given having to live under $HOME.
#
# Every hosted job here names ubuntu-26.04 rather than ubuntu-latest, and the
# reason is the podman that image carries. The recorder joins the campaign's own
# network and a member reaches this host at the address pasta publishes, and
# podman below 5.0 puts pasta on a container's own network mode but never on the
# shared rootless namespace. ubuntu-latest is 24.04, whose podman GitHub
# downgraded below that line, so a fabric built there has no route back to the
# host at all. cs-sandbox pins the same image for the same reason.
#
# Every smoke job waits on build-test, all four legs of it. The tier boots real
# machines and takes tens of minutes; a branch whose unit tests are red has
# nothing to learn from it, and the runners it would occupy are shared with the
# sibling project.
#
# The integration tier is not here. It talks to real providers and spends real
# money, so it runs by hand on a machine with the logins (CONTRIBUTING.md).
name: ci

on:
  push:
    # main only. A push event runs the workflow file from the PUSHED REF, so a
    # side branch can opt itself in by naming itself here — and one did, which
    # is how a work-in-progress branch started spending the self-hosted runners
    # on every commit. A branch that wants a run asks for one: `gh workflow run
    # ci.yml --ref <branch>`, which works because main registers the dispatch
    # trigger below.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One matrix for every host this binary is built and driven from, WSL
  # included. It takes two accommodations: setup-go installs on the Windows side
  # and is invisible inside the distro, so WSL builds its own toolchain; and
  # each step runs under matrix.shell, which is plain bash everywhere except
  # WSL, where it is wsl-bash. Everything between those two points is the same
  # commands on all four, which is the reason to keep them in one job rather
  # than four.
  #
  # The gates that read the same on every host — formatting, the Go linters,
  # the prose and document gates, the release manifest — run on the ubuntu leg
  # alone, as `make check`. Three more copies of a platform-independent report
  # is three times the log to read and nothing more.
  build-test:
    name: build-test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            label: ubuntu-26.04
            # Artifact names take neither "/" nor a space, both of which
            # matrix.label carries, so the coverage artifact is named with this.
            covlabel: ubuntu-26.04
            shell: bash
          # An array, not a label string: self-hosted runners are selected by
          # ANDing labels, and these three are the ones the runner registers
          # automatically. That machine runs a pool for this repository and
          # another for the sibling project; the two are separate registrations
          # on the same machine, so no custom label is needed to tell them
          # apart — a runner only ever takes jobs from the repository it is
          # registered to.
          - os: [self-hosted, macOS, ARM64]
            label: macos-arm64 / self-hosted
            covlabel: macos-arm64-self-hosted
            shell: bash
          - os: macos-15-intel
            label: macos-15-intel
            covlabel: macos-15-intel
            shell: bash
          - os: windows-2025
            label: windows-2025 / WSL2
            covlabel: windows-2025-wsl2
            shell: wsl-bash {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # The shell has to be set HERE and not per step: `steps.*.shell` accepts no
    # context at all ("no context is available here"), so `${{ matrix.shell }}`
    # on a step makes the whole file invalid — GitHub then reports a run with
    # zero jobs, which looks alarmingly like nothing ran. defaults.run.shell is
    # evaluated after the matrix expands, so the expression is allowed here.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      # FIRST, before checkout, so a fork's code never reaches the self-hosted
      # machine's disk. This is an ACCIDENT guard, not a security boundary: a
      # `pull_request` workflow runs from the PR's merge commit, so a hostile
      # fork can simply delete this step. What actually protects that machine is
      # the repository's "require approval for all external contributors"
      # setting — no fork PR runs anything until a maintainer approves it. This
      # catches the case where that setting is loosened by mistake.
      #
      # It fails rather than skips because a matrix leg cannot skip itself, and
      # a green check that silently tested nothing is worse than a red one.
      - name: refuse fork PRs on the self-hosted runner
        if: matrix.label == 'macos-arm64 / self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork PR from ${{ github.event.pull_request.head.repo.full_name }} — refusing to run on the self-hosted runner" >&2
          exit 1

      - uses: actions/checkout@v7

      # Module caching off for the self-hosted leg only. setup-go restores into
      # ~/go/pkg/mod, and Go makes everything it puts there read-only. A hosted
      # runner starts with that directory empty so the restore is unopposed; the
      # self-hosted host already has it populated from an earlier job, so tar hits
      # hundreds of files it cannot unlink and the restore fails outright.
      # The cache exists to fake persistence across throwaway VMs — a runner
      # that genuinely persists already has the thing being faked.
      - uses: actions/setup-go@v7
        if: runner.os != 'Windows'
        with:
          go-version-file: go.mod
          cache: ${{ matrix.label != 'macos-arm64 / self-hosted' }}

      - uses: Vampire/setup-wsl@v7
        if: runner.os == 'Windows'
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      # The distro is bare, so this is what actions/setup-go does for the others:
      # a Go toolchain (Ubuntu 24.04 ships 1.22 and go.mod needs 1.27) plus gcc,
      # without which cgo-enabled builds cannot compile at all. The symlink puts
      # go on PATH for every later step, so none of them has to know which host
      # it is on.
      - name: toolchain
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # libc6-dev, not just gcc: --no-install-recommends leaves gcc without
          # the C standard library headers, and a BROKEN compiler is worse than
          # none. With no gcc at all Go sets CGO_ENABLED=0 and everything builds;
          # with gcc present it enables cgo, then dies on `fatal error:
          # stdlib.h: No such file or directory` — in `go vet`, not just a build.
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git make gcc libc6-dev
          # The version go.mod names rather than the latest stable: the day a new
          # Go ships, "latest" would put this one leg on a toolchain no other job
          # is running.
          ver="go$(awk '/^go [0-9]/ { print $2; exit }' go.mod)"
          curl -fsSL "https://go.dev/dl/${ver}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          ln -sf /usr/local/go/bin/go /usr/bin/go
          go version

      # No linter install step: golangci-lint, deadcode and actionlint are pinned
      # as Go tools, so the gates build them from the module cache at the
      # versions this repository records. An unpinned linter would turn somebody
      # else's release into a red build on a pull request that touched nothing.

      # The same one command a contributor runs before pushing
      # (CONTRIBUTING.md): fmt, vet, the Go linters, the unit tier and all
      # three prose gates. The jobs below run three of those again, on their
      # own, so they answer in seconds and answer when the tests are failing.
      #
      # The ubuntu leg alone, because everything it adds over the steps below is
      # platform-independent — and because two of its gates are not: `make
      # surface` compares the committed documents against a built binary, and
      # `make coverage-check` reads a baseline recorded on one host.
      - name: make check
        if: matrix.label == 'ubuntu-26.04'
        run: make check

      # What the other three legs run instead: the compiler and the unit tier,
      # which are the two things a second operating system can disagree about.
      - name: vet
        if: matrix.label != 'ubuntu-26.04'
        run: go vet ./...

      # The live tiers can't run on every host, but they must still compile
      # everywhere, so a refactor cannot silently break them. Both tags, and on
      # every leg: `make check`'s linter reads the smoke tag only, so nothing
      # else in this workflow compiles the integration files at all.
      - name: vet (integration build tag)
        run: go vet -tags integration ./...

      - name: vet (smoke build tag)
        run: go vet -tags smoke ./...

      - name: test
        if: matrix.label != 'ubuntu-26.04'
        run: make test

      - name: build
        run: make build-go

      # The tier this leg produced, for the coverage job to merge. Uploaded
      # rather than reported here: the unit tier is one number only once it
      # stands beside the smoke tier, and judging it on its own would measure a
      # slice of the suite instead of the suite.
      - name: keep this leg's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.covlabel }}
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # Schema only: this validates the manifest and does not prove a release
      # can be cut. `make snapshot` does that, locally. Once, on ubuntu: the
      # manifest is platform-independent.
      - name: goreleaser check
        if: matrix.label == 'ubuntu-26.04'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # Its own job, and pinned. What it checks is platform-independent, so it runs
  # once rather than per matrix leg; and these linters gain checks between
  # releases, so an unpinned one turns somebody else's release into a red build
  # on a pull request that touched nothing.
  lint:
    name: lint (go)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: make deadcode

  # An invalid workflow file fails the run with zero jobs and no annotation in
  # the API, which is the least legible failure the forge produces. actionlint
  # is pinned as a Go tool in go.mod, so a clean `make actionlint` on a laptop
  # means a clean one here. Extra runner labels it does not know about live in
  # .github/actionlint.yaml.
  actionlint:
    name: workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make actionlint

  # The prose rules from CONTRIBUTING.md, checked by cs-lint. Its own job
  # because it needs no matrix and builds nothing of this repository, so it
  # answers in a minute and answers even when the tests are failing.
  # cs-lint is installed from source in each of the three jobs below rather
  # than pinned: it is this family's own linter, and a check it gains has to
  # reach here on the day it lands.
  prose:
    name: docs prose
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make prose

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  # Everything the documents point at, resolved against the tree. It needs
  # no binary either, so it answers beside the prose job rather than after
  # the build.
  refs:
    name: docs refs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make refs

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  oss:
    name: open-source readiness
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make oss

  # The documented interface against the real one: every command they name
  # exists, every command the binaries carry is named, the settings the code
  # reads are the settings they list, and a sample output is still what the
  # command prints. It builds first, because every check here asks the binary.
  surface:
    name: docs surface
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make surface

  # The ledger's freshness gate. CONTRIBUTING.md asks for a render and a check
  # before every commit that touches ledger/, and nothing enforced it until
  # this job did.
  ledger:
    name: ledger check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make ledger

  # The committed viewer page is what dispatch-viewer/app builds.
  #
  # `make viewer` skips when npm is absent, so a clone with Go alone still
  # builds, and no other job here runs Node at all. Nothing would notice a page
  # that stopped matching its sources. This job rebuilds it and compares.
  viewer:
    name: viewer page is current
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13" # dispatch-viewer/app says >=22.13; the floor is what CI proves
          cache: npm
          cache-dependency-path: dispatch-viewer/app/package-lock.json
      - run: make viewer-check

  # The whole dispatch protocol on real machines, with the model's answers
  # replayed. This is the job that proves the harness rather than its parts: two
  # microVMs boot, the readback runs, the mission opens, the orchestrator drives
  # an agent, and a verdict comes back — for nothing, because cs-vcr serves every
  # call from the cassette and the run holds no credential at all.
  #
  # The engine here is firecracker, which is this product's own: a member is a
  # machine of its own, with its own kernel, reached over a vsock bridge. The two
  # podman tiers below say nothing about that path, and it says nothing about
  # theirs.
  #
  # It needs no checkout of the sibling repositories: cs-sandbox embeds its own
  # image tree and builds the guest image and the Firecracker artifacts itself,
  # and `make tools` builds both at the versions go.mod pins.
  #
  # Those pins, and not @latest, are what this job has to run. `create` refuses a
  # cs-sandbox that is not the one the binary under test was built against, so a
  # job on @latest is green only while nothing has landed in sandbox since the
  # last `make repin` — and red, at the upstream gate, on the first commit that
  # does. Pinning also makes the cache key below a property of this repository
  # rather than of another repository's branch tip.
  smoke-firecracker:
    name: smoke firecracker (${{ matrix.scenario }})
    # The unit tier first, all four hosts of it. This one boots two microVMs per
    # leg and can spend forty minutes building an image before it does; a branch
    # that does not compile has nothing to learn from that.
    needs: [build-test]
    runs-on: ubuntu-26.04
    # Per LEG, not for the tier. One scenario is minutes; a scenario that stalls
    # spends the readback ceiling and then stops, and the legs beside it are
    # unaffected because each has its own runner and its own budget. Six of
    # these run at once, so the tier costs its slowest leg rather than the sum
    # of all of them — and every leg reports, where one job serially left four
    # scenarios unrun behind the first failure.
    timeout-minutes: 25
    strategy:
      # Every leg reports. Stopping the others on the first failure is what
      # made the single job hard to read: the interesting question is which
      # scenarios fail, and that is only answerable when they all run.
      fail-fast: false
      matrix:
        # Held against internal/cli/livecampaign_test.go's scenarios() by
        # TestWorkflowRunsEveryScenario, so a scenario added there cannot
        # quietly stop being run here.
        scenario:
          - claude-subscription
          - claude-api-key
          - codex-subscription
          - codex-api-key
          - opencode-fireworks
          - claude-inherit
    env:
      # CS_SANDBOX_IMAGE is NOT set here. cs-sandbox names each image variant
      # after the version that built it, so the reference is derived rather than
      # written down; the tools step below asks the binary for it and exports it
      # for the rest of the job.
      #
      # Out of ~/.cache and into the workspace, so the pack and unpack steps
      # below have a single path to name.
      CS_SANDBOX_FC_CACHE: ${{ github.workspace }}/bin/fc-cache

      # The variant this job can afford, for every `cs-sandbox build` it reaches:
      # the step below, and the one `make setup-smoke` runs if it ever finds this
      # host short. The shipped image is 9.3 GB and a hosted runner does not have
      # the disk — every attempt died partway through `podman build` with "no
      # space left on device". The slim image is the same Containerfile with the
      # developer toolchains dropped.
      #
      # The slim image carries claude, codex and opencode outright, so --slim is
      # the whole request. It used to take `--slim --with-agents`: cs-sandbox
      # published an agent-free slim variant as well, and this repository always
      # wanted the other one, because every scenario here drives an agent INSIDE
      # the member and the readback runs `command -v <cli>` before anything else.
      # That variant is gone — one slim image now, agents included — so asking
      # for it is both unnecessary and an unknown flag. The mission itself asks
      # only for git and python3, both of which the slim base already carries.
      #
      # The build is mostly a PULL now: cs-sandbox builds the image in three
      # tiers and only the last is made here, on top of published ones. What that
      # costs this job is bandwidth rather than the minutes of `podman build` it
      # used to spend.
      SANDBOX_BUILD_FLAGS: --engine firecracker --slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Skip the whole job, cheaply, when there is nothing to replay. A
      # repository whose cassette has not been recorded yet cannot be said to
      # have a broken replay, and forty minutes of image building would prove
      # only that.
      #
      # The glob is <scenario>/<member>/index.jsonl, which is the shape
      # `make record-fixtures` writes and the shape hasCassette globs for in
      # internal/cli/smoke_test.go. One level shallower matches nothing, and a
      # guard that matches nothing skips every step below and still reports a
      # green job in twenty seconds.
      - name: is there a cassette to replay?
        id: cassette
        run: |
          set -euo pipefail
          if compgen -G "test/cassettes/${{ matrix.scenario }}/*/index.jsonl" >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no cassette for ${{ matrix.scenario }}; record one with \`./scripts/record-fixtures.sh ${{ matrix.scenario }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # /dev/kvm is present on these runners but root:kvm, and the runner user
      # is not in that group — so it reads as absent, every microVM skips
      # itself, and that looks exactly like passing.
      - name: host prerequisites
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fakeroot e2fsprogs dnsmasq-base passt socat uidmap iproute2 curl podman
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm || { echo "/dev/kvm still not writable" >&2; exit 1; }
          # What this leg actually has, recorded rather than assumed. Each
          # member asks for 2 vCPUs and 2 GiB and there are two of them, so
          # whether the host oversubscribes is the first question any stalled
          # turn raises — and the comments here have outlived at least one
          # change to what a hosted runner is.
          printf 'runner: %s cpu(s), %s\n' "$(nproc)" "$(free -h | awk '/^Mem:/{print $2" RAM"}')"

      # `make tools` is the same target a contributor runs: it installs
      # cs-sandbox and cs-vcr at the go.mod pins into bin/tools, static for
      # cs-vcr, and puts the agent tools cs-sandbox ships beside them. Running
      # the target rather than restating it here is what keeps this job and a
      # developer's machine on one surface — including the CGO_ENABLED=0 that
      # keeps cs-vcr runnable inside a distroless container, which is the kind
      # of detail a second copy loses.
      # TEMPORARY, and it answers one question: what IS podman's rootless
      # network on this runner, before and after the image build?
      #
      # The doctor below reports that nothing answers at 169.254.1.2, which only
      # pasta publishes. cs-sandbox's own CI gets pasta on this exact image and
      # boots microVMs with it, so the difference is something about THIS job —
      # and the one structural difference is that this runner both builds the
      # image and probes, where sandbox splits those across two jobs. Printed
      # twice for that reason. Remove once it has been read.
      #
      # Every command tolerates failure: a diagnostic must not decide a job.
      - name: rootless network before the build
        if: steps.cassette.outputs.present == 'true'
        run: |
          podman info --format 'backend={{.Host.NetworkBackend}} rootless={{.Host.Security.Rootless}}' || true
          podman info --format 'rootlessNetworkCmd={{.Host.RootlessNetworkCmd}}' || true
          podman unshare --rootless-netns ip -br addr || true
          pgrep -a pasta || echo "no pasta process"
          pgrep -a slirp4netns || echo "no slirp4netns process"

      - name: install cs-sandbox and cs-vcr
        id: tools
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          make tools
          echo "$PWD/bin/tools" >> "$GITHUB_PATH"
          # What the cache below is keyed on: the pinned version, so the entry
          # moves when `make repin` moves the pin and not before.
          #
          # NR==1 because `cs-sandbox version` prints the image it names on a
          # second line. Without it $2 is taken from every line, $ver arrives
          # here multi-line, and the write below is rejected as an invalid
          # workflow output rather than as anything about versions.
          ver=$(bin/tools/cs-sandbox version | awk 'NR==1{print $2}')
          # An empty key segment would collapse every sandbox version onto one
          # cache entry, which is the stale image this key exists to prevent.
          test -n "$ver" || { echo "cannot read the cs-sandbox version" >&2; exit 1; }
          echo "sandbox=$ver" >> "$GITHUB_OUTPUT"
          # The image this job builds, boots and saves, asked of the binary that
          # names it rather than written out here. cs-sandbox gives each variant
          # its own package, so a reference composed by hand here would drift the
          # moment sandbox renamed anything and fail at `command -v claude`.
          #
          # Exported, because it is load-bearing twice: `build` tags it, and the
          # `cs-sandbox create` inside every smoke scenario boots it. Left unset,
          # create would look for the full sandbox image, which this job never
          # builds. It is the published reference rather than a local tag, so
          # the build can pull it where that package is reachable from here; it
          # falls back to building, which is what the old local tag always did.
          #
          # image-slim, not image-slim-agents: that label named the agent-free
          # variant's counterpart and both are now one image. The name still
          # exists on ghcr as a TIER cs-sandbox builds on — `version --images`
          # lists it as tier-slim-agents — and that one has no /sandbox and no
          # entrypoint, so it cannot boot. Asking for the wrong one fails late.
          image=$(bin/tools/cs-sandbox version --images | awk '$1=="image-slim"{print $2}')
          test -n "$image" || { echo "cannot read the cs-sandbox slim image name" >&2; exit 1; }
          echo "CS_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"

      # Packed, not cached in place. The base rootfs is a 32 GiB file that is
      # almost entirely holes: `tar --sparse` stores it in a few hundred
      # megabytes, where caching the directory itself would hand actions/cache
      # 32 GiB of zeros to store and, on the next run, to write back out onto a
      # runner that has about 21 GB of disk.
      - name: cache the guest image and the Firecracker artifacts
        id: artifacts
        if: steps.cassette.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: bin/ci-artifacts
          key: cs-sandbox-ci-${{ runner.os }}-${{ steps.tools.outputs.sandbox }}

      # SANDBOX_BUILD_FLAGS, set on the job above, is why this asks for the slim
      # image with agents rather than the 9.3 GB one — and the same variable
      # reaches `make setup-smoke` later, so the two cannot ask for different
      # images.
      - name: build the guest image and the Firecracker artifacts
        if: steps.cassette.outputs.present == 'true' && steps.artifacts.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Unquoted on purpose: these are several flags, not one argument.
          # shellcheck disable=SC2086
          cs-sandbox build $SANDBOX_BUILD_FLAGS
          mkdir -p bin/ci-artifacts
          podman save --format oci-archive -o bin/ci-artifacts/image.tar "$CS_SANDBOX_IMAGE"
          tar --sparse -C "$CS_SANDBOX_FC_CACHE" -czf bin/ci-artifacts/fc-artifacts.tar.gz .
          ls -lh bin/ci-artifacts
          # This job died on a full disk for its entire first week, so what it
          # cost is worth a line in the log rather than a bisect next time.
          df -h /

      # `create` checks the image exists before it boots anything, so the microVM
      # path needs it loaded even though it boots from the rootfs and not from
      # podman.
      - name: load the cached guest image and artifacts
        if: steps.cassette.outputs.present == 'true' && steps.artifacts.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          podman load -i bin/ci-artifacts/image.tar
          podman image exists "$CS_SANDBOX_IMAGE"
          mkdir -p "$CS_SANDBOX_FC_CACHE"
          tar -C "$CS_SANDBOX_FC_CACHE" -xzf bin/ci-artifacts/fc-artifacts.tar.gz

      # The same questions once the image has been built, so the two readings
      # can be compared. See the note above.
      - name: rootless network after the build
        if: steps.cassette.outputs.present == 'true'
        run: |
          podman info --format 'backend={{.Host.NetworkBackend}} rootless={{.Host.Security.Rootless}}' || true
          podman info --format 'rootlessNetworkCmd={{.Host.RootlessNetworkCmd}}' || true
          podman unshare --rootless-netns ip -br addr || true
          pgrep -a pasta || echo "no pasta process"
          pgrep -a slirp4netns || echo "no slirp4netns process"
          # And the probe the doctor makes, by hand, so its answer is visible
          # next to the state above rather than only as a verdict.
          python3 -m http.server 18099 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          podman unshare --rootless-netns curl -s -o /dev/null -w 'probe=%{http_code}\n' \
            --max-time 3 http://169.254.1.2:18099/ || echo "probe: curl failed"
          kill %1 || true

      # Both paths land here, so a cache hit is held to the same bar as a build.
      #
      # The agent tools are already in bin/tools — `make tools` put them there
      # beside the cs-sandbox that ships them. What is left is the verdict, and
      # it is a gate here rather than the report `make setup-smoke` prints: a
      # developer's machine that cannot boot a microVM should skip the tier, and
      # this one is built to run it, so anything short of ready is a failure.
      - name: the artifacts this host will boot
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          cs-sandbox doctor --engine firecracker

      # All six scenarios. opencode-fireworks was left out here for a member
      # that never got its turn started on a two-core runner: it sat out the
      # whole 300s settling window and took the run to 1250s before the tier
      # gave up. The cause it is back on is cs-sandbox SBX-023 — a turn used to
      # boot a second opencode server to mint a session id, and one that died
      # in that window left it holding the port. Two servers is also about 2 GiB
      # in a member given 2048 MiB, which a hosted runner feels and a developer
      # machine does not.
      #
      # That is a mechanism rather than a measurement: the stall was never
      # reproduced on a machine with room, so this job is where the fix is
      # actually tested. The step below is what makes a relapse legible.
      - name: smoke
        if: steps.cassette.outputs.present == 'true'
        run: make test-smoke SMOKE_TESTS='TestSmokeReplay/${{ matrix.scenario }}'

      # A leg whose cassette is missing skips every step above and would report
      # green, which is the "recorded none and looked like recorded all" failure
      # this tier exists to avoid. Named here rather than inside the test: a Go
      # -run that matches nothing is not an error, so nothing in the test can
      # tell the difference.
      - name: a leg with no cassette is not a pass
        if: steps.cassette.outputs.present != 'true'
        run: |
          echo "no cassette for ${{ matrix.scenario }} — it was not replayed" >&2
          exit 1

      # Why a member went quiet, for the failure modes this tier cannot explain
      # from its own output. A turn is dispatched with `-b`, so the agent
      # driver's exit code is never read and a failed turn reads as a node that
      # stopped; the reason is on the host, in the log the remote tool keeps,
      # and a run that keeps evidence collects it per member. The proxy
      # directory carries the other half: cs-vcr's whole log, and the request it
      # could not serve, written in the same normalized form the cassette stores
      # so `cs-vcr calibrate` can read it. Without this the runner deletes both.
      - name: keep the evidence of a failed run
        if: failure() && steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence-${{ matrix.scenario }}
          path: |
            .tmp/live-evidence/
            .tmp/live-proxy/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: keep this job's coverage
        if: steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-${{ matrix.scenario }}
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # The same six campaigns, run as containers instead of microVMs.
  #
  # `defaults.engine` takes firecracker or podman, both are documented, and only
  # one of them was ever run. This job is the other half. It is not a second
  # copy of the tier above: what a member does inside a microVM and inside a
  # container differ in the parts this product is made of — how a member is
  # reached, how the fabric resolves a name, where a credential lender sits —
  # and every one of those is on the path between the orchestrator and a verdict.
  #
  # It is also the tier the macOS arm64 leg below runs, on a host with no KVM, so a
  # failure here and a failure there can be told apart: same engine, different
  # architecture and operating system.
  #
  # Cheaper than the firecracker tier by a lot. There is no rootfs to derive and
  # no artifacts to cache — the image is pulled and that is the whole setup —
  # which is why this job has no cache step and takes minutes rather than tens
  # of them.
  smoke-podman:
    name: smoke podman (${{ matrix.scenario }})
    needs: [build-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      # Every leg reports, for the same reason as the tier above: the
      # interesting question is which scenarios fail.
      fail-fast: false
      matrix:
        # Held against internal/cli/livecampaign_test.go's scenarios() by
        # TestWorkflowRunsEveryScenario, so a scenario added there cannot
        # quietly stop being run here.
        scenario:
          - claude-subscription
          - claude-api-key
          - codex-subscription
          - codex-api-key
          - opencode-fireworks
          - claude-inherit
    env:
      # The one line that makes this job the other engine. It reaches the
      # profile the tier renders (CS_CAMPAIGN_ENGINE), the doctor `make
      # setup-smoke` asks, and the /dev/kvm precondition that asks — which a
      # podman run must not, because a container needs no hypervisor.
      SMOKE_ENGINE: podman
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Skip the whole job, cheaply, when there is nothing to replay. Same
      # reasoning and the same glob as the firecracker tier above.
      - name: is there a cassette to replay?
        id: cassette
        run: |
          set -euo pipefail
          if compgen -G "test/cassettes/${{ matrix.scenario }}/*/index.jsonl" >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no cassette for ${{ matrix.scenario }}; record one with \`./scripts/record-fixtures.sh ${{ matrix.scenario }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # No /dev/kvm here, and nothing that only a microVM needs: no fakeroot, no
      # mke2fs, no dnsmasq. What is left is what a rootless container fabric
      # takes — passt for the rootless network namespace, newuidmap to map it —
      # plus the podman the runner image already carries, printed rather than
      # trusted.
      - name: host prerequisites
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            passt uidmap iproute2 curl podman
          podman --version
          printf 'runner: %s cpu(s), %s\n' "$(nproc)" "$(free -h | awk '/^Mem:/{print $2" RAM"}')"

      # The same target a contributor runs, at the go.mod pins. See the
      # firecracker job above for why the pins and not @latest.
      - name: install cs-sandbox and cs-vcr
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          make tools
          echo "$PWD/bin/tools" >> "$GITHUB_PATH"
          # The image this job boots, asked of the binary that names it. See the
          # firecracker job: image-slim is the bootable slim variant, and the
          # tier-* labels beside it are the tiers it is built on.
          image=$(bin/tools/cs-sandbox version --images | awk '$1=="image-slim"{print $2}')
          test -n "$image" || { echo "cannot read the cs-sandbox slim image name" >&2; exit 1; }
          echo "CS_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"

      # A pull rather than a build: the slim image is published for this
      # architecture at the tag the pin names, and `cs-sandbox build` fetches it
      # when it is there. Named as its own step so its minutes are legible, and
      # so `make setup-smoke` below finds the host ready and does nothing.
      #
      # The doctor is a gate here rather than the report setup-smoke prints: a
      # developer's machine that cannot boot is entitled to skip the tier, and
      # this one is built to run it, so anything short of ready is a failure.
      #
      # It can be a gate here because this runner is this job's alone. The same
      # command is NOT a gate on the macOS arm64 host, where three scenarios share a
      # machine and the doctor answers for all of them.
      - name: the image this host will boot
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          cs-sandbox build --engine podman --slim
          cs-sandbox doctor --engine podman
          df -h /

      - name: smoke
        if: steps.cassette.outputs.present == 'true'
        run: make test-smoke SMOKE_TESTS='TestSmokeReplay/${{ matrix.scenario }}'

      # A leg whose cassette is missing skips every step above and would report
      # green, which is the "recorded none and looked like recorded all" failure
      # this tier exists to avoid.
      - name: a leg with no cassette is not a pass
        if: steps.cassette.outputs.present != 'true'
        run: |
          echo "no cassette for ${{ matrix.scenario }} — it was not replayed" >&2
          exit 1

      # Why a member went quiet, kept for the same reasons as the firecracker
      # tier's: the driver log per member, and cs-vcr's own log with the request
      # it could not serve.
      - name: keep the evidence of a failed run
        if: failure() && steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-podman-evidence-${{ matrix.scenario }}
          path: |
            .tmp/live-evidence/
            .tmp/live-proxy/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: keep this job's coverage
        if: steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-podman-${{ matrix.scenario }}
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # The arm64 image, built on the machine that boots it.
  #
  # The hosted jobs pull the slim image at the tag the pin names. That image is
  # x86_64: the sibling project publishes its leaf from a hosted runner, so only
  # the TIERS underneath it are multi-arch. Pulled here it would have this
  # machine running an emulated guest, which is the one thing an arm64 leg
  # exists to avoid — measured, and it fails outright: the lender container dies
  # as "executable file `cs-sandbox` not found in $PATH" because the amd64 image
  # cannot even be entered.
  #
  # So the leaf is built here instead, on top of the arm64 tiers, under a
  # LOCAL tag. The tag is what makes it a build rather than a pull: `cs-sandbox
  # build` fetches the published reference when it names one, and a
  # localhost/… name has nothing to fetch. It is also a name of this
  # repository's own, so it cannot be confused with the sibling project's
  # :ci-arm64 on the same machine and in the same store.
  #
  # It waits for nothing, exactly as the sibling project's does, so the image is
  # ready by the time build-test finishes. The legs that consume it gate on
  # build-test themselves, so a red unit tier still runs no campaign.
  #
  # One writer at a time. Two runs building the same tag into one podman store
  # concurrently is undefined, and the loser would boot whatever the winner
  # left. Queued rather than cancelled: the second run still has to be tested.
  image-macos-arm64:
    name: image (macos-arm64 / self-hosted)
    # Skips cleanly for fork PRs, like every other job on this machine. The
    # repository's "require approval for all external contributors" setting is
    # what actually protects it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    concurrency:
      group: macos-arm64-campaign-image
      cancel-in-progress: false
    env:
      CS_SANDBOX_IMAGE: localhost/campaign-slim:ci-arm64
    steps:
      - uses: actions/checkout@v7
      # Off for the same reason as the build-test leg on this machine: the
      # module cache persists between jobs and Go leaves it read-only, so the
      # restore fails trying to unpack over it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # launchd does not order jobs relative to each other and `podman machine
      # start` takes 20-30s, so after a reboot a runner can pick up a job before
      # the VM is ready. Guard on state rather than calling start blindly: start
      # exits 125 when the machine is already running.
      - name: ensure the podman machine is up
        run: |
          set -euo pipefail
          if [ "$(podman machine inspect --format '{{.State}}' podman-machine-default)" != "running" ]; then
            echo "machine was down; starting it"
            podman machine start
          fi
          podman info --format '{{.Version.Version}} | {{.Host.Arch}} | rootless={{.Host.Security.Rootless}}'

      - name: install cs-sandbox and cs-vcr
        run: |
          set -euo pipefail
          make tools
          echo "$PWD/bin/tools" >> "$GITHUB_PATH"

      # The architecture is checked rather than assumed. An emulated guest is
      # the failure this whole job exists to prevent, and it announces itself
      # here or nowhere: three scenarios later it is an agent that would not
      # answer.
      - name: build it
        run: |
          set -euo pipefail
          cs-sandbox build --engine podman --slim
          got=$(podman image inspect --format '{{.Architecture}}' "$CS_SANDBOX_IMAGE")
          echo "built $got $CS_SANDBOX_IMAGE"
          [ "$got" = "arm64" ] || {
            echo "::error::$CS_SANDBOX_IMAGE is a $got image on an arm64 machine"
            exit 1
          }

  # The whole tier again on macOS, on this project's own self-hosted runners.
  #
  # This is the only job that exercises the macOS host paths against a real
  # engine: the state root, the ssh config the host's own ssh must parse, and
  # every path a member is given having to live under $HOME — the podman machine
  # mounts nothing else, so a subject repository under /var/folders is refused
  # by cs-sandbox outright. GitHub's own arm64 macOS runners cannot stand in for
  # this and never will: they are "Apple M1 (Virtual)" VMs reporting
  # kern.hv_support=0, so no podman machine can boot inside one.
  #
  # Firecracker is not on offer here — macOS has no KVM — so this is the podman
  # engine, and the hosted podman job above is what tells a macOS failure apart
  # from an engine failure.
  #
  # Three at a time, because that is how many runners this repository has on
  # that machine. The bound is written down rather than left to the pool: the
  # machine also carries the sibling project's runners, all of them sharing one
  # podman machine and one 16 GB box, and a campaign is two members plus a
  # lender plus a recorder. Six legs at once is not a thing this hardware should
  # be asked for, and max-parallel says so where a reader can see it.
  smoke-macos-arm64:
    name: smoke podman (macos-arm64 / ${{ matrix.scenario }})
    needs: [build-test, image-macos-arm64]
    # Skips cleanly for fork PRs — unlike the build-test leg, which is inside a
    # matrix and has to fail instead. Same accident-guard caveat applies: the
    # repository's "require approval for all external contributors" setting is
    # what actually protects this machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Held against internal/cli/livecampaign_test.go's scenarios() by
        # TestWorkflowRunsEveryScenario, so a scenario added there cannot
        # quietly stop being run here.
        scenario:
          - claude-subscription
          - claude-api-key
          - codex-subscription
          - codex-api-key
          - opencode-fireworks
          - claude-inherit
    env:
      SMOKE_ENGINE: podman
      # The arm64 image the job above built, not the published amd64 leaf.
      CS_SANDBOX_IMAGE: localhost/campaign-slim:ci-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: is there a cassette to replay?
        id: cassette
        run: |
          set -euo pipefail
          if compgen -G "test/cassettes/${{ matrix.scenario }}/*/index.jsonl" >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no cassette for ${{ matrix.scenario }}; record one with \`./scripts/record-fixtures.sh ${{ matrix.scenario }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ensure the podman machine is up
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [ "$(podman machine inspect --format '{{.State}}' podman-machine-default)" != "running" ]; then
            echo "machine was down; starting it"
            podman machine start
          fi

      - name: install cs-sandbox and cs-vcr
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          make tools
          echo "$PWD/bin/tools" >> "$GITHUB_PATH"

      # Built by image-macos-arm64, and native to this machine. Named rather
      # than assumed: without it the first thing to fail would be a scenario,
      # and it would look like the agent's fault.
      #
      # The image and its architecture, and NOT `cs-sandbox doctor`, which the
      # hosted podman job above does gate on. The doctor's verdict is host-wide:
      # it reports on every group present, so on this machine it reports on the
      # two other scenarios running beside this one. Measured on 2026-09-09: a
      # leg failed here because a neighbouring leg's lender was up and mid-replay,
      # and the doctor called that host unready — "no openai key to lend", of a
      # campaign that lends a fabricated one and passed. A gate that another job
      # can turn red is not a gate on this one.
      - name: the image this machine built
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -euo pipefail
          podman image exists "$CS_SANDBOX_IMAGE" || {
            echo "::error::$CS_SANDBOX_IMAGE is not on this machine — image-macos-arm64 builds it"
            exit 1
          }
          podman image inspect --format 'image arch: {{.Architecture}}' "$CS_SANDBOX_IMAGE"

      # Kept, because the teardown below reads it: the tier logs the network it
      # put each campaign on, and that is the only record of what this leg has
      # to clean up on a machine several jobs share. pipefail so `tee` cannot
      # turn a failed run green.
      - name: smoke
        if: steps.cassette.outputs.present == 'true'
        run: |
          set -o pipefail
          make test-smoke SMOKE_TESTS='TestSmokeReplay/${{ matrix.scenario }}' 2>&1 | tee smoke.log

      - name: a leg with no cassette is not a pass
        if: steps.cassette.outputs.present != 'true'
        run: |
          echo "no cassette for ${{ matrix.scenario }} — it was not replayed" >&2
          exit 1

      - name: keep the evidence of a failed run
        if: failure() && steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos-evidence-${{ matrix.scenario }}
          path: |
            .tmp/live-evidence/
            .tmp/live-proxy/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: keep this job's coverage
        if: steps.cassette.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-macos-${{ matrix.scenario }}
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # This runner is not ephemeral, so something has to clean up — and it must
      # clean up THIS leg only: two more scenarios are running beside it on this
      # machine, and the sibling project's own jobs are too. `podman rm -f
      # --all` here would take all of them.
      #
      # A campaign that reached its verdict has already torn itself down, and
      # one that failed is torn down by the tier's own cleanup. What this
      # catches is the run that died between the two — a killed process, a
      # cancelled job — and the groups it names are the ones this leg's own log
      # says it created, so nothing else on the machine can be caught by it.
      #
      # Best-effort throughout: a cleanup failure must not turn a passing
      # scenario red.
      - name: tear down what this scenario left
        if: always() && steps.cassette.outputs.present == 'true'
        run: |
          set -uo pipefail
          test -f smoke.log || exit 0
          grep -oE 'cs-sandbox-cs[a-z0-9]+-[0-9a-f]{8}' smoke.log | sort -u |
            while read -r net; do
              group=${net#cs-sandbox-}
              podman network exists "$net" || continue
              echo "removing the group $group"
              ./bin/tools/cs-sandbox group rm "$group" -f || podman network rm -f "$net" || true
            done
          echo "--- campaign groups still on this machine, for the sweep ---"
          podman network ls --filter name=cs-sandbox-cs --format '{{.Name}}' || true

  # The behaviour map is committed, and it is a pure function of the rubric and
  # the run records. A stale page is a merge gate rather than a confusing diff
  # somebody finds later.
  covmap:
    name: behaviour map
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: the committed page is what the rubric renders
        run: |
          set -euo pipefail
          go test ./internal/covmap/... -run TestCoverageHTMLCurrent -count=1
          git diff --exit-code -- covmap/

  # One number for the whole run, and the gate that keeps it honest.
  #
  # Every job above uploads its tier rather than judging it, because each sees
  # only the part of the suite it ran: the unit leg never boots a machine, and
  # the smoke job never runs the unit tier. Merged here they are one picture,
  # which is the only one worth reporting or gating on.
  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    needs: [build-test, smoke-firecracker, smoke-podman, smoke-macos-arm64]
    if: always() && needs.build-test.result == 'success'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: collect every tier
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: .coverage-artifacts

      # Unpacked side by side as <tier>@<job> rather than merged into one
      # directory per tier: covdata data files are named after a build hash, so
      # two jobs' files would collide on name while differing in content.
      # scripts/coverage.sh treats every <tier>@* directory as that tier.
      #
      # Found by searching rather than by walking one fixed level down, because
      # download-artifact does not always put an artifact in a directory of its
      # own: it unpacks straight into `path` when exactly one artifact matched
      # the pattern. So the depth here depends on how many jobs uploaded, and a
      # loop written for the many-artifact shape silently assembles nothing on
      # the day only one did.
      - name: assemble the tiers
        run: |
          set -euo pipefail
          mkdir -p .coverage
          while IFS= read -r dir; do
            tier=$(basename "$dir")
            job=$(basename "$(dirname "$dir")"); job=${job#coverage-}
            # The flat shape above: the tier's parent is the download root
            # itself, which names no job, so the tier names it.
            [ "$job" = ".coverage-artifacts" ] && job=$tier
            cp -a "$dir" ".coverage/$tier@$job"
          done < <(find .coverage-artifacts -type d \( -name unit -o -name smoke \) | sort)
          echo "tier directories assembled:"
          find .coverage -mindepth 1 -maxdepth 1 -type d -printf '  %f\n' | sort

      # Prints the aggregate to the job summary and fails if a package the
      # baseline records has stopped being reached by the tier that reached it.
      - name: report and gate
        run: make coverage-check
